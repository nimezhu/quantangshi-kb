<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（164-15）</a>清平調詞三首<span class="badge badge-form">七言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十四 · 三百首 第 264/330 首 · 乐府、女子、赞美</span></div>
<div class="poem" id="p15"><div class="poem-body solo-body">
<div class="line">雲想衣裳花相容，春風拂檻露華濃。</div>
<div class="line">若非<span class="ent ent-place" data-note="西王母所居">群玉山</span>頭見，會向<span class="ent ent-place" data-note="仙台">瑤台</span>月下逢。</div>
<div class="line">一枝穠豔露凝香，雲雨<span class="ent ent-place" data-note="楚王神女云雨典">巫山</span>枉斷腸。</div>
<div class="line">借問<span class="ent ent-place" data-note="以汉宫喻唐宫">漢宮</span>誰得似，可憐<span class="ent ent-person" data-note="赵飞燕">飛燕</span>倚新妝。</div>
<div class="line">名花傾國兩相歡，長得君王帶笑看。</div>
<div class="line">解釋春風無限恨，<span class="ent ent-place" data-note="兴庆宫沉香亭">沉香亭</span>北倚闌干。</div>
</div></div></main>
