<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（164-15）</a>清平調詞三首<span class="badge badge-form">七言古體</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十四 · 三百首 第 227/321 首 · 女子、近代曲辞、乐府</span></div>
<div class="poem" id="p15"><div class="poem-body solo-body">
<div class="line">雲想衣裳花相容，春風拂檻露華濃。</div>
<div class="line">若非群玉山頭見，會向瑤台月下逢。</div>
<div class="line">一枝穠豔露凝香，雲雨巫山枉斷腸。</div>
<div class="line">借問漢宮誰得似，可憐飛燕倚新妝。</div>
<div class="line">名花傾國兩相歡，長得君王帶笑看。</div>
<div class="line">解釋春風無限恨，沉香亭北倚闌干。</div>
</div></div></main>
