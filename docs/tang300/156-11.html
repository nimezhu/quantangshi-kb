<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（156-11）</a>涼州詞二首<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%BF%B0.html">王翰</a><span class="solo-vol"> · 卷一百五十六 · 三百首 第 88/321 首 · 豪放、战争、边塞</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">蒲萄美酒夜光杯，欲飲琵琶馬上催。</div>
<div class="line">醉臥沙場君莫笑，古來征戰幾人回。</div>
<div class="line">秦中花鳥已應闌，塞外風沙猶自寒。</div>
<div class="line">夜聽胡笳折楊柳，教人意氣憶<a class="ent ent-place" href="../entities/place_%E9%95%BF%E5%AE%89.html">長安</a>。</div>
</div></div></main>
