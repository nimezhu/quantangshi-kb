<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（540-84）</a>常娥<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十 · 三百首 第 193/327 首 · 孤独、中秋、写人</span></div>
<div class="poem" id="p84"><div class="poem-body solo-body">
<div class="line">雲母屏風燭影深，長河漸落曉星沈。</div>
<div class="line"><span class="ent ent-person" data-note="嫦娥偷灵药奔月，碧海青天夜夜心">常娥</span>應悔偷靈藥，碧海青天夜夜心。</div>
</div></div></main>
