<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（279-68）</a>晚次鄂州<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E7%9B%A7%E7%B6%B8.html">盧綸</a><span class="solo-vol"> · 卷二百七十九 · 三百首 第 118/321 首 · 战争、写景、抒情</span></div>
<div class="poem" id="p68"><div class="poem-body solo-body">
<div class="line">雲開遠見漢<a class="ent ent-place" href="../entities/place_%E9%98%B3%E5%9F%8E.html">陽城</a>，猶是孤帆一日程。</div>
<div class="line">估客晝眠知浪靜，舟人夜語覺潮生。</div>
<div class="line">三湘衰鬢逢秋色，萬里歸心對月明。</div>
<div class="line">舊業已隨征戰盡，更堪江上鼓鼙聲。</div>
</div></div></main>
