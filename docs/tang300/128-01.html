<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-01）</a>奉和聖制從蓬萊向興慶閣道中留春雨中春望之作應制<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 135/327 首 · 黄山、应制、七言律诗</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="萦秦塞">渭水</span>自縈<span class="ent ent-place" data-note="地名 · 精标">秦塞</span>曲，<span class="ent ent-place" data-note="汉黄山宫，在兴平">黃山</span>舊遶<span class="ent ent-place" data-note="以汉宫喻唐宫">漢宮</span>斜。</div>
<div class="line">鑾輿迥出千門柳，閣道廻看<span class="ent ent-place" data-note="上林苑">上苑</span>花。</div>
<div class="line">雲裏帝城雙<span class="ent ent-place" data-note="帝城双凤阙">鳳闕</span>，雨中春樹萬人家。</div>
<div class="line">爲乘陽氣行時令，不是宸遊玩物華。</div>
</div></div></main>
