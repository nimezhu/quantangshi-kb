<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（186-08）</a>淮上喜會梁川故人<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百八十六 · 三百首 第 67/330 首 · 友情、五言律诗</span></div>
<div class="poem" id="p08"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="江汉之间曾为客">江漢</span>曾為客，相逢每醉還。</div>
<div class="line">浮雲一別後，流水十年間。</div>
<div class="line">歡笑情如舊，蕭疏鬢已斑。</div>
<div class="line">何因北歸去，<span class="ent ent-place" data-note="淮水之滨">淮上</span>對秋山。</div>
</div></div></main>
