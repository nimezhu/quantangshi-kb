<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（180-17）</a>登金陵鳳凰台<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百八十 · 三百首 第 99/321 首 · 隋・唐・五代、七言律诗、一年级下册</span></div>
<div class="poem" id="p17"><div class="poem-body solo-body">
<div class="line">鳳凰臺上鳳凰遊，鳳去臺空江自流。</div>
<div class="line">吳宮花草埋幽徑，晉代衣冠成古丘。</div>
<div class="line">三山半落青天外，二水中分白鷺洲。</div>
<div class="line">總爲浮雲能蔽日，<a class="ent ent-place" href="../entities/place_%E9%95%BF%E5%AE%89.html">長安</a>不見使人愁。</div>
</div></div></main>
