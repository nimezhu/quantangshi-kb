<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-19）</a>積雨輞川莊作<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 114/327 首 · 七言律诗、田园</span></div>
<div class="poem" id="p19"><div class="poem-body solo-body">
<div class="line">積雨空林煙火遲，蒸藜炊黍餉東菑。</div>
<div class="line">漠漠水田飛白鷺，陰陰夏木囀黃鸝。</div>
<div class="line">山中習靜觀朝槿，松下清齋折露葵。</div>
<div class="line">野老與人爭席罷，海鷗何事更相疑。</div>
</div></div></main>
