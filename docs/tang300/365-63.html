<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（365-63）</a>和樂天春詞<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E7%A6%B9%E9%8C%AB.html">劉禹錫</a><span class="solo-vol"> · 卷三百六十五 · 三百首 第 158/330 首 · 孤独、春天、女子</span></div>
<div class="poem" id="p63"><div class="poem-body solo-body">
<div class="line">新妝面面下朱樓，深鎖春光一院愁。</div>
<div class="line">行到中庭數花朵，蜻蜓飛上玉搔頭。</div>
</div></div></main>
