<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-65）</a>寄令狐郎中<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 178/321 首 · 思念、写景、七言绝句</span></div>
<div class="poem" id="p65"><div class="poem-body solo-body">
<div class="line">嵩雲秦樹久離居，雙鯉迢迢一紙書。</div>
<div class="line">休問梁園舊賓客，茂陵秋雨病<a class="ent ent-person" href="../entities/person_%E7%9B%B8%E5%A6%82.html">相如</a>。</div>
</div></div></main>
