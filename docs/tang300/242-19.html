<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（242-19）</a>楓橋夜泊<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E7%B9%BC.html">張繼</a><span class="solo-vol"> · 卷二百四十二 · 三百首 第 189/327 首 · 写景、秋天、七言绝句</span></div>
<div class="poem" id="p19"><div class="poem-body solo-body">
<div class="line">月落烏啼霜滿天，江楓漁父對愁眠。</div>
<div class="line"><a class="ent ent-place" data-note="苏州" href="../entities/place_%E5%A7%91%E8%8B%8F.html">姑蘇</a>城外<span class="ent ent-place" data-note="枫桥畔古寺">寒山寺</span>，夜半鐘聲到客船。</div>
</div></div></main>
