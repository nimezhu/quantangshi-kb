<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-05）</a>和賈舍人早朝大明宮之作<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 127/321 首 · 宫廷、七言律诗、早朝</span></div>
<div class="poem" id="p05"><div class="poem-body solo-body">
<div class="line">絳幘雞人送曉籌，尚衣方進翠雲裘。</div>
<div class="line">九天閶闔開宮殿，萬國衣冠拜冕旒。</div>
<div class="line">日色纔臨仙掌動，香煙欲傍衮龍浮。</div>
<div class="line">朝罷須裁五色詔，佩聲歸向鳳池頭。</div>
</div></div></main>
