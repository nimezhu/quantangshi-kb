<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（578-08）</a>利州南渡<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%BA%AB%E5%BA%AD%E7%AD%A0.html">溫庭筠</a><span class="solo-vol"> · 卷五百七十八 · 三百首 第 120/327 首 · 七言律诗、抒怀、渡江</span></div>
<div class="poem" id="p08"><div class="poem-body solo-body">
<div class="line">澹然空水對斜暉，曲島蒼茫接翠微。</div>
<div class="line">波上馬嘶看櫂去，柳邊人歇待船歸。</div>
<div class="line">數叢沙草羣鷗散，萬頃江田一鷺飛。</div>
<div class="line">誰解乘舟尋<a class="ent ent-person" data-note="功成身退泛五湖" href="../entities/person_%E8%8C%83%E8%A0%A1.html">范蠡</a>，<a class="ent ent-place" data-note="烟水忘机" href="../entities/place_%E4%BA%94%E6%B9%96.html">五湖</a>煙水獨忘機。</div>
</div></div></main>
