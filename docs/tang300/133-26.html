<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（133-26）</a>古意<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E9%A0%8E.html">李頎</a><span class="solo-vol"> · 卷一百三十三 · 三百首 第 300/321 首 · 战争、豪侠、拟古</span></div>
<div class="poem" id="p26"><div class="poem-body solo-body">
<div class="line">男兒事長征，少小幽燕客。</div>
<div class="line">賭勝馬蹄下，由來輕七尺。</div>
<div class="line">殺人莫敢前，鬚如蝟毛磔。</div>
<div class="line">黃雲隴底白雪飛，未得報恩不能歸。</div>
<div class="line"><a class="ent ent-place" href="../entities/place_%E8%BE%BD%E4%B8%9C.html">遼東</a>小婦年十五，慣彈琵琶解歌舞。</div>
<div class="line">今爲羗笛出塞聲，使我三軍淚如雨。</div>
</div></div></main>
