<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（525-37）</a>旅宿<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十五 · 三百首 第 51/330 首 · 羁旅、思乡、五言律诗</span></div>
<div class="poem" id="p37"><div class="poem-body solo-body">
<div class="line">旅館無良伴，凝情自悄然。</div>
<div class="line">寒燈思舊事，斷雁警愁眠。</div>
<div class="line">遠夢歸侵曉，家書到來年。</div>
<div class="line"><a class="ent ent-place" data-note="好烟月，门系钓鱼船" href="../entities/place_%E6%B9%98%E6%B1%9F.html">湘江</a>好煙月，門系釣魚船。</div>
</div></div></main>
