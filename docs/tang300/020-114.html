<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（020-114）</a>相和歌辭：玉階怨<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷二十 · 三百首 第 279/327 首 · 孤独、宫怨、乐府</span></div>
<div class="poem" id="p114"><div class="poem-body solo-body">
<div class="line">玉階生白露，夜久侵羅襪。</div>
<div class="line">卻下水精簾，玲瓏望秋月。</div>
</div></div></main>
