<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-17）</a>蟬<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 23/330 首 · 咏物、咏物诗、五言律诗</span></div>
<div class="poem" id="p17"><div class="poem-body solo-body">
<div class="line">本以高難飽，徒勞恨費聲。</div>
<div class="line">五更疏欲斷，一樹碧無情。</div>
<div class="line">薄宦梗猶泛，故園蕪已平。</div>
<div class="line">煩君最相警，我亦舉家清。</div>
</div></div></main>
