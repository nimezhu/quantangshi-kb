<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（523-19）</a>泊秦淮<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十三 · 三百首 第 145/321 首 · 隋・唐・五代、爱国、写景</span></div>
<div class="poem" id="p19"><div class="poem-body solo-body">
<div class="line">煙籠寒水月籠沙，夜泊秦淮近酒家。</div>
<div class="line">商女不知亡國恨，隔江猶唱後庭花。</div>
</div></div></main>
