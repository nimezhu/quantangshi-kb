<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（283-18）</a>喜見外弟又言別<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%9B%8A.html">李益</a><span class="solo-vol"> · 卷二百八十三 · 三百首 第 20/330 首 · 离别、五言律诗</span></div>
<div class="poem" id="p18"><div class="poem-body solo-body">
<div class="line">十年離亂後，長大一相逢。</div>
<div class="line">問姓驚初見，稱名憶舊容。</div>
<div class="line">別來滄海事，語罷暮天鐘。</div>
<div class="line">明日<span class="ent ent-place" data-note="今岳阳">巴陵</span>道，秋山又幾重。</div>
</div></div></main>
