<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（523-69）</a>贈別二首<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十三 · 三百首 第 94/327 首 · 七言绝句、惜别、离别</span></div>
<div class="poem" id="p69"><div class="poem-body solo-body">
<div class="line">娉娉褭褭十三餘，豆蔻梢頭二月初。</div>
<div class="line">春風十裏<a class="ent ent-place" data-note="春风十里扬州路" href="../entities/place_%E6%89%AC%E5%B7%9E.html">揚州</a>路，卷上珠簾總不如。</div>
<div class="line">多情卻似總無情，唯覺尊前笑不成。</div>
<div class="line">蠟燭有心還惜別，替人垂淚到天明。</div>
</div></div></main>
