<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（052-52）</a>題大庾嶺北驛<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%AE%8B%E4%B9%8B%E5%95%8F.html">宋之問</a><span class="solo-vol"> · 卷五十二 · 三百首 第 43/321 首 · 五言律诗、思乡、带有地名</span></div>
<div class="poem" id="p52"><div class="poem-body solo-body">
<div class="line">陽月南飛雁，傳聞至此回。</div>
<div class="line">我行殊未已，何日複歸來。</div>
<div class="line">江靜潮初落，林昏瘴不開。</div>
<div class="line">明朝望鄉處，應見隴頭梅。</div>
</div></div></main>
