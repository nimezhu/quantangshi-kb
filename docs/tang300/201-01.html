<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（201-01）</a>奉和中書舍人賈至早朝大明宮<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E5%B2%91%E5%8F%83.html">岑參</a><span class="solo-vol"> · 卷二百零一 · 三百首 第 125/321 首 · 七言律诗、唱和</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">雞鳴紫陌曙光寒，鶯囀皇州春色闌。</div>
<div class="line">金闕曉鐘開萬戶，玉階仙仗擁千官。</div>
<div class="line">花迎劒珮星初落，柳拂旌旗露未乾。</div>
<div class="line">獨有鳳皇池上客，陽春一曲和皆難。</div>
</div></div></main>
