<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（673-24）</a>春宮怨<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%91%A8%E6%9C%B4.html">周樸</a><span class="solo-vol"> · 卷六百七十三 · 三百首 第 6/330 首 · 宫怨、春天、写景</span></div>
<div class="poem" id="p24"><div class="poem-body solo-body">
<div class="line">早被嬋娟誤，欲妝臨鏡慵。</div>
<div class="line">承恩不在貌，教妾若為容。</div>
<div class="line">風暖鳥聲碎，日高花影重。</div>
<div class="line">年年<span class="ent ent-place" data-note="若耶溪，西施浣纱处">越溪</span>女，相憶采芙蓉。</div>
</div></div></main>
