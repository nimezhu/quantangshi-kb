<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（165-28）</a>子夜吳歌：夏歌<span class="badge badge-form">五言古體</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十五 · 三百首 第 315/321 首 · 清商曲辞、夏天、乐府</span></div>
<div class="poem" id="p28"><div class="poem-body solo-body">
<div class="line">鏡湖三百里，菡萏發荷花。</div>
<div class="line">五月西施采，人看隘若耶。</div>
<div class="line">回舟不待月，歸去越王家。</div>
</div></div></main>
