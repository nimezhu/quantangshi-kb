<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（524-78）</a>秋夕<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十四 · 三百首 第 146/330 首</span></div>
<div class="poem" id="p78"><div class="poem-body solo-body">
<div class="line">紅燭秋光冷畫屏，輕羅小扇撲流螢。</div>
<div class="line">天階夜色涼如水，坐看<span class="ent ent-person" data-note="七夕双星">牽牛織女</span>星。</div>
</div></div></main>
