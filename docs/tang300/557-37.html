<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（557-37）</a>馬嵬坡<span class="badge badge-form">雜言</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%84%AD%E7%95%8B.html">鄭畋</a><span class="solo-vol"> · 卷五百五十七 · 三百首 第 170/327 首 · 七言绝句、带有地名、咏史</span></div>
<div class="poem" id="p37"><div class="poem-body solo-body">
<div class="line">[玄]宗回馬<span class="ent ent-person" data-note="杨贵妃">楊妃</span>死，雲雨雖亡日月新。</div>
<div class="line">終是聖明天子事，<span class="ent ent-place" data-note="陈后主偕妃投井处（胭脂井），讽亡国">景陽宮井</span>又何人。</div>
</div></div></main>
