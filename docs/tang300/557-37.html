<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（557-37）</a>馬嵬坡<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E9%84%AD%E7%95%8B.html">鄭畋</a><span class="solo-vol"> · 卷五百五十七 · 三百首 第 170/321 首 · 七言绝句、带有地名、咏史</span></div>
<div class="poem" id="p37"><div class="poem-body solo-body">
<div class="line">玄宗回馬楊妃死，雲雨雖亡日月新。</div>
<div class="line">終是聖明天子事，景陽宮井又何人。</div>
</div></div></main>
