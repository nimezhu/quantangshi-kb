<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（147-28）</a>新年作<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百四十七 · 三百首 第 13/321 首 · 五言律诗、春节、思乡</span></div>
<div class="poem" id="p28"><div class="poem-body solo-body">
<div class="line">鄉心新歲切，天畔獨潸然。</div>
<div class="line">老至居人下，春歸在客先。</div>
<div class="line">嶺猿同旦暮，江柳共風煙。</div>
<div class="line">已似<a class="ent ent-place" href="../entities/place_%E9%95%BF%E6%B2%99.html">長沙</a>傅，從今又幾年。</div>
</div></div></main>
