<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-93）</a>籌筆驛<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 126/321 首 · 隋・唐・五代、七言律诗、典故</span></div>
<div class="poem" id="p93"><div class="poem-body solo-body">
<div class="line">猿鳥猶疑畏簡書，風雲常爲護儲胥。</div>
<div class="line">徒令上將揮神筆，終見降王走傳車。</div>
<div class="line">管樂有才終不忝，關張無命欲何如。</div>
<div class="line">他年錦里經祠廟，<a class="ent ent-place" href="../entities/place_%E6%A2%81%E7%88%B6.html">梁父</a>吟成恨有餘。</div>
</div></div></main>
