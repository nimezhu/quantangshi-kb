<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（130-31）</a>黃鶴樓<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%B4%94%E9%A1%A5.html">崔顥</a><span class="solo-vol"> · 卷一百三十 · 三百首 第 94/330 首 · 黄鹤楼、隋・唐・五代、七言律诗</span></div>
<div class="poem" id="p31"><div class="poem-body solo-body">
<div class="line">昔人已乘白雲去，此地空餘<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E9%BB%84%E9%B9%A4%E6%A5%BC.html">黃鶴樓</a>。</div>
<div class="line">黃鶴一去不復返，白雲千載空悠悠。</div>
<div class="line">晴川歷歷<span class="ent ent-place" data-note="江对岸，晴川历历">漢陽</span>樹，春草萋萋<a class="ent ent-place" data-note="祢衡作《鹦鹉赋》处" href="../entities/place_%E9%B9%A6%E9%B9%89%E6%B4%B2.html">鸚鵡洲</a>。</div>
<div class="line">日暮鄉關何處是，煙波江上使人愁。</div>
</div></div></main>
