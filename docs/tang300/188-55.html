<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（188-55）</a>秋夜寄丘二十二員外<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百八十八 · 三百首 第 277/327 首 · 秋天、怀人、五言绝句</span></div>
<div class="poem" id="p55"><div class="poem-body solo-body">
<div class="line">懷君屬秋夜，散步詠涼天。</div>
<div class="line">山空松子落，幽人應未眠。</div>
</div></div></main>
