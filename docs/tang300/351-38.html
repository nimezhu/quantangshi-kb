<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（351-38）</a>登柳州城樓寄漳汀封連四州<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9F%B3%E5%AE%97%E5%85%83.html">柳宗元</a><span class="solo-vol"> · 卷三百五十一 · 三百首 第 117/327 首 · 七言律诗、抒情、怀人</span></div>
<div class="poem" id="p38"><div class="poem-body solo-body">
<div class="line">城上高樓接大荒，海天愁思正茫茫。</div>
<div class="line">驚風亂颭芙蓉水，密雨斜侵薜荔牆。</div>
<div class="line">嶺樹重遮千里目，江流曲似九廻腸。</div>
<div class="line">共來<a class="ent ent-nation" data-note="文身之地，柳州所在" href="../entities/nation_%E7%99%BE%E8%B6%8A.html">百越</a>文身地，猶自音書滯一鄉。</div>
</div></div></main>
