<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-52）</a>送別<span class="badge badge-form">五絕</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 190/321 首 · 五言绝句、送别、友情</span></div>
<div class="poem" id="p52"><div class="poem-body solo-body">
<div class="line">山中相送罷，日暮掩柴扉。</div>
<div class="line">春草明年綠，王孫歸不歸。</div>
</div></div></main>
