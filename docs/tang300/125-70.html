<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（125-70）</a>西施詠<span class="badge badge-form">五言排律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十五 · 三百首 第 272/321 首 · 隋・唐・五代、五言古诗、怀古</span></div>
<div class="poem" id="p70"><div class="poem-body solo-body">
<div class="line">豔色天下重，西施寧久微。</div>
<div class="line">朝仍越溪女，暮作吳宮妃。</div>
<div class="line">賤日豈殊眾，貴來方悟稀。</div>
<div class="line">邀人傅香粉，不自著羅衣。</div>
<div class="line">君寵益嬌態，君憐無是非。</div>
<div class="line">當時浣紗伴，莫得同車歸。</div>
<div class="line">持謝鄰家子，效顰安可希。</div>
</div></div></main>
