<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-09）</a>酬郭給事<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 118/330 首 · 酬和、七言律诗</span></div>
<div class="poem" id="p09"><div class="poem-body solo-body">
<div class="line">洞門高閣靄餘輝，桃李陰陰柳絮飛。</div>
<div class="line">禁裏疎鐘官舍晚，省中啼鳥吏人稀。</div>
<div class="line">晨搖玉佩趨金殿，夕奉天書拜瑣闈。</div>
<div class="line">強欲從君無那老，將因臥病解朝衣。</div>
</div></div></main>
