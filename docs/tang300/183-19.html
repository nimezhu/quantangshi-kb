<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（183-19）</a>聽蜀僧浚彈琴<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百八十三 · 三百首 第 61/327 首 · 音乐、五言律诗</span></div>
<div class="poem" id="p19"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-nation" data-note="蜀僧">蜀</span>僧抱綠綺，西下<a class="ent ent-place" data-note="西下峨眉峰" href="../entities/place_%E5%B3%A8%E7%9C%89.html">峨眉</a>峰。</div>
<div class="line">為我一揮手，如聽萬壑松。</div>
<div class="line">客心洗流水，餘響入霜鐘。</div>
<div class="line">不覺碧山暮，秋雲暗幾重。</div>
</div></div></main>
