<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（273-34）</a>客夜與故人偶集<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%88%B4%E5%8F%94%E5%80%AB.html">戴叔倫</a><span class="solo-vol"> · 卷二百七十三 · 三百首 第 79/327 首 · 友情、写景、秋天</span></div>
<div class="poem" id="p34"><div class="poem-body solo-body">
<div class="line">天秋月又滿，城闕夜千重。</div>
<div class="line">還作<a class="ent ent-place" data-note="还作江南会" href="../entities/place_%E6%B1%9F%E5%8D%97.html">江南</a>會，翻疑夢裏逢。</div>
<div class="line">風枝驚暗鵲，露草覆寒蛩。</div>
<div class="line">羈旅長堪醉，相留畏曉鐘。</div>
</div></div></main>
