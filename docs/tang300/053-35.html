<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（053-35）</a>渡漢江<span class="badge badge-form">五絕</span></h1>
<div class="poem-author"><a href="../authors/%E5%AE%8B%E4%B9%8B%E5%95%8F.html">宋之問</a><span class="solo-vol"> · 卷五十三 · 三百首 第 204/321 首 · 五言绝句、思乡、渡江</span></div>
<div class="poem" id="p35"><div class="poem-body solo-body">
<div class="line">嶺外音書斷，經冬複曆春。</div>
<div class="line">近鄉情更怯，不敢問來人。</div>
</div></div></main>
