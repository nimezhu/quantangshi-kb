<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（188-25）</a>寄李儋、元錫<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百八十八 · 三百首 第 121/321 首 · 思念、友人、忧国忧民</span></div>
<div class="poem" id="p25"><div class="poem-body solo-body">
<div class="line">去年花裏逢君別，今日花開已一年。</div>
<div class="line">世事茫茫難自料，春愁黯黯獨成眠。</div>
<div class="line">身多疾病思田里，邑有流亡愧俸錢。</div>
<div class="line">聞道欲來相問訊，西樓望月幾廻圓。</div>
</div></div></main>
