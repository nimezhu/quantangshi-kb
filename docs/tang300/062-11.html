<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（062-11）</a>和晉陵陸丞早春遊望<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E5%AF%A9%E8%A8%80.html">杜審言</a><span class="solo-vol"> · 卷六十二 · 三百首 第 53/330 首 · 春天、伤怀、和诗</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">獨有宦遊人，偏驚物候新。</div>
<div class="line">雲霞出海曙，梅柳渡江春。</div>
<div class="line">淑氣催黃鳥，晴光轉綠蘋。</div>
<div class="line">忽聞歌古調，歸思欲沾巾。</div>
</div></div></main>
