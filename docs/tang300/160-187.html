<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-187）</a>春曉<span class="badge badge-form">五絕</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 192/321 首 · 春、写景、一年级下册</span></div>
<div class="poem" id="p187"><div class="poem-body solo-body">
<div class="line">春眠不覺曉，處處聞啼鳥。</div>
<div class="line">夜來風雨聲，花落知多少。</div>
</div></div></main>
