<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（228-39）</a>登樓<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十八 · 三百首 第 93/327 首 · 隋・唐・五代、七言律诗、写景</span></div>
<div class="poem" id="p39"><div class="poem-body solo-body">
<div class="line">花近高樓傷客心，萬方多難此登臨。</div>
<div class="line"><span class="ent ent-place" data-note="成都锦江">錦江</span>春色來天地，<span class="ent ent-place" data-note="玉垒山">玉壘</span>浮雲變古今。</div>
<div class="line">北極朝廷終不改，<span class="ent ent-place" data-note="吐蕃入寇方向">西山</span>寇盜莫相侵。</div>
<div class="line">可憐<span class="ent ent-person" data-note="蜀后主刘禅，尚有祠庙">後主</span>還祠廟，日暮聊爲梁甫吟。</div>
</div></div></main>
