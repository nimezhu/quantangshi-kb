<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（253-01）</a>登鸛雀樓<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E4%B9%8B%E6%B8%99.html">王之渙</a><span class="solo-vol"> · 卷二百五十三 · 三百首 第 263/327 首 · 黄河、山水、励志</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">白日依山盡，<span class="ent ent-place" data-note="地名 · 精标">黃河</span>入海流。</div>
<div class="line">欲窮千里目，更上一層樓。</div>
</div></div></main>
