<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（525-26）</a>金谷園<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十五 · 三百首 第 168/330 首 · 七言绝句、怀古</span></div>
<div class="poem" id="p26"><div class="poem-body solo-body">
<div class="line">繁華事散逐香塵，流水無情草自春。</div>
<div class="line">日暮東風怨啼鳥，落花猶似<span class="ent ent-person" data-note="绿珠，坠楼报石崇">墮樓人</span>。</div>
</div></div></main>
