<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（225-49）</a>月夜憶舍弟<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十五 · 三百首 第 33/321 首 · 月夜、秋天、边塞</span></div>
<div class="poem" id="p49"><div class="poem-body solo-body">
<div class="line">戍鼓斷人行，秋邊一雁聲。</div>
<div class="line">露從今夜白，月是故鄉明。</div>
<div class="line">有弟皆分散，無家問死生。</div>
<div class="line">寄書長不避，況乃未休兵。</div>
</div></div></main>
