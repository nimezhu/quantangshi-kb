<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（529-38）</a>秋日赴闕題潼關驛樓<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E8%A8%B1%E6%B8%BE.html">許渾</a><span class="solo-vol"> · 卷五百二十九 · 三百首 第 76/330 首 · 写景、送别、五言律诗</span></div>
<div class="poem" id="p38"><div class="poem-body solo-body">
<div class="line">紅葉晚蕭蕭，長亭酒一瓢。</div>
<div class="line">殘雲歸<span class="ent ent-place" data-note="华山">太華</span>，疏雨過<span class="ent ent-place" data-note="中条山">中條</span>。</div>
<div class="line">樹色隨山迥，河聲入海遙。</div>
<div class="line"><span class="ent ent-place" data-note="京师">帝鄉</span>明日到，猶自夢漁樵。</div>
</div></div></main>
