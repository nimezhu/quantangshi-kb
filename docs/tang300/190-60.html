<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（190-60）</a>長安遇馮著<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百九十 · 三百首 第 58/327 首 · 叙事、同情、抒情</span></div>
<div class="poem" id="p60"><div class="poem-body solo-body">
<div class="line">客從東方來，衣上<span class="ent ent-place" data-note="长安东灞陵">灞陵</span>雨。</div>
<div class="line">問客何為來，采山因買斧。</div>
<div class="line">冥冥花正開，颺颺燕新乳。</div>
<div class="line">昨別今已春，鬢絲生幾縷。</div>
</div></div></main>
