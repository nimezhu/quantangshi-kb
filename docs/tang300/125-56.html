<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（125-56）</a>渭川田家<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十五 · 三百首 第 239/327 首 · 五言古诗、归隐、田园</span></div>
<div class="poem" id="p56"><div class="poem-body solo-body">
<div class="line">斜陽照墟落，窮巷牛羊歸。</div>
<div class="line">野老念牧童，倚杖候荊扉。</div>
<div class="line">雉雊麥苗秀，蠶眠桑葉稀。</div>
<div class="line">田夫荷鋤至，相見語依依。</div>
<div class="line">即此羨閒逸，悵然吟式微。</div>
</div></div></main>
