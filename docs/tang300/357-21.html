<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（357-21）</a>蜀先主廟<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E7%A6%B9%E9%8C%AB.html">劉禹錫</a><span class="solo-vol"> · 卷三百五十七 · 三百首 第 41/321 首 · 隋・唐・五代、咏史怀古、五言律诗</span></div>
<div class="poem" id="p21"><div class="poem-body solo-body">
<div class="line">天地英雄氣，千秋尚凜然。</div>
<div class="line">勢分三足鼎，業複五銖錢。</div>
<div class="line">得相能開國，生兒不象賢。</div>
<div class="line">淒涼蜀故妓，來舞魏宮前。</div>
</div></div></main>
