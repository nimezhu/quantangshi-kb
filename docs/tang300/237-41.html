<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（237-41）</a>穀口書齋寄楊補闕<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%8C%A2%E8%B5%B7.html">錢起</a><span class="solo-vol"> · 卷二百三十七 · 三百首 第 81/330 首 · 写景、五言律诗、邀请</span></div>
<div class="poem" id="p41"><div class="poem-body solo-body">
<div class="line">泉壑帶茅茨，雲霞生薜帷。</div>
<div class="line">竹憐新雨後，山愛夕陽時。</div>
<div class="line">閑鷺棲常早，秋花落更遲。</div>
<div class="line">家童掃蘿徑，昨與故人期。</div>
</div></div></main>
