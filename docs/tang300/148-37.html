<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（148-37）</a>尋南溪常山道人隱居<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百四十八 · 三百首 第 78/321 首 · 写景、五言律诗</span></div>
<div class="poem" id="p37"><div class="poem-body solo-body">
<div class="line">一路經行處，莓苔見履痕。</div>
<div class="line">白雲依靜渚，春草閉閑門。</div>
<div class="line">過雨看松色，隨山到水源。</div>
<div class="line">溪花與禪意，相對亦忘言。</div>
</div></div></main>
