<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（163-01）</a>關山月<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十三 · 三百首 第 281/321 首 · 中秋、边塞、山</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">明月出天山，蒼茫雲海間。</div>
<div class="line">長風幾萬里，吹度<a class="ent ent-place" href="../entities/place_%E7%8E%89%E9%97%A8%E5%85%B3.html">玉門關</a>。</div>
<div class="line">漢下白登道，胡窺青海灣。</div>
<div class="line">由來征戰地，不見有人還。</div>
<div class="line">[戍]客望邊色，思歸多苦顏。</div>
<div class="line">高樓當此夜，歎息未應閑。</div>
</div></div></main>
