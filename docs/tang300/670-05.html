<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（670-05）</a>貧女<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%A7%A6%E9%9F%9C%E7%8E%89.html">秦韜玉</a><span class="solo-vol"> · 卷六百七十 · 三百首 第 115/330 首 · 哲理、七言律诗、生活</span></div>
<div class="poem" id="p05"><div class="poem-body solo-body">
<div class="line">蓬門未識綺羅香，擬託良媒益自傷。</div>
<div class="line">誰愛風流高格調，共憐時世儉梳妝。</div>
<div class="line">敢將十指誇偏巧，不把雙眉鬬畫長。</div>
<div class="line">苦恨年年壓金線，爲他人作嫁衣裳。</div>
</div></div></main>
