<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（147-13）</a>聽彈琴<span class="badge badge-form">五絕</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百四十七 · 三百首 第 215/321 首 · 抒情、音乐、五言绝句</span></div>
<div class="poem" id="p13"><div class="poem-body solo-body">
<div class="line">泠泠七絲上，靜聽松風寒。</div>
<div class="line">古調雖自愛，今人多不彈。</div>
</div></div></main>
