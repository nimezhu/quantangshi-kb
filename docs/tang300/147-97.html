<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（147-97）</a>秋日登吳公臺上寺遠眺，寺即陳將吳明徹戰場<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百四十七 · 三百首 第 85/330 首 · 长江、怀古、秋天</span></div>
<div class="poem" id="p97"><div class="poem-body solo-body">
<div class="line">古台搖落後，秋日望鄉心。</div>
<div class="line">野寺人來少，雲峰水隔深。</div>
<div class="line">夕陽依舊壘，寒磬滿空林。</div>
<div class="line">惆悵<span class="ent ent-time" data-note="南朝旧事，长江独至今">南朝</span>事，長江獨至今。</div>
</div></div></main>
