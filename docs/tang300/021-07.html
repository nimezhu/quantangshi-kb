<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（021-07）</a>相和歌辭：子夜四時歌四首：春歌<span class="badge badge-form">五言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷二十一 · 三百首 第 329/330 首 · 清商曲辞、春天、女子</span></div>
<div class="poem" id="p07"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-nation" data-note="秦地">秦</span>地<span class="ent ent-person" data-note="《陌上桑》采桑女">羅敷</span>女，采桑綠水邊。</div>
<div class="line">素手青條上，紅妝白日鮮。</div>
<div class="line">蠶饑妾欲去，五馬莫留連。</div>
</div></div></main>
