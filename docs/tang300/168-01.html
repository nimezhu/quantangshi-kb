<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（168-01）</a>贈孟浩然<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十八 · 三百首 第 31/327 首 · 赠别、五言律诗、敬爱</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">吾愛<span class="ent ent-person" data-note="孟浩然">孟夫子</span>，風流天下聞。</div>
<div class="line">紅顏棄軒冕，白首臥松雲。</div>
<div class="line">醉月頻中聖，迷花不事君。</div>
<div class="line">高山安可仰，徒此揖清芬。</div>
</div></div></main>
