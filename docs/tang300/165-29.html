<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（165-29）</a>子夜吳歌：秋歌<span class="badge badge-form">五言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十五 · 三百首 第 322/330 首 · 思念、清商曲辞、妇女</span></div>
<div class="poem" id="p29"><div class="poem-body solo-body">
<div class="line"><a class="ent ent-place" data-note="一片月，万户捣衣" href="../entities/place_%E9%95%BF%E5%AE%89.html">長安</a>一片月，萬戶擣衣聲。</div>
<div class="line">秋風吹不盡，總是<span class="ent ent-place" data-note="玉门关">玉關</span>情。</div>
<div class="line">何日平<span class="ent ent-nation" data-note="邦国族群 · 精标">胡虜</span>，良人罷遠征。</div>
</div></div></main>
