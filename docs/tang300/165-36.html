<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（165-36）</a>長相思<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十五 · 三百首 第 282/321 首 · 思念、杂曲歌辞、乐府</span></div>
<div class="poem" id="p36"><div class="poem-body solo-body">
<div class="line">日色已盡花含煙，月明欲素愁不眠。</div>
<div class="line">趙瑟初停鳳凰柱，</div>
<div class="line">不信妾腸斷，歸來看取明鏡前。</div>
<div class="line">美人在時花滿堂，美人去後空餘床。</div>
<div class="line">床中繡被卷不寢，</div>
<div class="line">相思黃葉落，白露點青苔。</div>
</div></div></main>
