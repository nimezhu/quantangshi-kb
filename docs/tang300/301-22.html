<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（301-22）</a>新嫁娘詞三首<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E5%BB%BA.html">王建</a><span class="solo-vol"> · 卷三百零一 · 三百首 第 295/330 首 · 新婚、五言绝句、女子</span></div>
<div class="poem" id="p22"><div class="poem-body solo-body">
<div class="line">鄰家人未識，床上坐堆堆。</div>
<div class="line">郎來傍門戶，滿口索錢財。</div>
<div class="line">錦幛兩邊橫，遮掩侍娘行。</div>
<div class="line">遣郎鋪簟席，相並拜親情。</div>
<div class="line">三日入廚下，洗手作羹湯。</div>
<div class="line">未諳姑食性，先遣小姑嘗。</div>
</div></div></main>
