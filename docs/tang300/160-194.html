<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-194）</a>宿建德江<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 257/327 首 · 描写水、写景、思乡</span></div>
<div class="poem" id="p194"><div class="poem-body solo-body">
<div class="line">移舟泊煙渚，日暮客愁新。</div>
<div class="line">野曠天低樹，江清月近人。</div>
</div></div></main>
