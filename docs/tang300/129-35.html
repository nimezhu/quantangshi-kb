<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（129-35）</a>崔九欲往南山馬上口號與別<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E8%A3%B4%E8%BF%AA.html">裴迪</a><span class="solo-vol"> · 卷一百二十九 · 三百首 第 244/330 首 · 离别、五言绝句、规劝</span></div>
<div class="poem" id="p35"><div class="poem-body solo-body">
<div class="line">歸山深淺去，須盡丘壑美。</div>
<div class="line">莫學<span class="ent ent-person" data-note="桃源渔人，暂游辄返">武陵人</span>，暫遊<span class="ent ent-place" data-note="桃花源">桃源</span>裏。</div>
</div></div></main>
