<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（523-15）</a>赤壁<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十三 · 三百首 第 142/330 首 · 隋・唐・五代、战争、八年级下册(课内)</span></div>
<div class="poem" id="p15"><div class="poem-body solo-body">
<div class="line">折戟沈沙鐵未銷，自將磨洗認前朝。</div>
<div class="line">東風不與<span class="ent ent-person" data-note="周瑜，赤壁借东风破曹">周郎</span>便，<span class="ent ent-place" data-note="曹操铜雀台">銅雀</span>春深鎖<span class="ent ent-person" data-note="江东二乔，大乔适孙策、小乔适周瑜">二喬</span>。</div>
</div></div></main>
