<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（589-55）</a>渡漢江<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E9%A0%BB.html">李頻</a><span class="solo-vol"> · 卷五百八十九 · 三百首 第 250/330 首 · 五言绝句、思乡、渡江</span></div>
<div class="poem" id="p55"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="五岭之南">嶺外</span>音書絕，經年複曆春。</div>
<div class="line">近鄉情更怯，不敢問來人。</div>
</div></div></main>
