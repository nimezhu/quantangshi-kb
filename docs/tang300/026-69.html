<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（026-69）</a>雜曲歌辭：獨不見<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E6%B2%88%E4%BD%BA%E6%9C%9F.html">沈佺期</a><span class="solo-vol"> · 卷二十六 · 三百首 第 89/321 首 · 思念、闺怨、乐府</span></div>
<div class="poem" id="p69"><div class="poem-body solo-body">
<div class="line">盧家小婦鬱金堂，海燕雙栖玳瑁梁。</div>
<div class="line">九月寒砧催下葉，十年征戍憶遼陽。</div>
<div class="line">白狼<a class="ent ent-place" href="../entities/place_%E6%B2%B3%E5%8C%97.html">河北</a>音書斷，丹鳳城南秋夜長。</div>
<div class="line">誰知含愁獨不見，使妾明月照流黃。</div>
</div></div></main>
