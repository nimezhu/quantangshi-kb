<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（188-31）</a>寄全椒山中道士<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百八十八 · 三百首 第 68/321 首 · 五言古诗、怀念</span></div>
<div class="poem" id="p31"><div class="poem-body solo-body">
<div class="line">今朝郡齋冷，忽念山中客。</div>
<div class="line">澗底束荊薪，歸來煮白石。</div>
<div class="line">欲持一瓢酒，遠慰風雨夕。</div>
<div class="line">落葉滿空山，何處尋行跡。</div>
</div></div></main>
