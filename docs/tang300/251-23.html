<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（251-23）</a>春怨<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E6%96%B9%E5%B9%B3.html">劉方平</a><span class="solo-vol"> · 卷二百五十一 · 三百首 第 215/327 首 · 孤独、七言绝句、宫怨</span></div>
<div class="poem" id="p23"><div class="poem-body solo-body">
<div class="line">紗窗日落漸黃昏，<span class="ent ent-place" data-note="汉武帝金屋藏娇典">金屋</span>無人見淚痕。</div>
<div class="line">寂寞空庭春欲晚，梨花滿地不開門。</div>
</div></div></main>
