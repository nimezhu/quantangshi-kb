<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（125-39）</a>送綦毋潛落第還鄉<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十五 · 三百首 第 250/327 首 · 送别、五言古诗、慰勉</span></div>
<div class="poem" id="p39"><div class="poem-body solo-body">
<div class="line">聖代無隱者，英靈盡來歸。</div>
<div class="line">遂令<span class="ent ent-place" data-note="谢安东山高卧，喻隐者">東山</span>客，不得顧采薇。</div>
<div class="line">既至君門遠，孰雲吾道非。</div>
<div class="line"><a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E6%B1%9F%E6%B7%AE.html">江淮</a>度<a class="ent ent-time" data-note="寒食节" href="../entities/time_%E5%AF%92%E9%A3%9F.html">寒食</a>，<span class="ent ent-place" data-note="长安与洛阳">京洛</span>縫春衣。</div>
<div class="line">置酒臨長道，同心與我違。</div>
<div class="line">行當浮桂棹，未幾拂荊扉。</div>
<div class="line">遠樹帶行客，孤村當落暉。</div>
<div class="line">吾謀適不用，勿謂知音稀。</div>
</div></div></main>
