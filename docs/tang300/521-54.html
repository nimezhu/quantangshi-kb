<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（521-54）</a>將赴吳興登樂游原一絕<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十一 · 三百首 第 211/327 首 · 七言绝句、爱国</span></div>
<div class="poem" id="p54"><div class="poem-body solo-body">
<div class="line">清時有味是無能，閑愛孤雲靜愛僧。</div>
<div class="line">欲把一麾江海去，<a class="ent ent-place" data-note="长安登览胜地" href="../entities/place_%E4%B9%90%E6%B8%B8%E5%8E%9F.html">樂游原</a>上望<span class="ent ent-place" data-note="唐太宗陵，望之思贞观">昭陵</span>。</div>
</div></div></main>
