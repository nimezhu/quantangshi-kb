<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（174-27）</a>渡荊門送別<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百七十四 · 三百首 第 11/327 首 · 长江、送别、五言律诗</span></div>
<div class="poem" id="p27"><div class="poem-body solo-body">
<div class="line">流遠<span class="ent ent-place" data-note="荆门山，楚蜀分界">荊門</span>外，來從<a class="ent ent-nation" data-note="邦国族群 · 精标" href="../entities/place_%E6%A5%9A%E5%9B%BD.html">楚國</a>遊。</div>
<div class="line">山隨平野盡，江入大荒流。</div>
<div class="line">月下飛天鏡，雲生結海樓。</div>
<div class="line">仍連故鄉水，萬里送行舟。</div>
</div></div></main>
