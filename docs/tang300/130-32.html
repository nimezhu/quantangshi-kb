<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（130-32）</a>行經華陰<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E5%B4%94%E9%A1%A5.html">崔顥</a><span class="solo-vol"> · 卷一百三十 · 三百首 第 131/321 首 · 七言律诗、怀古、山水</span></div>
<div class="poem" id="p32"><div class="poem-body solo-body">
<div class="line">岧嶤太華俯咸京，天外三峰削不成。</div>
<div class="line"><a class="ent ent-person" href="../entities/person_%E6%AD%A6%E5%B8%9D.html">武帝</a>祠前雲欲散，仙人掌上雨初晴。</div>
<div class="line"><a class="ent ent-place" href="../entities/place_%E6%B2%B3%E5%B1%B1.html">河山</a>北枕秦關險，驛樹西連漢畤平。</div>
<div class="line">借問路傍名利客，無如此處學長生。</div>
</div></div></main>
