<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（028-33）</a>雜曲歌辭：金縷衣<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E4%B8%8D%E8%A9%B3.html">不詳</a><span class="solo-vol"> · 卷二十八 · 三百首 第 162/330 首 · 惜时、励志、乐府</span></div>
<div class="poem" id="p33"><div class="poem-body solo-body">
<div class="line">勸君莫惜金縷衣，勸君惜取少年時。</div>
<div class="line">花開堪折直須折，莫待無花空折枝。</div>
</div></div></main>
