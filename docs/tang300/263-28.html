<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（263-28）</a>送李端<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%9A%B4%E7%B6%AD.html">嚴維</a><span class="solo-vol"> · 卷二百六十三 · 三百首 第 1/321 首 · 冬天、友情、送别</span></div>
<div class="poem" id="p28"><div class="poem-body solo-body">
<div class="line">故關衰草遍，離別正堪悲。</div>
<div class="line">路出寒雲外，人歸暮雪時。</div>
<div class="line">少孤為客早，多難識君遲。</div>
<div class="line">掩泣空相向，風塵何所期。</div>
</div></div></main>
