<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（165-25）</a>春思<span class="badge badge-form">五言古體</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十五 · 三百首 第 309/321 首 · 思念、五言古诗、春天</span></div>
<div class="poem" id="p25"><div class="poem-body solo-body">
<div class="line">燕草如碧絲，秦桑低綠枝。</div>
<div class="line">當君懷歸日，是妾斷腸時。</div>
<div class="line">春風不相識，何事入羅幃。</div>
</div></div></main>
