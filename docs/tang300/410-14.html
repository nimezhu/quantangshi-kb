<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（410-14）</a>行宮<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%85%83%E7%A8%B9.html">元稹</a><span class="solo-vol"> · 卷四百一十 · 三百首 第 273/327 首 · 隋・唐・五代、怀古、宫怨</span></div>
<div class="poem" id="p14"><div class="poem-body solo-body">
<div class="line">寥落古行宮，宮花寂寞紅。</div>
<div class="line">白頭宮女在，閑坐說<span class="ent ent-person" data-note="白头宫女闲坐说玄宗">玄宗</span>。</div>
</div></div></main>
