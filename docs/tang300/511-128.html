<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（511-128）</a>題金陵渡<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E7%A5%9C.html">張祜</a><span class="solo-vol"> · 卷五百一十一 · 三百首 第 214/327 首 · 抒情、七言绝句、旅途</span></div>
<div class="poem" id="p128"><div class="poem-body solo-body">
<div class="line"><a class="ent ent-place" data-note="金陵津渡" href="../entities/place_%E9%87%91%E9%99%B5.html">金陵</a>津渡小山樓，一宿行人自可愁。</div>
<div class="line">潮落夜江斜月裏，兩三星火是<span class="ent ent-place" data-note="瓜洲渡">瓜州</span>。</div>
</div></div></main>
