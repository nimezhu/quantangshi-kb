<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（151-37）</a>自夏口至鸚鵡洲，夕望岳陽，寄源中丞<span class="badge badge-form">七言古體</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百五十一 · 三百首 第 246/321 首 · 洞庭湖、贬谪、七言律诗</span></div>
<div class="poem" id="p37"><div class="poem-body solo-body">
<div class="line">汀洲無浪複無煙，楚客相思益渺然。</div>
<div class="line">漢口夕陽斜渡鳥，</div>
<div class="line"><a class="ent ent-person" href="../entities/person_%E8%B4%BE%E8%B0%8A.html">賈誼</a>上書憂漢室，<a class="ent ent-place" href="../entities/place_%E9%95%BF%E6%B2%99.html">長沙</a>謫去古今憐。</div>
</div></div></main>
