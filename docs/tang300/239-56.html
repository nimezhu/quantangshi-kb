<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（239-56）</a>和張僕射塞下曲<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%8C%A2%E8%B5%B7.html">錢起</a><span class="solo-vol"> · 卷二百三十九 · 三百首 第 255/327 首 · 战争、冬天、将军</span></div>
<div class="poem" id="p56"><div class="poem-body solo-body">
<div class="line">月黑雁飛高，<a class="ent ent-nation" data-note="匈奴最高首领，此指敌酋" href="../entities/nation_%E5%8D%95%E4%BA%8E.html">單于</a>夜遁逃。</div>
<div class="line">欲將輕騎逐，大雪滿弓刀。</div>
</div></div></main>
