<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-39）</a>輞川集：竹裏館<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 278/327 首 · 孤独、生活、初中古诗</span></div>
<div class="poem" id="p39"><div class="poem-body solo-body">
<div class="line">獨坐幽篁裏，彈琴複長嘯。</div>
<div class="line">深林人不知，明月來相照。</div>
</div></div></main>
