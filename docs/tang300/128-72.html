<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-72）</a>渭城曲<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 151/321 首 · 八年级下册(课外)、友情、小学古诗</span></div>
<div class="poem" id="p72"><div class="poem-body solo-body">
<div class="line"><a class="ent ent-place" href="../entities/place_%E6%B8%AD%E5%9F%8E.html">渭城</a>朝雨浥輕塵，客舍青青楊柳春。</div>
<div class="line">勸君更盡一杯酒，西出<a class="ent ent-place" href="../entities/place_%E9%98%B3%E5%85%B3.html">陽關</a>無故人。</div>
</div></div></main>
