<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（234-02）</a>虢國夫人<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百三十四 · 三百首 第 170/330 首 · 写人、七言绝句、讽刺</span></div>
<div class="poem" id="p02"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-person" data-note="杨贵妃姊，淡扫蛾眉朝至尊">虢國夫人</span>承主恩，平明上馬入宮門。</div>
<div class="line">卻嫌脂粉涴顏色，澹掃蛾眉朝至尊。</div>
</div></div></main>
