<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-14）</a>酬張少府<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 33/327 首 · 赠别、友情、规劝</span></div>
<div class="poem" id="p14"><div class="poem-body solo-body">
<div class="line">晚年唯好靜，萬事不關心。</div>
<div class="line">自顧無長策，空知返舊林。</div>
<div class="line">松風吹解帶，山月照彈琴。</div>
<div class="line">君問窮通理，漁歌入浦深。</div>
</div></div></main>
