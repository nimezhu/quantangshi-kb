<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（018-19）</a>橫吹曲辭：出塞<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E6%98%8C%E9%BD%A1.html">王昌齡</a><span class="solo-vol"> · 卷一十八 · 三百首 第 111/327 首 · 战争、写景、忧国忧民</span></div>
<div class="poem" id="p19"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-nation" data-note="秦汉互文">秦</span>時明月<span class="ent ent-nation" data-note="邦国族群 · 精标">漢</span>時關，萬里長征人未還。</div>
<div class="line">但使<span class="ent ent-person" data-note="指李广">龍城飛將</span>在，不教<span class="ent ent-nation" data-note="邦国族群 · 精标">胡</span>馬度<span class="ent ent-place" data-note="地名 · 精标">陰山</span>。</div>
<div class="line">白花垣上望<a class="ent ent-place" data-note="长安" href="../entities/place_%E4%BA%AC%E5%B8%88.html">京師</a>，<span class="ent ent-place" data-note="地名 · 精标">黃河</span>水流無盡時。</div>
<div class="line">窮秋曠野行人絕，馬首東來知是誰。</div>
</div></div></main>
