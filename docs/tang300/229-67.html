<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（229-67）</a>八陣圖<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十九 · 三百首 第 267/327 首 · 隋・唐・五代、怀古、哲理</span></div>
<div class="poem" id="p67"><div class="poem-body solo-body">
<div class="line">功蓋三分國，名高<span class="ent ent-place" data-note="诸葛亮夔州江滩八阵图遗迹">八陣圖</span>。</div>
<div class="line">江流石不轉，遺恨失吞<span class="ent ent-nation" data-note="遗恨失吞吴">吳</span>。</div>
</div></div></main>
