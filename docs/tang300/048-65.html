<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（048-65）</a>望月懷遠<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E4%B9%9D%E9%BD%A1.html">張九齡</a><span class="solo-vol"> · 卷四十八 · 三百首 第 29/321 首 · 思念、中秋节、中秋</span></div>
<div class="poem" id="p65"><div class="poem-body solo-body">
<div class="line">海上生明月，天涯共此時。</div>
<div class="line">情人怨遙夜，竟夕起相思。</div>
<div class="line">滅燭憐光滿，披衣覺露滋。</div>
<div class="line">不堪盈手贈，還寢夢佳期。</div>
</div></div></main>
