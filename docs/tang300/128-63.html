<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-63）</a>相思<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 259/327 首 · 思念、咏物、抒情</span></div>
<div class="poem" id="p63"><div class="poem-body solo-body">
<div class="line">紅豆生<span class="ent ent-place" data-note="南方，红豆产地">南國</span>，秋來發故枝。</div>
<div class="line">願君多採擷，此物最相思。</div>
</div></div></main>
