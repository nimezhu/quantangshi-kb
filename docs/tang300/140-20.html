<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（140-20）</a>同從弟銷南齋玩月憶山陰崔少府<span class="badge badge-form">五言排律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E6%98%8C%E9%BD%A1.html">王昌齡</a><span class="solo-vol"> · 卷一百四十 · 三百首 第 277/321 首 · 五言古诗、月亮、怀人</span></div>
<div class="poem" id="p20"><div class="poem-body solo-body">
<div class="line">高臥南齋時，開帷月初吐。</div>
<div class="line">清輝淡水木，演漾在窗戶。</div>
<div class="line">苒苒幾盈虛，澄澄變今古。</div>
<div class="line">美人清江畔，是夜越吟苦。</div>
<div class="line">千里其如何，微風吹蘭杜。</div>
</div></div></main>
