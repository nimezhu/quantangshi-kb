<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（226-38）</a>客至<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十六 · 三百首 第 86/327 首 · 喜悦、写景、友情</span></div>
<div class="poem" id="p38"><div class="poem-body solo-body">
<div class="line">舍南舍北皆春水，但見羣鷗日日來。</div>
<div class="line">花徑不曾緣客掃，蓬門今始爲君開。</div>
<div class="line">盤餐市遠無兼味，樽酒家貧只舊醅。</div>
<div class="line">肯與鄰翁相對飲，隔籬呼取盡餘桮。</div>
</div></div></main>
