<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（125-33）</a>送別<span class="badge badge-form">五言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十五 · 三百首 第 319/330 首 · 抒情、写景、友情</span></div>
<div class="poem" id="p33"><div class="poem-body solo-body">
<div class="line">下馬飲君酒，問君何所之。</div>
<div class="line">君言不得意，歸臥<a class="ent ent-place" data-note="終南山；歸臥南山陲，隱居之志" href="../entities/place_%E5%8D%97%E5%B1%B1.html">南山</a>陲。</div>
<div class="line">但去莫復問，白雲無盡時。</div>
</div></div></main>
