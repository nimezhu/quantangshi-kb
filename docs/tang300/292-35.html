<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（292-35）</a>賊平後送人北歸<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8F%B8%E7%A9%BA%E6%9B%99.html">司空曙</a><span class="solo-vol"> · 卷二百九十二 · 三百首 第 50/330 首 · 酬赠、感伤、五言律诗</span></div>
<div class="poem" id="p35"><div class="poem-body solo-body">
<div class="line">世亂同南去，時清獨北還。</div>
<div class="line">他鄉生白髮，舊國見青山。</div>
<div class="line">曉月過殘壘，繁星宿故關。</div>
<div class="line">寒禽與衰草，處處伴愁顏。</div>
</div></div></main>
