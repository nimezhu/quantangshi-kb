<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-113）</a>落花<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 20/321 首 · 咏物、五言律诗、写花</span></div>
<div class="poem" id="p113"><div class="poem-body solo-body">
<div class="line">高閣客竟去，小園花亂飛。</div>
<div class="line">參差連曲陌，迢遞送斜暉。</div>
<div class="line">腸斷未忍掃，眼穿仍欲歸。</div>
<div class="line">芳心向春盡，所得是沾衣。</div>
</div></div></main>
