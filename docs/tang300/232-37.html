<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（232-37）</a>江南逢李龜年<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百三十二 · 三百首 第 156/330 首 · 初中古诗、七言绝句、怀念</span></div>
<div class="poem" id="p37"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-person" data-note="玄宗弟李范，雅善音律">岐王</span>宅裏尋常見，<span class="ent ent-person" data-note="崔涤，玄宗宠臣">崔九</span>堂前幾度聞。</div>
<div class="line">正是<a class="ent ent-place" data-note="落花时节又逢君" href="../entities/place_%E6%B1%9F%E5%8D%97.html">江南</a>好風景，落花時節又逢君。</div>
</div></div></main>
