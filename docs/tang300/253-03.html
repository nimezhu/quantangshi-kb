<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（253-03）</a>涼州詞二首<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E4%B9%8B%E6%B8%99.html">王之渙</a><span class="solo-vol"> · 卷二百五十三 · 三百首 第 103/327 首 · 黄河、山水、写景</span></div>
<div class="poem" id="p03"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="地名 · 精标">黃河</span>遠上白雲間，一片孤城萬仞山。</div>
<div class="line"><span class="ent ent-nation" data-note="羌笛">羌</span>笛何須怨楊柳，春光不度<a class="ent ent-place" data-note="春风不度" href="../entities/place_%E7%8E%89%E9%97%A8%E5%85%B3.html">玉門關</a>。</div>
<div class="line"><a class="ent ent-nation" data-note="北望拂云堆" href="../entities/nation_%E5%8D%95%E4%BA%8E.html">單于</a>北望<span class="ent ent-place" data-note="中受降城外，突厥祭天处">拂雲堆</span>，殺馬登壇祭幾回。</div>
<div class="line"><span class="ent ent-nation" data-note="以汉代唐">漢家</span>天子今神武，不肯和親歸去來。</div>
</div></div></main>
