<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-91）</a>隋宮<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 121/330 首 · 隋・唐・五代、七言律诗、讽刺</span></div>
<div class="poem" id="p91"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="長安紫淵（避唐諱作紫泉），宮殿鎖煙霞謂煬帝棄長安不居">紫泉</span>宮殿鎖煙霞，欲取<span class="ent ent-place" data-note="揚州江都；鮑照《蕪城賦》故稱">蕪城</span>作帝家。</div>
<div class="line">玉璽不緣歸<span class="ent ent-person" data-note="額骨隆起如日，帝王之相，指唐高祖">日角</span>，<span class="ent ent-person" data-note="煬帝龍舟以錦為帆，遊幸無度">錦帆</span>應是到天涯。</div>
<div class="line">于今腐草無螢火，終古垂楊有暮鴉。</div>
<div class="line">地下若逢<span class="ent ent-person" data-note="陳叔寶；地下相逢豈宜重問《後庭花》，亡國之君相謔">陳後主</span>，豈宜重問<span class="ent ent-time" data-note="《玉樹後庭花》，亡國之音">後庭花</span>。</div>
</div></div></main>
