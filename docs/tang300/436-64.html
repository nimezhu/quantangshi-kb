<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（436-64）</a>賦得古原草送別<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html">白居易</a><span class="solo-vol"> · 卷四百三十六 · 三百首 第 26/330 首 · 写草、二年级下册、咏物</span></div>
<div class="poem" id="p64"><div class="poem-body solo-body">
<div class="line">離離原上草，一歲一枯榮。</div>
<div class="line">野火燒不盡，春風吹又生。</div>
<div class="line">遠芳侵古道，晴翠接荒城。</div>
<div class="line">又送王孫去，萋萋滿別情。</div>
</div></div></main>
