<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-06）</a>輞川閒居贈裴秀才迪<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 54/321 首 · 写景、抒情、秋天</span></div>
<div class="poem" id="p06"><div class="poem-body solo-body">
<div class="line">寒山轉蒼翠，秋水日潺湲。</div>
<div class="line">倚杖柴門外，臨風聽暮蟬。</div>
<div class="line">渡頭餘落日，墟裏上孤煙。</div>
<div class="line">複值接輿醉，狂歌五柳前。</div>
</div></div></main>
