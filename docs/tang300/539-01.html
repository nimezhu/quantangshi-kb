<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-01）</a>錦瑟<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 95/327 首 · 思念、七言律诗、抒情</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">錦瑟無端五十絃，一絃一柱思華年。</div>
<div class="line"><a class="ent ent-person" data-note="庄周梦蝶" href="../entities/person_%E5%BA%84%E7%94%9F.html">莊生</a>曉夢迷蝴蝶，<span class="ent ent-person" data-note="蜀王杜宇，魂化杜鹃">望帝</span>春心託杜鵑。</div>
<div class="line"><span class="ent ent-place" data-note="鲛人泣珠之海">滄海</span>月明珠有淚，<a class="ent ent-place" data-note="蓝田产玉，日暖玉生烟" href="../entities/place_%E8%93%9D%E7%94%B0.html">藍田</a>日暖玉生煙。</div>
<div class="line">此情可待成追憶，只是當時已惘然。</div>
</div></div></main>
