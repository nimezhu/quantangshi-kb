<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（151-51）</a>賦得<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百五十一 · 三百首 第 288/321 首 · 思念、七言律诗、春天</span></div>
<div class="poem" id="p51"><div class="poem-body solo-body">
<div class="line">鶯啼燕語報新年，<a class="ent ent-place" href="../entities/place_%E9%A9%AC%E9%82%91.html">馬邑</a>龍堆路幾千。</div>
<div class="line">家住層城臨漢苑，[心]隨明月到胡天。</div>
<div class="line">機中錦字論長恨，樓上花枝笑獨眠。</div>
<div class="line">爲問元戎竇車騎，何時返斾勒燕然。</div>
</div></div></main>
