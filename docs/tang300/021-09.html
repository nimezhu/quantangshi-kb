<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（021-09）</a>相和歌辭：子夜四時歌四首：秋歌<span class="badge badge-form">五言古體</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷二十一 · 三百首 第 319/321 首 · 思念、清商曲辞、妇女</span></div>
<div class="poem" id="p09"><div class="poem-body solo-body">
<div class="line"><a class="ent ent-place" href="../entities/place_%E9%95%BF%E5%AE%89.html">長安</a>一片月，萬戶擣衣聲。</div>
<div class="line">秋風吹不盡，總是玉關情。</div>
<div class="line">何日平胡虜，良人罷遠征。</div>
</div></div></main>
