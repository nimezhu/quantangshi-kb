<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（555-62）</a>灞上秋居<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%A6%AC%E6%88%B4.html">馬戴</a><span class="solo-vol"> · 卷五百五十五 · 三百首 第 23/327 首 · 孤独、秋天、五言律诗</span></div>
<div class="poem" id="p62"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="灞水高原，长安东">灞原</span>風雨定，晚見雁行頻。</div>
<div class="line">落葉他鄉樹，寒燈獨夜人。</div>
<div class="line">空園白露滴，孤壁野僧鄰。</div>
<div class="line">寄臥郊扉久，何門致此身。</div>
</div></div></main>
