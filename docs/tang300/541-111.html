<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（541-111）</a>《赤壁<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十一 · 三百首 第 145/330 首 · 隋・唐・五代、战争、八年级下册(课内)</span></div>
<div class="poem" id="p111"><div class="poem-body solo-body">
<div class="line">折戟沈沙鐵未銷，自將磨洗認前朝。</div>
<div class="line">東風不與<span class="ent ent-person" data-note="周瑜">周郎</span>便，<span class="ent ent-place" data-note="曹操铜雀台">銅雀</span>春深鎖<span class="ent ent-person" data-note="江东二乔">二喬</span>。</div>
</div></div></main>
