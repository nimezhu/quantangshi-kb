<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（155-11）</a>九日登望仙台，呈劉明府容<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E5%B4%94%E6%9B%99.html">崔曙</a><span class="solo-vol"> · 卷一百五十五 · 三百首 第 101/321 首 · 七言律诗、写景、登高</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">漢文皇帝有高臺，此日登臨曙色開。</div>
<div class="line">三晉雲山皆北向，二陵風雨自東來。</div>
<div class="line">關門令尹誰能識，河上仙翁去不回。</div>
<div class="line">且欲近尋彭澤宰，陶然共醉菊花杯。</div>
</div></div></main>
