<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-05）</a>望洞庭湖，贈張丞相<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 37/327 首 · 洞庭湖、描写水、山水</span></div>
<div class="poem" id="p05"><div class="poem-body solo-body">
<div class="line">八月湖水平，涵虛混太清。</div>
<div class="line">氣蒸<a class="ent ent-place" data-note="古云梦大泽" href="../entities/place_%E4%BA%91%E6%A2%A6.html">雲夢</a>澤，波撼<span class="ent ent-place" data-note="波撼岳阳城">岳陽城</span>。</div>
<div class="line">欲濟無舟楫，端居恥聖明。</div>
<div class="line">坐觀垂釣者，空有羨魚情。</div>
</div></div></main>
