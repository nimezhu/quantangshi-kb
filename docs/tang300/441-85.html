<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（441-85）</a>後宮詞<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html">白居易</a><span class="solo-vol"> · 卷四百四十一 · 三百首 第 175/330 首 · 七言绝句、宫怨</span></div>
<div class="poem" id="p85"><div class="poem-body solo-body">
<div class="line">淚濕羅巾夢不成，夜深前殿按歌聲。</div>
<div class="line">紅顏未老恩先斷，斜倚熏籠坐到明。</div>
</div></div></main>
