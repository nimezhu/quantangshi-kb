<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-212）</a>瑤池<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 207/327 首 · 七言绝句、神话、讽刺</span></div>
<div class="poem" id="p212"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="西王母瑶池">瑤池</span><span class="ent ent-person" data-note="西王母">阿母</span>綺窗開，<span class="ent ent-place" data-note="穆王作《黄竹》哀歌处">黃竹</span>歌聲動地哀。</div>
<div class="line">八駿日行三萬里，<a class="ent ent-person" data-note="周穆王，八骏西游" href="../entities/person_%E7%A9%86%E7%8E%8B.html">穆王</a>何事不重來。</div>
</div></div></main>
