<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-103）</a>無題二首<span class="badge badge-form">七言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 261/330 首 · 宴饮、七言律诗、爱情</span></div>
<div class="poem" id="p103"><div class="poem-body solo-body">
<div class="line">昨夜星辰昨夜風，畫樓西畔桂堂東。</div>
<div class="line">身無綵鳳雙飛翼，心有靈犀一點通。</div>
<div class="line">隔座送鉤春酒暖，分曹射覆蠟燈紅。</div>
<div class="line">嗟余聽鼓應官去，走馬<span class="ent ent-place" data-note="祕書省別稱，義山曾官祕書省；走馬蘭臺自嘆如斷蓬">蘭臺</span>類斷蓬。</div>
<div class="line">聞到<span class="ent ent-place" data-note="閶闔天門，謂仙姝居處縹緲；一說蘇州閶門">閶門</span><span class="ent ent-person" data-note="傳說夜降羊權家之仙女，借指所慕女子">萼綠華</span>，昔年相望抵天涯。</div>
<div class="line">豈知一夜<span class="ent ent-place" data-note="秦穆公女弄玉鳳樓；秦樓客謂蕭史，自比幸近仙姝">秦樓</span>客，偷看<a class="ent ent-person" data-note="吳王夫差；苑內之花用西施在吳宮意，喻可望不可即" href="../entities/person_%E5%90%B4%E7%8E%8B.html">吳王</a>苑內花。</div>
</div></div></main>
