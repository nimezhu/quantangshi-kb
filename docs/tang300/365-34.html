<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（365-34）</a>金陵五題：烏衣巷<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E7%A6%B9%E9%8C%AB.html">劉禹錫</a><span class="solo-vol"> · 卷三百六十五 · 三百首 第 204/327 首 · 怀古、七言绝句、带有地名</span></div>
<div class="poem" id="p34"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="金陵朱雀桥">朱雀橋</span>邊野草花，<span class="ent ent-place" data-note="王谢故居之巷">烏衣巷</span>口夕陽斜。</div>
<div class="line">舊時<span class="ent ent-person" data-note="东晋王导、谢安家族">王謝</span>堂前燕，飛入尋常百姓家。</div>
</div></div></main>
