<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-23）</a>樂游原<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 232/330 首 · 惜时、哲理</span></div>
<div class="poem" id="p23"><div class="poem-body solo-body">
<div class="line">向晚意不適，驅車登<span class="ent ent-place" data-note="即樂遊原，漢宣帝樂遊苑故地，長安登覽勝地">古原</span>。</div>
<div class="line">夕陽無限好，只是近黃昏。</div>
</div></div></main>
