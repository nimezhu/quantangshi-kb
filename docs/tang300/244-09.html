<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（244-09）</a>酬程延秋夜即事見贈<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%93%E7%BF%83.html">韓翃</a><span class="solo-vol"> · 卷二百四十四 · 三百首 第 81/321 首 · 写景、酬答、五言律诗</span></div>
<div class="poem" id="p09"><div class="poem-body solo-body">
<div class="line">長簟迎風早，空城澹月華。</div>
<div class="line">星河秋一雁，砧杵夜千家。</div>
<div class="line">節候看應晚，心期臥亦賒。</div>
<div class="line">向來吟秀句，不覺已鳴鴉。</div>
</div></div></main>
