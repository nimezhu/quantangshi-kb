<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（352-43）</a>溪居<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9F%B3%E5%AE%97%E5%85%83.html">柳宗元</a><span class="solo-vol"> · 卷三百五十二 · 三百首 第 9/327 首 · 孤独、五言古诗、生活</span></div>
<div class="poem" id="p43"><div class="poem-body solo-body">
<div class="line">久為簪組累，幸此<a class="ent ent-nation" data-note="柳宗元贬永州，谦称南夷之谪" href="../entities/nation_%E5%8D%97%E5%A4%B7.html">南夷</a>謫。</div>
<div class="line">閑依農圃鄰，偶似山林客。</div>
<div class="line">曉耕翻露草，夜榜響溪石。</div>
<div class="line">來往不逢人，長歌<span class="ent ent-nation" data-note="永州古属楚地">楚</span>天碧。</div>
</div></div></main>
