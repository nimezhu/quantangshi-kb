<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（227-42）</a>聞官軍收河南河北<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十七 · 三百首 第 105/321 首 · 七言律诗、思归、六年级下册</span></div>
<div class="poem" id="p42"><div class="poem-body solo-body">
<div class="line">劒外忽傳收薊北，初聞涕淚滿衣裳。</div>
<div class="line">却看妻子愁何在，漫卷詩書喜欲狂。</div>
<div class="line">白日放歌須縱酒，青春作伴好還鄉。</div>
<div class="line">即從巴峽穿<a class="ent ent-place" href="../entities/place_%E5%B7%AB%E5%B3%A1.html">巫峽</a>，便下襄陽向<a class="ent ent-place" href="../entities/place_%E6%B4%9B%E9%98%B3.html">洛陽</a>。</div>
</div></div></main>
