<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（442-20）</a>後宮詞<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html">白居易</a><span class="solo-vol"> · 卷四百四十二 · 三百首 第 172/321 首 · 七言绝句、宫怨</span></div>
<div class="poem" id="p20"><div class="poem-body solo-body">
<div class="line">雨露由來一點恩，爭能遍佈及千門。</div>
<div class="line">三千宮女胭脂面，幾個春來無淚痕。</div>
</div></div></main>
