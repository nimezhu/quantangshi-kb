<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-39）</a>夜雨寄北<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 190/327 首 · 思念、写雨、写景</span></div>
<div class="poem" id="p39"><div class="poem-body solo-body">
<div class="line">君問歸期未有期，<span class="ent ent-place" data-note="巴蜀之山">巴山</span>夜雨漲秋池。</div>
<div class="line">何當共剪西窗燭，卻話<span class="ent ent-place" data-note="地名 · 精标">巴山</span>夜雨時。</div>
</div></div></main>
