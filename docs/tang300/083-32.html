<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（083-32）</a>登幽州台歌<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E9%99%B3%E5%AD%90%E6%98%82.html">陳子昂</a><span class="solo-vol"> · 卷八十三 · 三百首 第 289/321 首 · 隋・唐・五代、八年级下册(课外)、伤怀</span></div>
<div class="poem" id="p32"><div class="poem-body solo-body">
<div class="line">前不見古人，後不見來者。</div>
<div class="line">念天地之悠悠，獨愴然而涕下。</div>
</div></div></main>
