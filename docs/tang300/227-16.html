<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（227-16）</a>野望<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十七 · 三百首 第 111/330 首 · 七言律诗、写景、抒情</span></div>
<div class="poem" id="p16"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="成都西嶺雪山，近吐蕃戍守之地">西山</span>白雪三奇戍，<span class="ent ent-place" data-note="成都南郊浦口，清江所經">南浦</span>清江<span class="ent ent-place" data-note="成都萬里橋；費禕使吳「萬里之行始於此」">萬里橋</span>。</div>
<div class="line">海內風塵諸弟隔，天涯涕淚一身遙。</div>
<div class="line">唯將遲暮供多病，未有涓埃荅聖朝。</div>
<div class="line">跨馬出郊時極目，不堪人事日蕭條。</div>
</div></div></main>
