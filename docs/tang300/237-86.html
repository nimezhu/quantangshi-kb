<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（237-86）</a>送僧歸日本<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E9%8C%A2%E8%B5%B7.html">錢起</a><span class="solo-vol"> · 卷二百三十七 · 三百首 第 27/321 首 · 送别、五言律诗、惜别</span></div>
<div class="poem" id="p86"><div class="poem-body solo-body">
<div class="line">上國隨緣住，來途若夢行。</div>
<div class="line">浮天滄海遠，去世法舟輕。</div>
<div class="line">水月通禪觀，魚龍聽梵聲。</div>
<div class="line">惟憐一燈影，萬里眼中明。</div>
</div></div></main>
