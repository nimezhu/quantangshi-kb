<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（784-13）</a>哥舒歌<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E8%A5%BF%E9%84%99%E4%BA%BA.html">西鄙人</a><span class="solo-vol"> · 卷七百八十四 · 三百首 第 228/330 首 · 赞颂、五言绝句、民歌</span></div>
<div class="poem" id="p13"><div class="poem-body solo-body">
<div class="line">北斗七星高，<span class="ent ent-person" data-note="哥舒翰，唐名将，镇陇右御吐蕃">哥舒</span>夜帶刀。</div>
<div class="line">至今窺牧馬，不敢過<a class="ent ent-place" data-note="今甘肃岷县，陇右边镇" href="../entities/place_%E4%B8%B4%E6%B4%AE.html">臨洮</a>。</div>
</div></div></main>
