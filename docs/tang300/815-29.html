<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（815-29）</a>尋陸鴻漸不遇<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%9A%8E%E7%84%B6.html">皎然</a><span class="solo-vol"> · 卷八百一十五 · 三百首 第 60/330 首 · 隐士、访友、生活</span></div>
<div class="poem" id="p29"><div class="poem-body solo-body">
<div class="line">移家雖帶郭，野徑入桑麻。</div>
<div class="line">近種籬邊菊，秋來未著花。</div>
<div class="line">扣門無犬吠，欲去問西家。</div>
<div class="line">報導山中去，歸時每日斜。</div>
</div></div></main>
