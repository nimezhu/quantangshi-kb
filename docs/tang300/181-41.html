<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（181-41）</a>夜泊牛渚懷古<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百八十一 · 三百首 第 56/321 首 · 怀古、五言律诗、月亮</span></div>
<div class="poem" id="p41"><div class="poem-body solo-body">
<div class="line">牛渚西江夜，青天無片雲。</div>
<div class="line">登舟望秋月，空憶謝將軍。</div>
<div class="line">余亦能高詠，斯人不可聞。</div>
<div class="line">明朝掛帆席，楓葉落紛紛。</div>
</div></div></main>
