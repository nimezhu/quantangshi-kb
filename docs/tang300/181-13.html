<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（181-13）</a>早發白帝城<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百八十一 · 三百首 第 183/327 首 · 长江、山、喜悦</span></div>
<div class="poem" id="p13"><div class="poem-body solo-body">
<div class="line">朝辭<a class="ent ent-place" data-note="夔州白帝城，李白遇赦东还自此" href="../entities/place_%E7%99%BD%E5%B8%9D%E5%9F%8E.html">白帝</a>彩雲間，千里<a class="ent ent-place" data-note="今荆州，一日千里而还" href="../entities/place_%E6%B1%9F%E9%99%B5.html">江陵</a>一日還。</div>
<div class="line">兩岸猿聲啼不盡，輕舟已過萬重山。</div>
</div></div></main>
