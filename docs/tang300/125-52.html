<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（125-52）</a>青溪<span class="badge badge-form">五言排律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十五 · 三百首 第 268/321 首 · 五言古诗、托物寄情、山水</span></div>
<div class="poem" id="p52"><div class="poem-body solo-body">
<div class="line">言入黃花川，每逐清溪水。</div>
<div class="line">隨山將萬轉，趣途無百里。</div>
<div class="line">聲喧亂石中，色靜深松裏。</div>
<div class="line">漾漾泛菱荇，澄澄映葭葦。</div>
<div class="line">我心素已閑，清川澹如此。</div>
<div class="line">請留磐石上，垂釣將已矣。</div>
</div></div></main>
