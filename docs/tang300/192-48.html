<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（192-48）</a>東郊<span class="badge badge-form">五言排律</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百九十二 · 三百首 第 271/321 首 · 春天、生活</span></div>
<div class="poem" id="p48"><div class="poem-body solo-body">
<div class="line">吏舍局終年，出郊曠清曙。</div>
<div class="line">楊柳散和風，青山澹吾慮。</div>
<div class="line">依叢適自憩，緣澗還複去。</div>
<div class="line">微雨靄芳原，春鳩鳴何處。</div>
<div class="line">樂幽心屢止，遵事蹟猶遽。</div>
<div class="line">終罷斯結廬，慕陶真可庶。</div>
</div></div></main>
