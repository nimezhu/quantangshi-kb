<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（679-33）</a>孤雁<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%B4%94%E5%A1%97.html">崔塗</a><span class="solo-vol"> · 卷六百七十九 · 三百首 第 222/327 首 · 孤独、羁旅、五言律诗</span></div>
<div class="poem" id="p33"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="湘江水滨">湘浦</span>離應晚，邊城去已孤。</div>
<div class="line">如何萬里計，只在一枝蘆。</div>
<div class="line">迥起波搖<span class="ent ent-nation" data-note="楚地">楚</span>，寒棲月映蒲。</div>
<div class="line">不知天畔侶，何處下平蕪。</div>
<div class="line">幾行歸去盡，片影獨何之。</div>
<div class="line">暮雨相呼失，寒塘獨下遲。</div>
<div class="line">渚雲低暗度，關月冷遙隨。</div>
<div class="line">未必逢矰繳，孤飛自可疑。</div>
</div></div></main>
