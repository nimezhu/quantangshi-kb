<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（147-19）</a>送靈澈上人<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百四十七 · 三百首 第 271/327 首 · 山水、抒情、送别</span></div>
<div class="poem" id="p19"><div class="poem-body solo-body">
<div class="line">蒼蒼<span class="ent ent-place" data-note="润州竹林寺">竹林寺</span>，杳杳鐘聲晚。</div>
<div class="line">荷笠帶夕陽，青山獨歸遠。</div>
</div></div></main>
