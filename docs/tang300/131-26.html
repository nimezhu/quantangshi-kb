<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（131-26）</a>望薊門<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%A5%96%E8%A9%A0.html">祖詠</a><span class="solo-vol"> · 卷一百三十一 · 三百首 第 113/327 首 · 七言律诗、冬天、边塞</span></div>
<div class="poem" id="p26"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="燕昭王黄金台">燕臺</span>一望客心驚，簫鼓喧喧<span class="ent ent-nation" data-note="汉将营，以汉代唐">漢</span>將營。</div>
<div class="line">萬里寒光生積雪，三邊曙色動危旌。</div>
<div class="line">沙場烽火連<span class="ent ent-nation" data-note="胡月">胡</span>月，海畔雲山擁<span class="ent ent-place" data-note="幽州蓟城">薊城</span>。</div>
<div class="line">少小雖非<span class="ent ent-person" data-note="班超投笔从戎">投筆吏</span>，論功還欲請長纓。</div>
</div></div></main>
