<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（200-02）</a>寄左省杜拾遺<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%B2%91%E5%8F%83.html">岑參</a><span class="solo-vol"> · 卷二百 · 三百首 第 57/321 首 · 仕途、五言律诗、感慨</span></div>
<div class="poem" id="p02"><div class="poem-body solo-body">
<div class="line">聯步趨丹陛，分曹限紫微。</div>
<div class="line">曉隨天仗入，暮惹禦香歸。</div>
<div class="line">白髮悲花落，青雲羨鳥飛。</div>
<div class="line">聖朝無闕事，自覺諫書稀。</div>
</div></div></main>
