<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（515-70）</a>近試上張籍水部<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E6%9C%B1%E6%85%B6%E9%A4%98.html">朱慶餘</a><span class="solo-vol"> · 卷五百一十五 · 三百首 第 306/321 首 · 新婚、七言绝句、考试</span></div>
<div class="poem" id="p70"><div class="poem-body solo-body">
<div class="line">洞房昨夜停紅燭，待曉堂前拜舅姑。</div>
<div class="line">[妝]罷低聲問夫壻，畫眉深淺入時無。</div>
</div></div></main>
