<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（216-05）</a>望岳<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百一十六 · 三百首 第 13/330 首 · 泰山、五言古诗、励志</span></div>
<div class="poem" id="p05"><div class="poem-body solo-body">
<div class="line"><a class="ent ent-place" data-note="泰山尊稱，五嶽之首" href="../entities/place_%E6%B3%B0%E5%B1%B1.html">岱宗</a>夫如何，<a class="ent ent-nation" data-note="春秋齊魯兩國以泰山為界，「青未了」狀其廣大" href="../entities/place_%E9%BD%90%E9%B2%81.html">齊魯</a>青未了。</div>
<div class="line">造化鐘神秀，陰陽割昏曉。</div>
<div class="line">蕩胸生曾雲，決眥入歸鳥。</div>
<div class="line">會當淩絕頂，一覽眾山小。</div>
</div></div></main>
