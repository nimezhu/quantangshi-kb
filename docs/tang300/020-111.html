<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（020-111）</a>相和歌辭：長信怨<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E6%98%8C%E9%BD%A1.html">王昌齡</a><span class="solo-vol"> · 卷二十 · 三百首 第 128/321 首</span></div>
<div class="poem" id="p111"><div class="poem-body solo-body">
<div class="line">金井梧桐秋葉黃，珠簾不卷夜來霜。</div>
<div class="line">金爐玉枕無顏色，臥聽南宮清漏長。</div>
<div class="line">奉帚平明金殿開，暫將團扇共裴回。</div>
<div class="line">玉顏不及寒鴉色，猶帶昭陽日影來。</div>
</div></div></main>
