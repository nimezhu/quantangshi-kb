<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（056-11）</a>杜少府之任蜀州<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E5%8B%83.html">王勃</a><span class="solo-vol"> · 卷五十六 · 三百首 第 283/321 首 · 八年级下册(课外)、友情、送别</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">城闕輔<a class="ent ent-place" href="../entities/place_%E4%B8%89%E7%A7%A6.html">三秦</a>，風煙望五津。</div>
<div class="line">與君離別意，同是宦遊人。</div>
<div class="line">海記憶體知己，天涯若比鄰。</div>
<div class="line">無為在岐路，兒女共沾巾。</div>
</div></div></main>
