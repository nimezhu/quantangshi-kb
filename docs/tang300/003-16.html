<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（003-16）</a>經鄒魯祭孔子而歎之<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E9%9A%86%E5%9F%BA.html">李隆基</a><span class="solo-vol"> · 卷三 · 三百首 第 7/321 首 · 伤怀、写人、五言律诗</span></div>
<div class="poem" id="p16"><div class="poem-body solo-body">
<div class="line">夫子何為者，棲棲一代中。</div>
<div class="line">地猶鄹氏邑，宅即魯王宮。</div>
<div class="line">歎鳳嗟身否，傷麟怨道窮。</div>
<div class="line">今看兩楹奠，當與夢時同。</div>
</div></div></main>
