<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（540-118）</a>無題二首<span class="badge badge-form">七言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十 · 三百首 第 262/330 首 · 七言律诗、思念、抒情</span></div>
<div class="poem" id="p118"><div class="poem-body solo-body">
<div class="line">鳳尾香羅薄幾重，碧文圓頂夜深縫。</div>
<div class="line">扇裁月魄羞難掩，車走雷聲語未通。</div>
<div class="line">曾是寂寥金燼暗，斷無消息石榴紅。</div>
<div class="line">重帷深下<span class="ent ent-person" data-note="古歌謠中女子，貌美善歌；莫愁堂謂伊人居處">莫愁</span>堂，臥後清宵細細長。</div>
<div class="line"><span class="ent ent-person" data-note="巫山神女，用《高唐賦》，謂情緣原是夢">神女</span>生涯原是夢，<span class="ent ent-person" data-note="《青溪小姑曲》「小姑所居，獨處無郎」">小姑</span>居處本無郎。</div>
<div class="line">風波不信菱枝弱，月露誰教桂葉香。</div>
<div class="line">直道相思了無益，未妨惆悵是清狂。</div>
</div></div></main>
