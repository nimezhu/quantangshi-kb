<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（540-118）</a>無題二首<span class="badge badge-form">七言古體</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十 · 三百首 第 225/321 首 · 思念、七言律诗、抒情</span></div>
<div class="poem" id="p118"><div class="poem-body solo-body">
<div class="line">鳳尾香羅薄幾重，碧文圓頂夜深縫。</div>
<div class="line">扇裁月魄羞難掩，</div>
<div class="line">斑騅只系垂楊岸，何處西南任好風。</div>
<div class="line">重帷深下莫愁堂，臥後清宵細細長。</div>
<div class="line">神女生涯原是夢，</div>
<div class="line">直道相思了無益，未妨惆悵是清狂。</div>
</div></div></main>
