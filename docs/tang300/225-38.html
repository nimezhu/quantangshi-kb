<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（225-38）</a>至德二載甫自京金光門出問道歸鳳翔乾元初從左拾遺移華州掾與親故別因出此門有悲往事<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十五 · 三百首 第 85/321 首 · 岁月、五言律诗、怀念</span></div>
<div class="poem" id="p38"><div class="poem-body solo-body">
<div class="line">此道昔歸順，西郊胡正繁。</div>
<div class="line">至今殘破膽，應有未招魂。</div>
<div class="line">近得歸京邑，移官豈至尊。</div>
<div class="line">無才日衰老，駐馬望千門。</div>
</div></div></main>
