<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（096-73）</a>古意呈補闕喬知之<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%B2%88%E4%BD%BA%E6%9C%9F.html">沈佺期</a><span class="solo-vol"> · 卷九十六 · 三百首 第 134/327 首 · 思念、闺怨、乐府</span></div>
<div class="poem" id="p73"><div class="poem-body solo-body">
<div class="line">盧家少婦鬱金堂，海燕雙棲玳瑁梁。</div>
<div class="line">九月寒砧催木葉，十年征戍憶<span class="ent ent-place" data-note="征戍之地">遼陽</span>。</div>
<div class="line"><span class="ent ent-place" data-note="今大凌河">白狼河</span>北音書斷，<a class="ent ent-place" data-note="长安" href="../entities/place_%E9%95%BF%E5%AE%89.html">丹鳳城</a>南秋夜長。</div>
<div class="line">誰謂含愁獨不見，更教明月照流黃。</div>
</div></div></main>
