<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（021-10）</a>相和歌辭：子夜四時歌四首：冬歌<span class="badge badge-form">五言古體</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷二十一 · 三百首 第 318/321 首 · 思念、清商曲辞、妇女</span></div>
<div class="poem" id="p10"><div class="poem-body solo-body">
<div class="line">明朝驛使發，一夜絮征袍。</div>
<div class="line">素手抽針冷，那堪把剪刀。</div>
<div class="line">裁縫寄遠道，幾日到<a class="ent ent-place" href="../entities/place_%E4%B8%B4%E6%B4%AE.html">臨洮</a>。</div>
</div></div></main>
