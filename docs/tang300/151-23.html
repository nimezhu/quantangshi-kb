<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（151-23）</a>長沙過賈誼宅<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百五十一 · 三百首 第 126/330 首 · 迁谪、生活、怀古</span></div>
<div class="poem" id="p23"><div class="poem-body solo-body">
<div class="line">三年謫宦此棲遲，萬古惟留<span class="ent ent-nation" data-note="楚客：迁谪之悲">楚</span>客悲。</div>
<div class="line">秋草獨尋人去後，寒林空見日斜時。</div>
<div class="line"><span class="ent ent-person" data-note="汉文帝，有道而恩薄">漢文</span>有道恩猶薄，<span class="ent ent-place" data-note="贾谊投书吊屈原之水">湘水</span>無情弔豈知。</div>
<div class="line">寂寂江山搖落處，憐君何事到天涯。</div>
</div></div></main>
