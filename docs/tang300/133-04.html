<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（133-04）</a>琴歌<span class="badge badge-form">七言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E9%A0%8E.html">李頎</a><span class="solo-vol"> · 卷一百三十三 · 三百首 第 312/327 首 · 音乐、宴会、七言古诗</span></div>
<div class="poem" id="p04"><div class="poem-body solo-body">
<div class="line">主人有酒歡今夕，請奏鳴琴<a class="ent ent-place" data-note="《广陵散》之客" href="../entities/place_%E5%B9%BF%E9%99%B5.html">廣陵</a>客。</div>
<div class="line">月照城頭烏半飛，霜淒萬樹風入衣。</div>
<div class="line">銅鑪華燭燭增輝，初彈淥水後楚妃。</div>
<div class="line">一聲已動物皆靜，四座無言星欲稀。</div>
<div class="line"><span class="ent ent-place" data-note="淮水，奉使之地">清淮</span>奉使千餘里，敢告雲山從此始。</div>
</div></div></main>
