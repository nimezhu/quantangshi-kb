<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（742-02）</a>寄人<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E6%B3%8C.html">張泌</a><span class="solo-vol"> · 卷七百四十二 · 三百首 第 98/330 首 · 七言绝句、思念、月亮</span></div>
<div class="poem" id="p02"><div class="poem-body solo-body">
<div class="line">別夢依依到<span class="ent ent-person" data-note="谢娘家，代指所思女子居处">謝家</span>，小廊回合曲闌斜。</div>
<div class="line">多情只有春庭月，猶為離人照落花。</div>
<div class="line">酷憐風月為多情，還到春時別恨生。</div>
<div class="line">倚柱尋思倍惆悵，一場春夢不分明。</div>
</div></div></main>
