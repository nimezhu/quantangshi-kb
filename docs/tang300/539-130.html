<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-130）</a>無題<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 92/330 首 · 思念、七言律诗、八年级下册(课外)</span></div>
<div class="poem" id="p130"><div class="poem-body solo-body">
<div class="line">相見時難別亦難，東風無力百花殘。</div>
<div class="line">春蠶到死絲方盡，</div>
<div class="line">蠟炬成灰淚始幹。</div>
<div class="line">曉鏡但愁雲鬢改，夜吟應覺月光寒。</div>
<div class="line"><span class="ent ent-place" data-note="蓬萊仙山，喻對方居處可望難即">蓬山</span>此去無多路，<span class="ent ent-person" data-note="西王母信使，殷勤探看">青鳥</span>殷勤為探看。</div>
</div></div></main>
