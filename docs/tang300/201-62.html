<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（201-62）</a>逢入京使<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%B2%91%E5%8F%83.html">岑參</a><span class="solo-vol"> · 卷二百零一 · 三百首 第 159/330 首 · 生活、边塞、初中古诗</span></div>
<div class="poem" id="p62"><div class="poem-body solo-body">
<div class="line">故園東望路漫漫，雙袖龍鍾淚不幹。</div>
<div class="line">馬上相逢無紙筆，憑君傳語報平安。</div>
</div></div></main>
