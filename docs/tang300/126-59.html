<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-59）</a>山居秋暝<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 12/330 首 · 山水、写景、秋雨</span></div>
<div class="poem" id="p59"><div class="poem-body solo-body">
<div class="line">空山新雨後，天氣晚來秋。</div>
<div class="line">明月松間照，清泉石上流。</div>
<div class="line">竹喧歸浣女，蓮動下漁舟。</div>
<div class="line">隨意春芳歇，王孫自可留。</div>
</div></div></main>
