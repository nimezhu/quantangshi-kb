<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-34）</a>送梓州李使君<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 41/330 首 · 友情、送别、五言律诗</span></div>
<div class="poem" id="p34"><div class="poem-body solo-body">
<div class="line">萬壑樹參天，千山響杜鵑。</div>
<div class="line">山中一夜雨，樹杪百重泉。</div>
<div class="line"><span class="ent ent-place" data-note="西汉水（嘉陵江）流域">漢</span>女輸橦布，<span class="ent ent-nation" data-note="巴人讼芋田">巴</span>人訟芋田。</div>
<div class="line"><span class="ent ent-person" data-note="汉蜀郡守，兴学化蜀">文翁</span>翻教授，不敢依先賢。</div>
</div></div></main>
