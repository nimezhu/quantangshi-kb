<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（143-43）</a>芙蓉樓送辛漸二首<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E6%98%8C%E9%BD%A1.html">王昌齡</a><span class="solo-vol"> · 卷一百四十三 · 三百首 第 104/330 首 · 写雨、抒情、送别</span></div>
<div class="poem" id="p43"><div class="poem-body solo-body">
<div class="line">寒雨連天夜入湖，平明送客<span class="ent ent-place" data-note="楚地之山">楚山</span>孤。</div>
<div class="line"><a class="ent ent-place" data-note="亲友所在" href="../entities/place_%E6%B4%9B%E9%98%B3.html">洛陽</a>親友如相問，一片冰心在玉壺。</div>
<div class="line"><span class="ent ent-place" data-note="润州丹阳">丹陽</span>城南秋海陰，<span class="ent ent-place" data-note="地名 · 精标">丹陽</span>城北楚雲深。</div>
<div class="line">高樓送客不能醉，寂寂寒江明月心。</div>
</div></div></main>
