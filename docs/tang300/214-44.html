<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（214-44）</a>送李少府貶峽中，王少府貶長沙<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%AB%98%E9%81%A9.html">高適</a><span class="solo-vol"> · 卷二百一十四 · 三百首 第 109/330 首 · 同情、送别、贬谪</span></div>
<div class="poem" id="p44"><div class="poem-body solo-body">
<div class="line">嗟君此別意何如，駐馬銜桮問謫居。</div>
<div class="line"><a class="ent ent-place" data-note="贬峡中所经" href="../entities/place_%E5%B7%AB%E5%B3%A1.html">巫峽</a>啼猿數行淚，<span class="ent ent-place" data-note="回雁峰，雁至此不南">衡陽</span>歸雁幾封書。</div>
<div class="line"><span class="ent ent-place" data-note="长沙浏水">青楓江</span>上秋天遠，<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E7%99%BD%E5%B8%9D%E5%9F%8E.html">白帝城</a>邊古木疎。</div>
<div class="line">聖代即今多雨露，暫時分手莫躊躇。</div>
</div></div></main>
