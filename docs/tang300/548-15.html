<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（548-15）</a>宮詞<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E8%96%9B%E9%80%A2.html">薛逢</a><span class="solo-vol"> · 卷五百四十八 · 三百首 第 109/321 首 · 宫怨、七言律诗</span></div>
<div class="poem" id="p15"><div class="poem-body solo-body">
<div class="line">十二樓中盡曉妝，望仙樓上望君王。</div>
<div class="line">鎖銜金獸連環冷，水滴銅龍晝漏長。</div>
<div class="line">雲髻罷梳還對鏡，羅衣欲換更添香。</div>
<div class="line">遙窺正殿簾開處，袍袴宮人掃御牀。</div>
</div></div></main>
