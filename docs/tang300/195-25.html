<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（195-25）</a>和晉陵陸丞早春遊望<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百九十五 · 三百首 第 62/321 首 · 春天、伤怀、和诗</span></div>
<div class="poem" id="p25"><div class="poem-body solo-body">
<div class="line">獨有宦遊人，偏驚物候新。</div>
<div class="line">雲霞出海曙，梅柳渡江春。</div>
<div class="line">淑氣催黃鳥，晴光照綠蘋。</div>
<div class="line">忽聞歌苦調，歸思欲沾巾。</div>
</div></div></main>
