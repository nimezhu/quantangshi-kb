<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（541-90）</a>無題<span class="badge badge-form">七言古體</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十一 · 三百首 第 220/321 首 · 思念、七言律诗、八年级下册(课外)</span></div>
<div class="poem" id="p90"><div class="poem-body solo-body">
<div class="line">萬里風波一葉舟，憶歸初罷更夷猶。</div>
<div class="line">碧江地沒元相引，</div>
<div class="line">人生豈得長無謂，懷古思鄉共白頭。</div>
</div></div></main>
