<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-70）</a>九月九日憶山東兄弟<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 153/321 首 · 七言绝句、思乡、三年级上册</span></div>
<div class="poem" id="p70"><div class="poem-body solo-body">
<div class="line">獨在異鄉為異客，每逢佳節倍思親。</div>
<div class="line">遙知兄弟登高處，遍插茱萸少一人。</div>
</div></div></main>
