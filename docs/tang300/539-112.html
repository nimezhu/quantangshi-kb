<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-112）</a>隋宮<span class="badge badge-form">七言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 304/327 首 · 七言律诗、七言绝句、咏史</span></div>
<div class="poem" id="p112"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="长安宫殿">紫泉</span>宮殿鎖煙霞，欲取<span class="ent ent-place" data-note="广陵，鲍照《芜城赋》之城">蕪城</span>作帝家。</div>
<div class="line">玉璽不緣歸<span class="ent ent-person" data-note="帝王之相，指唐高祖">日角</span>，錦帆應是到天涯。</div>
<div class="line">于今腐草無螢火，終古垂楊有暮鴉。</div>
<div class="line">地下若逢<span class="ent ent-person" data-note="陈叔宝，《后庭花》亡国之音">陳後主</span>，豈宜重問後庭花。</div>
<div class="line">乘興南遊不戒嚴，九重誰省諫書函。</div>
<div class="line">春風舉國裁宮錦，半作障泥半作帆。</div>
</div></div></main>
