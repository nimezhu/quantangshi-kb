<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（233-04）</a>登岳陽樓<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百三十三 · 三百首 第 25/330 首 · 洞庭湖、岳阳楼、抱负</span></div>
<div class="poem" id="p04"><div class="poem-body solo-body">
<div class="line">昔聞<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E6%B4%9E%E5%BA%AD.html">洞庭</a>水，今上<span class="ent ent-place" data-note="巴陵城西门楼">岳陽樓</span>。</div>
<div class="line"><span class="ent ent-nation" data-note="吴楚之地，东南坼分">吳楚</span>東南坼，乾坤日夜浮。</div>
<div class="line">親朋無一字，老病有孤舟。</div>
<div class="line">戎馬關山北，憑軒涕泗流。</div>
</div></div></main>
