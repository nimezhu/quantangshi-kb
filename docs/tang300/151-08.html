<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（151-08）</a>江州重別薛六、柳八二員外<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html">劉長卿</a><span class="solo-vol"> · 卷一百五十一 · 三百首 第 134/330 首 · 送别、七言律诗</span></div>
<div class="poem" id="p08"><div class="poem-body solo-body">
<div class="line">生涯豈料承優詔，世事空知學醉歌。</div>
<div class="line">江上月明<span class="ent ent-nation" data-note="胡雁过">胡</span>鴈過，<a class="ent ent-place" data-note="木落楚山多" href="../entities/place_%E6%B7%AE%E5%8D%97.html">淮南</a>木落<span class="ent ent-nation" data-note="楚山">楚</span>山多。</div>
<div class="line">寄身且喜<span class="ent ent-place" data-note="滨水隐居之地">滄洲</span>近，顧影無如白髮何。</div>
<div class="line">今日龍鍾人共棄，媿君猶遣慎風波。</div>
</div></div></main>
