<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（018-53）</a>橫吹曲辭：關山月<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一十八 · 三百首 第 225/327 首 · 中秋、边塞、山</span></div>
<div class="poem" id="p53"><div class="poem-body solo-body">
<div class="line">明月出<span class="ent ent-place" data-note="祁连山，匈奴谓天为祁连">天山</span>，蒼茫雲海間。</div>
<div class="line">長風幾萬里，吹度<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E7%8E%89%E9%97%A8%E5%85%B3.html">玉門關</a>。</div>
<div class="line"><span class="ent ent-nation" data-note="以汉代唐">漢</span>下<span class="ent ent-place" data-note="汉高祖白登之围故地">白登</span>道，<span class="ent ent-nation" data-note="邦国族群 · 精标">胡</span>窺<span class="ent ent-place" data-note="青海湖一带，唐蕃交战地">青海</span>灣。</div>
<div class="line">由來征戰地，不見有人還。</div>
<div class="line">戍客望邊色，思歸多苦顏。</div>
<div class="line">高樓當此夜，歎息未應閑。</div>
</div></div></main>
