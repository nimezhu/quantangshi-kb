<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（159-13）</a>夏日南亭懷辛大<span class="badge badge-form">五言排律</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百五十九 · 三百首 第 266/321 首 · 五言古诗、友情、夏天</span></div>
<div class="poem" id="p13"><div class="poem-body solo-body">
<div class="line">山光忽西落，池月漸東上。</div>
<div class="line">散發乘夕涼，開軒臥閑敞。</div>
<div class="line">荷風送香氣，竹露滴清響。</div>
<div class="line">欲取鳴琴彈，恨無知音賞。</div>
<div class="line">感此懷故人，中宵勞夢想。</div>
</div></div></main>
