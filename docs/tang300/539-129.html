<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-129）</a>為有<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 140/330 首 · 七言绝句、怨情</span></div>
<div class="poem" id="p129"><div class="poem-body solo-body">
<div class="line">為有雲屏無限嬌，<a class="ent ent-place" data-note="凤城：京城别称，指长安" href="../entities/place_%E9%95%BF%E5%AE%89.html">鳳城</a>寒盡怕春宵。</div>
<div class="line">無端嫁得金龜婿，辜負香衾事早朝。</div>
</div></div></main>
