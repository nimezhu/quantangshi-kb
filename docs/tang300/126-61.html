<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-61）</a>歸嵩山作<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 64/321 首 · 山水、写景、抒情</span></div>
<div class="poem" id="p61"><div class="poem-body solo-body">
<div class="line">清川帶長薄，車馬去閑閑。</div>
<div class="line">流水如有意，暮禽相與還。</div>
<div class="line">荒城臨古渡，落日滿秋山。</div>
<div class="line">迢遞嵩高下，歸來且閉關。</div>
</div></div></main>
