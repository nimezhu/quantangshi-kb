<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（579-16）</a>瑤瑟怨<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%BA%AB%E5%BA%AD%E7%AD%A0.html">溫庭筠</a><span class="solo-vol"> · 卷五百七十九 · 三百首 第 213/327 首 · 离别、七言绝句、闺怨</span></div>
<div class="poem" id="p16"><div class="poem-body solo-body">
<div class="line">冰簟銀床夢不成，碧天如水夜雲輕。</div>
<div class="line">雁聲遠過<a class="ent ent-place" data-note="雁声远过" href="../entities/place_%E6%BD%87%E6%B9%98.html">瀟湘</a>去，<span class="ent ent-place" data-note="仙人十二楼">十二樓</span>中月自明。</div>
</div></div></main>
