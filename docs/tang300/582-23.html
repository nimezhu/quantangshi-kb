<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（582-23）</a>蘇武廟<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E6%BA%AB%E5%BA%AD%E7%AD%A0.html">溫庭筠</a><span class="solo-vol"> · 卷五百八十二 · 三百首 第 124/321 首 · 隋・唐・五代、七言律诗、写人</span></div>
<div class="poem" id="p23"><div class="poem-body solo-body">
<div class="line">蘇武魂銷漢使前，古祠高樹兩茫然。</div>
<div class="line">雲邊雁斷胡天月，隴上羊歸塞草煙。</div>
<div class="line">廻日樓臺非甲帳，去時冠劒是丁年。</div>
<div class="line">茂陵不見封侯印，空向秋波哭逝川。</div>
</div></div></main>
