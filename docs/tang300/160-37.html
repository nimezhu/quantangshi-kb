<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-37）</a>留別王侍禦維<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 55/321 首 · 归隐、友情、离别</span></div>
<div class="poem" id="p37"><div class="poem-body solo-body">
<div class="line">寂寂竟何待，朝朝空自歸。</div>
<div class="line">欲尋芳草去，惜與故人違。</div>
<div class="line">當路誰相假，知音世所稀。</div>
<div class="line">只應守索寞，還掩故園扉。</div>
</div></div></main>
