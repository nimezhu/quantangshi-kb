<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（174-18）</a>金陵酒肆留別<span class="badge badge-form">七言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百七十四 · 三百首 第 301/327 首 · 七言古诗、离别、饮酒</span></div>
<div class="poem" id="p18"><div class="poem-body solo-body">
<div class="line">風吹柳花滿店香，<span class="ent ent-nation" data-note="吴姬压酒">吳</span>姬壓酒喚客嘗。</div>
<div class="line"><a class="ent ent-place" data-note="子弟相送" href="../entities/place_%E9%87%91%E9%99%B5.html">金陵</a>子弟來相送，欲行不行各盡觴。</div>
<div class="line">請君試問東流水，別意與之誰短長。</div>
</div></div></main>
