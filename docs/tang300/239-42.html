<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（239-42）</a>贈闕下裴舍人<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%8C%A2%E8%B5%B7.html">錢起</a><span class="solo-vol"> · 卷二百三十九 · 三百首 第 104/327 首 · 援引、七言律诗</span></div>
<div class="poem" id="p42"><div class="poem-body solo-body">
<div class="line">二月黃鶯飛<a class="ent ent-place" data-note="上林苑" href="../entities/place_%E4%B8%8A%E6%9E%97.html">上林</a>，春城<span class="ent ent-place" data-note="宫禁">紫禁</span>曉陰陰。</div>
<div class="line"><span class="ent ent-place" data-note="长乐宫">長樂</span>鐘聲花外盡，<span class="ent ent-place" data-note="兴庆宫龙池">龍池</span>柳色雨中深。</div>
<div class="line">陽和不散窮途恨，霄漢長懷捧日新。</div>
<div class="line">獻賦十年猶未遇，羞將白髮對華簪。</div>
</div></div></main>
