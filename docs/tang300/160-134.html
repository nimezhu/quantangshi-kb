<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-134）</a>歲除夜有懷<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 51/327 首 · 羁旅、五言律诗、春节</span></div>
<div class="poem" id="p134"><div class="poem-body solo-body">
<div class="line">迢遞<span class="ent ent-place" data-note="巴蜀羁旅">三巴</span>路，羈危萬里身。</div>
<div class="line">亂山殘雪夜，孤燭異鄉人。</div>
<div class="line">漸與骨肉遠，轉于奴僕親。</div>
<div class="line">那堪正飄泊，來日歲華新。</div>
</div></div></main>
