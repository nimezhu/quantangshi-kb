<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-106）</a>歲暮歸南山<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 60/321 首 · 抒情、失意</span></div>
<div class="poem" id="p106"><div class="poem-body solo-body">
<div class="line">北闕休上書，<a class="ent ent-place" href="../entities/place_%E5%8D%97%E5%B1%B1.html">南山</a>歸敝廬。</div>
<div class="line">不才明主棄，多病故人疏。</div>
<div class="line">白髮催年老，青陽逼歲除。</div>
<div class="line">永懷愁不寐，松月夜窗虛。</div>
</div></div></main>
