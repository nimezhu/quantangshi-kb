<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（540-169）</a>樂游原<span class="badge badge-form">雜言</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十 · 三百首 第 155/327 首 · 惜时、哲理</span></div>
<div class="poem" id="p169"><div class="poem-body solo-body">
<div class="line">向晚意不適，驅車登古原。</div>
<div class="line">夕陽無限好，只是近黃昏。</div>
<div class="line">萬樹鳴蟬隔岸虹，<a class="ent ent-place" data-note="长安登览胜地" href="../entities/place_%E4%B9%90%E6%B8%B8%E5%8E%9F.html">樂遊原</a>上有西風。</div>
<div class="line"><span class="ent ent-person" data-note="为日驾车之神">羲和</span>自趁<span class="ent ent-place" data-note="虞渊，日入之处">虞泉</span>宿，不放斜陽更向東。</div>
<div class="line">春夢亂不記，春原登已重。</div>
<div class="line"><span class="ent ent-place" data-note="长安东城青门">青門</span>弄煙柳，<span class="ent ent-place" data-note="终南山紫阁峰">紫閣</span>舞雲松。</div>
<div class="line">拂硯輕冰散，開尊綠酎濃。</div>
<div class="line">無悰託詩遣，吟罷更無悰。</div>
</div></div></main>
