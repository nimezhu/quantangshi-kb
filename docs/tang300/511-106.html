<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（511-106）</a>集靈台二首<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E7%A5%9C.html">張祜</a><span class="solo-vol"> · 卷五百一十一 · 三百首 第 119/327 首 · 七言绝句、写人、讽刺</span></div>
<div class="poem" id="p106"><div class="poem-body solo-body">
<div class="line">日光斜照<span class="ent ent-place" data-note="华清宫集灵台">集靈台</span>，紅樹花迎曉露開。</div>
<div class="line">昨夜<span class="ent ent-person" data-note="玄宗">上皇</span>新授籙，<span class="ent ent-person" data-note="杨贵妃号太真">太真</span>含笑入簾來。</div>
<div class="line"><span class="ent ent-person" data-note="贵妃姊，淡扫蛾眉">虢國夫人</span>承主恩，平明騎馬入宮門。</div>
<div class="line">卻嫌脂粉汙顏色，淡掃蛾眉朝至尊。</div>
</div></div></main>
