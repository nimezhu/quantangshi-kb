<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（540-183）</a>涼思<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十 · 三百首 第 49/330 首 · 愁思、五言律诗</span></div>
<div class="poem" id="p183"><div class="poem-body solo-body">
<div class="line">客去波平檻，蟬休露滿枝。</div>
<div class="line">永懷當此節，倚立自移時。</div>
<div class="line">北斗兼春遠，<span class="ent ent-place" data-note="宣州南陵，寓使迟迟">南陵</span>寓使遲。</div>
<div class="line">天涯占夢數，疑誤有新知。</div>
</div></div></main>
