<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（372-12）</a>遊子吟<span class="badge badge-form">五言古體</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E9%83%8A.html">孟郊</a><span class="solo-vol"> · 卷三百七十二 · 三百首 第 310/321 首 · 杂曲歌辞、乐府、母爱</span></div>
<div class="poem" id="p12"><div class="poem-body solo-body">
<div class="line">慈母手中線，遊子身上衣。</div>
<div class="line">臨行密密縫，意恐遲遲歸。</div>
<div class="line">誰言寸草心，報得三春暉。</div>
</div></div></main>
