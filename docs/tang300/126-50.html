<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-50）</a>過香積寺<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 54/330 首 · 写景、五言律诗</span></div>
<div class="poem" id="p50"><div class="poem-body solo-body">
<div class="line">不知<span class="ent ent-place" data-note="长安香积寺">香積寺</span>，數裏入雲峰。</div>
<div class="line">古木無人徑，深山何處鐘。</div>
<div class="line">泉聲咽危石，日色冷青松。</div>
<div class="line">薄暮空潭曲，安禪制毒龍。</div>
</div></div></main>
