<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（257-14）</a>征怨<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9F%B3%E4%B8%AD%E5%BA%B8.html">柳中庸</a><span class="solo-vol"> · 卷二百五十七 · 三百首 第 191/327 首 · 黄河、边塞、七言绝句</span></div>
<div class="poem" id="p14"><div class="poem-body solo-body">
<div class="line">歲歲<span class="ent ent-place" data-note="今大黑河，丰州边地">金河</span>複<span class="ent ent-place" data-note="玉门关">玉關</span>，朝朝馬策與刀環。</div>
<div class="line">三春白雪歸<span class="ent ent-place" data-note="昭君墓">青塚</span>，萬里<span class="ent ent-place" data-note="地名 · 精标">黃河</span>繞<span class="ent ent-place" data-note="杀虎山，在丰州">黑山</span>。</div>
</div></div></main>
