<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（134-19）</a>送魏萬之京<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E9%A0%8E.html">李頎</a><span class="solo-vol"> · 卷一百三十四 · 三百首 第 123/321 首 · 叙事、七言律诗、写景</span></div>
<div class="poem" id="p19"><div class="poem-body solo-body">
<div class="line">朝聞遊子唱離歌，昨夜微霜初渡河。</div>
<div class="line">鴻鴈不堪愁裏聽，雲山況是客中過。</div>
<div class="line">關城樹色催寒近，御苑砧聲向晚多。</div>
<div class="line">莫見<a class="ent ent-place" href="../entities/place_%E9%95%BF%E5%AE%89.html">長安</a>行樂處，空令歲月易蹉跎。</div>
</div></div></main>
