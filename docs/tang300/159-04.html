<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（159-04）</a>秋登蘭山寄張五<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百五十九 · 三百首 第 244/327 首 · 五言古诗、秋天、登高</span></div>
<div class="poem" id="p04"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="兰山">北山</span>白雲裏，隱者自怡悅。</div>
<div class="line">相望試登高，心飛逐鳥滅。</div>
<div class="line">愁因薄暮起，興是清秋發。</div>
<div class="line">時見歸村人，沙行渡頭歇。</div>
<div class="line">天邊樹若薺，江畔舟如月。</div>
<div class="line">何當載酒來，共醉<a class="ent ent-time" data-note="重阳载酒共醉" href="../entities/time_%E9%87%8D%E9%98%B3.html">重陽</a>節。</div>
</div></div></main>
