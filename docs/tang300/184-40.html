<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（184-40）</a>怨情<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百八十四 · 三百首 第 224/330 首 · 五言绝句、女子</span></div>
<div class="poem" id="p40"><div class="poem-body solo-body">
<div class="line">美人卷珠簾，深坐顰蛾眉。</div>
<div class="line">但見淚痕濕，不知心恨誰。</div>
</div></div></main>
