<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（184-40）</a>怨情<span class="badge badge-form">雜言</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百八十四 · 三百首 第 138/327 首 · 五言绝句、女子</span></div>
<div class="poem" id="p40"><div class="poem-body solo-body">
<div class="line">新人如花雖可寵，故人似玉由來重。</div>
<div class="line">花性飄揚不自持，玉心皎潔終不移。</div>
<div class="line">故人昔新今尚故，還見新人有故時。</div>
<div class="line">請看<span class="ent ent-person" data-note="汉武帝陈皇后，失宠居长门宫典">陳后</span>黃金屋，寂寂珠簾生網絲。</div>
<div class="line">美人捲珠簾，深坐顰蛾眉。</div>
<div class="line">但見淚痕濕，不知心恨誰。</div>
</div></div></main>
