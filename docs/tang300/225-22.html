<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（225-22）</a>春宿左省<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十五 · 三百首 第 8/321 首 · 爱国、写景、五言律诗</span></div>
<div class="poem" id="p22"><div class="poem-body solo-body">
<div class="line">花隱掖垣暮，啾啾棲鳥過。</div>
<div class="line">星臨萬戶動，月傍九霄多。</div>
<div class="line">不寢聽金鑰，因風想玉珂。</div>
<div class="line">明朝有封事，數問夜如何。</div>
</div></div></main>
