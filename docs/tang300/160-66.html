<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-66）</a>與諸子登峴山<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 47/330 首 · 吊古伤今、隋・唐・五代、五言律诗</span></div>
<div class="poem" id="p66"><div class="poem-body solo-body">
<div class="line">人事有代謝，往來成古今。</div>
<div class="line">江山留勝跡，我輩複登臨。</div>
<div class="line">水落<span class="ent ent-place" data-note="襄阳鱼梁洲">魚梁</span>淺，天寒<span class="ent ent-place" data-note="云梦泽">夢澤</span>深。</div>
<div class="line"><span class="ent ent-person" data-note="羊祜，岘山堕泪碑">羊公</span>碑字在，讀罷淚沾襟。</div>
</div></div></main>
