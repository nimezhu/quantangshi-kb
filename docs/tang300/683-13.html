<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（683-13）</a>已涼<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%93%E5%81%93.html">韓偓</a><span class="solo-vol"> · 卷六百八十三 · 三百首 第 177/321 首 · 七言绝句、爱情、写景</span></div>
<div class="poem" id="p13"><div class="poem-body solo-body">
<div class="line">碧闌幹外繡簾垂，猩血屏風畫折枝。</div>
<div class="line">八尺龍須方錦褥，已涼天氣未寒時。</div>
</div></div></main>
