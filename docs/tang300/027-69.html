<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（027-69）</a>雜曲歌辭：蓋羅縫<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E4%B8%8D%E8%A9%B3.html">不詳</a><span class="solo-vol"> · 卷二十七 · 三百首 第 98/321 首 · 战争、写景、忧国忧民</span></div>
<div class="poem" id="p69"><div class="poem-body solo-body">
<div class="line">秦時明月漢時關，萬里征人尚未還。</div>
<div class="line">但願龍庭神將在，不教胡馬渡陰山。</div>
<div class="line">音書杜絕白狼西，桃李無顏黃鳥啼。</div>
<div class="line">寒鳥春深歸去盡，出門腸斷草萋萋。</div>
</div></div></main>
