<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（229-40）</a>閣夜<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十九 · 三百首 第 110/330 首</span></div>
<div class="poem" id="p40"><div class="poem-body solo-body">
<div class="line">歲暮陰陽催短景，天涯霜雪霽寒宵。</div>
<div class="line">五更鼓角聲悲壯，<span class="ent ent-place" data-note="夔州临三峡">三峽</span>星河影動搖。</div>
<div class="line">野哭幾家聞戰伐，夷歌數處起漁樵。</div>
<div class="line"><span class="ent ent-person" data-note="诸葛亮">臥龍</span><span class="ent ent-person" data-note="公孙述跃马称帝">躍馬</span>終黃土，人事依依漫寂寥。</div>
</div></div></main>
