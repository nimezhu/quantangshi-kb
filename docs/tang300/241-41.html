<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（241-41）</a>石魚湖上醉歌<span class="badge badge-form">雜言</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%85%83%E7%B5%90.html">元結</a><span class="solo-vol"> · 卷二百四十一 · 三百首 第 172/327 首 · 洞庭湖</span></div>
<div class="poem" id="p41"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="道州石鱼湖">石魚湖</span>，似<a class="ent ent-place" data-note="湖似洞庭" href="../entities/place_%E6%B4%9E%E5%BA%AD.html">洞庭</a>，夏水欲滿<span class="ent ent-place" data-note="洞庭君山">君山</span>青。</div>
<div class="line">山爲樽，水爲沼，酒徒歷歷坐洲島。</div>
<div class="line">長風連日作大浪，不能廢人運酒舫。</div>
<div class="line">我持長瓢坐<span class="ent ent-place" data-note="巴丘山">巴丘</span>，酌飲四坐以散愁。</div>
</div></div></main>
