<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（174-24）</a>黃鶴樓送孟浩然之廣陵<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百七十四 · 三百首 第 147/330 首 · 长江、黄鹤楼、离别</span></div>
<div class="poem" id="p24"><div class="poem-body solo-body">
<div class="line">故人西辭<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E9%BB%84%E9%B9%A4%E6%A5%BC.html">黃鶴樓</a>，煙花三月下<a class="ent ent-place" data-note="烟花三月" href="../entities/place_%E6%89%AC%E5%B7%9E.html">揚州</a>。</div>
<div class="line">孤帆遠影碧山盡，唯見<span class="ent ent-place" data-note="地名 · 精标">長江</span>天際流。</div>
</div></div></main>
