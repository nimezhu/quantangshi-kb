<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（019-11）</a>相和歌辭：江南曲<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%9B%8A.html">李益</a><span class="solo-vol"> · 卷一十九 · 三百首 第 237/330 首 · 闺怨、乐府</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">嫁得<a class="ent ent-place" data-note="瞿塘贾：峡江商人" href="../entities/place_%E7%9E%BF%E5%A1%98.html">瞿塘</a>賈，朝朝誤妾期。</div>
<div class="line">早知潮有信，嫁與弄潮兒。</div>
</div></div></main>
