<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（372-01）</a>列女操<span class="badge badge-form">五言古體</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E9%83%8A.html">孟郊</a><span class="solo-vol"> · 卷三百七十二 · 三百首 第 311/321 首 · 赞颂、妇女、乐府</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">梧桐相待老，鴛鴦會雙死。</div>
<div class="line">貞女貴徇夫，舍生亦如此。</div>
<div class="line">波瀾誓不起，妾心井中水。</div>
</div></div></main>
