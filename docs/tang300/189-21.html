<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（189-21）</a>賦得暮雨，送李胄<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百八十九 · 三百首 第 65/321 首 · 写雨、友情、送别</span></div>
<div class="poem" id="p21"><div class="poem-body solo-body">
<div class="line">楚江微雨裏，建業暮鐘時。</div>
<div class="line">漠漠帆來重，冥冥鳥去遲。</div>
<div class="line">海門深不見，浦樹遠含滋。</div>
<div class="line">相送情無限，沾襟比散絲。</div>
</div></div></main>
