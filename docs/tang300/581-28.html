<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（581-28）</a>送人東游<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%BA%AB%E5%BA%AD%E7%AD%A0.html">溫庭筠</a><span class="solo-vol"> · 卷五百八十一 · 三百首 第 63/321 首 · 友情、送别、五言律诗</span></div>
<div class="poem" id="p28"><div class="poem-body solo-body">
<div class="line">荒戍落黃葉，浩然離故關。</div>
<div class="line">高風漢陽渡，初日郢門山。</div>
<div class="line">江上幾人在，天涯孤棹還。</div>
<div class="line">何當重相見，尊酒慰離顏。</div>
</div></div></main>
