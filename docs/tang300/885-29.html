<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（885-29）</a>春宮怨<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E8%8D%80%E9%B6%B4.html">杜荀鶴</a><span class="solo-vol"> · 卷八百八十五 · 三百首 第 313/330 首 · 五言律诗、写景、女子</span></div>
<div class="poem" id="p29"><div class="poem-body solo-body">
<div class="line">早被嬋娟誤，欲妝臨鏡慵。</div>
<div class="line">承恩不在貌，教妾若爲容。</div>
<div class="line">風暖鳥聲碎，日高花影重。</div>
<div class="line">年年<span class="ent ent-place" data-note="若耶溪，西施浣纱">越溪</span>女，相憶採芙蓉。</div>
<div class="line">早被嬋娟誤，欲妝臨鏡慵。</div>
<div class="line">承恩不在貌，教妾若爲容。</div>
<div class="line">風暖鳥聲碎，日高花影重。</div>
<div class="line">年年<span class="ent ent-place" data-note="地名 · 精标">越溪</span>女，相憶採芙蓉。</div>
</div></div></main>
