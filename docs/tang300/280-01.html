<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（280-01）</a>李端公<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%9B%A7%E7%B6%B8.html">盧綸</a><span class="solo-vol"> · 卷二百八十 · 三百首 第 82/327 首 · 冬天、友情、送别</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">故關衰草遍，離別自堪悲。</div>
<div class="line">路出寒雲外，人歸暮雪時。</div>
<div class="line">少孤為客早，多難識君遲。</div>
<div class="line">掩淚空相向，風塵何處期。</div>
</div></div></main>
