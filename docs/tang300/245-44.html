<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（245-44）</a>寒食<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%93%E7%BF%83.html">韓翃</a><span class="solo-vol"> · 卷二百四十五 · 三百首 第 202/327 首 · 清明、寒食节、典故</span></div>
<div class="poem" id="p44"><div class="poem-body solo-body">
<div class="line">春城無處不飛花，<a class="ent ent-time" data-note="清明前禁火节" href="../entities/time_%E5%AF%92%E9%A3%9F.html">寒食</a>東風禦柳斜。</div>
<div class="line">日暮<span class="ent ent-place" data-note="以汉宫喻唐宫">漢宮</span>傳蠟燭，輕煙散入<span class="ent ent-person" data-note="汉桓帝同日封五宦官为侯，喻贵幸之家">五侯</span>家。</div>
</div></div></main>
