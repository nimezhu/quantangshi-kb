<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（227-76）</a>登高<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十七 · 三百首 第 87/327 首 · 长江、七言律诗、写景</span></div>
<div class="poem" id="p76"><div class="poem-body solo-body">
<div class="line">風急天高猨嘯哀，渚清沙白鳥飛迴。</div>
<div class="line">無邊落木蕭蕭下，不盡<span class="ent ent-place" data-note="地名 · 精标">長江</span>衮衮來。</div>
<div class="line">萬里悲秋常作客，百年多病獨登臺。</div>
<div class="line">艱難苦恨繁霜鬢，潦倒新停濁酒桮。</div>
</div></div></main>
