<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（251-22）</a>夜月<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E6%96%B9%E5%B9%B3.html">劉方平</a><span class="solo-vol"> · 卷二百五十一 · 三百首 第 160/321 首 · 月亮、春天、田园</span></div>
<div class="poem" id="p22"><div class="poem-body solo-body">
<div class="line">更深月色半人家，北斗闌幹南斗斜。</div>
<div class="line">今夜偏知春氣暖，蟲聲新透綠窗紗。</div>
</div></div></main>
