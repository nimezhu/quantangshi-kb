<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（359-64）</a>西塞山懷古<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E7%A6%B9%E9%8C%AB.html">劉禹錫</a><span class="solo-vol"> · 卷三百五十九 · 三百首 第 100/321 首 · 隋・唐・五代、七言律诗、咏史怀古</span></div>
<div class="poem" id="p64"><div class="poem-body solo-body">
<div class="line">西晉樓船下益州，<a class="ent ent-place" href="../entities/place_%E9%87%91%E9%99%B5.html">金陵</a>王氣黯然收。</div>
<div class="line">千尋鐵鎖沈江底，一片降旛出石頭。</div>
<div class="line">人世幾回傷往事，山形依舊枕江流。</div>
<div class="line">今逢四海爲家日，故壘蕭蕭蘆荻秋。</div>
</div></div></main>
