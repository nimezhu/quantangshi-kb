<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（228-30）</a>別房太尉墓<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十八 · 三百首 第 69/321 首 · 忧国忧民、感伤、五言律诗</span></div>
<div class="poem" id="p30"><div class="poem-body solo-body">
<div class="line">他鄉複行役，駐馬別孤墳。</div>
<div class="line">近淚無干土，低空有斷雲。</div>
<div class="line">對棋陪謝傅，把劍覓徐君。</div>
<div class="line">唯見林花落，鶯啼送客聞。</div>
</div></div></main>
