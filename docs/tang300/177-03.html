<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（177-03）</a>送友人<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百七十七 · 三百首 第 3/321 首 · 八年级上册(课外)、友情、写景</span></div>
<div class="poem" id="p03"><div class="poem-body solo-body">
<div class="line">青山橫北郭，白水繞<a class="ent ent-place" href="../entities/place_%E4%B8%9C%E5%9F%8E.html">東城</a>。</div>
<div class="line">此地一為別，孤蓬萬里征。</div>
<div class="line">浮雲遊子意，落日故人情。</div>
<div class="line">揮手自茲去，蕭蕭班馬鳴。</div>
</div></div></main>
