<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（225-72）</a>天末懷李白<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十五 · 三百首 第 10/321 首 · 写风、五言律诗、风</span></div>
<div class="poem" id="p72"><div class="poem-body solo-body">
<div class="line">涼風起天末，君子意如何。</div>
<div class="line">鴻雁幾時到，江湖秋水多。</div>
<div class="line">文章憎命達，魑魅喜人過。</div>
<div class="line">應共冤魂語，投詩贈汨羅。</div>
</div></div></main>
