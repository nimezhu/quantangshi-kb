<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（245-15）</a>同題仙游觀<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%93%E7%BF%83.html">韓翃</a><span class="solo-vol"> · 卷二百四十五 · 三百首 第 119/330 首 · 向往、七言律诗、游历</span></div>
<div class="poem" id="p15"><div class="poem-body solo-body">
<div class="line"><span class="ent ent-place" data-note="仙游观高台">仙臺</span>下見<span class="ent ent-place" data-note="仙人五城十二楼">五城樓</span>，風物淒淒宿雨收。</div>
<div class="line">山色遙連<span class="ent ent-nation" data-note="秦地树色">秦</span>樹晚，砧聲近報<span class="ent ent-place" data-note="汉宫砧声，借指长安">漢宮</span>秋。</div>
<div class="line">疎松影落空壇靜，細草香閑小洞幽。</div>
<div class="line">何用別尋方外去，人間亦自有<span class="ent ent-place" data-note="仙境，昼夜常明">丹丘</span>。</div>
</div></div></main>
