<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（245-15）</a>同題仙游觀<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%93%E7%BF%83.html">韓翃</a><span class="solo-vol"> · 卷二百四十五 · 三百首 第 116/321 首 · 向往、七言律诗、游历</span></div>
<div class="poem" id="p15"><div class="poem-body solo-body">
<div class="line">仙臺下見五城樓，風物淒淒宿雨收。</div>
<div class="line">山色遙連秦樹晚，砧聲近報漢宮秋。</div>
<div class="line">疎松影落空壇靜，細草香閑小洞幽。</div>
<div class="line">何用別尋方外去，人間亦自有丹丘。</div>
</div></div></main>
