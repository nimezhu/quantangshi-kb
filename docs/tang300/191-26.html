<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（191-26）</a>夕次盱眙縣<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百九十一 · 三百首 第 72/330 首 · 五言古诗、写景、抒情</span></div>
<div class="poem" id="p26"><div class="poem-body solo-body">
<div class="line">落帆逗<span class="ent ent-place" data-note="淮水边市镇">淮鎮</span>，停舫臨孤驛。</div>
<div class="line">浩浩風起波，冥冥日沉夕。</div>
<div class="line">人歸山郭暗，雁下蘆洲白。</div>
<div class="line">獨夜憶<span class="ent ent-place" data-note="秦地关中，故乡">秦關</span>，聽鐘未眠客。</div>
</div></div></main>
