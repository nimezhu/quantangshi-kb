<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（697-23）</a>台城<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E8%8E%8A.html">韋莊</a><span class="solo-vol"> · 卷六百九十七 · 三百首 第 181/327 首 · 隋・唐・五代、写景、抒情</span></div>
<div class="poem" id="p23"><div class="poem-body solo-body">
<div class="line">江雨霏霏江草齊，<span class="ent ent-time" data-note="建都金陵之六代王朝，如梦成空">六朝</span>如夢鳥空啼。</div>
<div class="line">無情最是<span class="ent ent-place" data-note="六朝宫城，在金陵">台城</span>柳，依舊煙籠十裏堤。</div>
</div></div></main>
