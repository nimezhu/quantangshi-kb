<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（353-31）</a>漁翁<span class="badge badge-form">雜言</span></h1>
<div class="poem-author"><a href="../authors/%E6%9F%B3%E5%AE%97%E5%85%83.html">柳宗元</a><span class="solo-vol"> · 卷三百五十三 · 三百首 第 293/321 首 · 写人、七言古诗、山水</span></div>
<div class="poem" id="p31"><div class="poem-body solo-body">
<div class="line">漁翁夜傍西巖宿，曉汲清湘燃楚竹。</div>
<div class="line">煙銷日出不見人，[欸]乃一聲山水綠。</div>
<div class="line">迴看天際下中流，巖上無心雲相逐。</div>
</div></div></main>
