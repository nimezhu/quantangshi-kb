<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（193-63）</a>滁州西澗<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百九十三 · 三百首 第 149/321 首 · 春、山水、写景</span></div>
<div class="poem" id="p63"><div class="poem-body solo-body">
<div class="line">獨憐幽草澗邊生，上有黃鸝深樹鳴。</div>
<div class="line">春潮帶雨晚來急，野渡無人舟自橫。</div>
</div></div></main>
