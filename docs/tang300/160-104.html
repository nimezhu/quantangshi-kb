<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-104）</a>過故人莊<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 17/321 首 · 生活、田园、友情</span></div>
<div class="poem" id="p104"><div class="poem-body solo-body">
<div class="line">故人具雞黍，邀我至田家。</div>
<div class="line">綠樹村邊合，青山郭外斜。</div>
<div class="line">開筵面場圃，把酒話桑麻。</div>
<div class="line">待到<a class="ent ent-time" href="../entities/time_%E9%87%8D%E9%98%B3.html">重陽</a>日，還來就菊花。</div>
</div></div></main>
