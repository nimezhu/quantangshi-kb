<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（384-111）</a>沒蕃故人<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E7%B1%8D.html">張籍</a><span class="solo-vol"> · 卷三百八十四 · 三百首 第 36/330 首 · 怀人、五言律诗</span></div>
<div class="poem" id="p111"><div class="poem-body solo-body">
<div class="line">前年伐<span class="ent ent-nation" data-note="月氏，此借指吐蕃">月支</span>，城上沒全師。</div>
<div class="line"><span class="ent ent-nation" data-note="吐蕃与唐，音信断绝">蕃漢</span>斷消息，死生長別離。</div>
<div class="line">無人收廢帳，歸馬識殘旗。</div>
<div class="line">欲祭疑君在，天涯哭此時。</div>
</div></div></main>
