<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（143-18）</a>春宮曲<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E6%98%8C%E9%BD%A1.html">王昌齡</a><span class="solo-vol"> · 卷一百四十三 · 三百首 第 183/330 首 · 七言绝句、宫怨、女子</span></div>
<div class="poem" id="p18"><div class="poem-body solo-body">
<div class="line">昨夜風開露井桃，<a class="ent ent-place" data-note="未央前殿" href="../entities/place_%E6%9C%AA%E5%A4%AE%E5%AE%AB.html">未央</a>前殿月輪高。</div>
<div class="line"><a class="ent ent-place" data-note="平阳公主家歌女卫子夫承宠典" href="../entities/place_%E5%B9%B3%E9%98%B3.html">平陽</a>歌舞新承寵，簾外春寒賜錦袍。</div>
</div></div></main>
