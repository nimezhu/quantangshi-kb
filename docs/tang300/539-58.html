<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（539-58）</a>風雨<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百三十九 · 三百首 第 14/330 首 · 风雨、五言律诗、怀才不遇</span></div>
<div class="poem" id="p58"><div class="poem-body solo-body">
<div class="line">淒涼寶劍篇，羈泊欲窮年。</div>
<div class="line">黃葉仍風雨，青樓自管弦。</div>
<div class="line">新知遭薄俗，舊好隔良緣。</div>
<div class="line">心斷<span class="ent ent-place" data-note="马周落拓新丰、独酌斗酒典">新豐</span>酒，銷愁鬥幾千。</div>
</div></div></main>
