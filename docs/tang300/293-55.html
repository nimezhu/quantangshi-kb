<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（293-55）</a>喜外弟盧綸見宿<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%8F%B8%E7%A9%BA%E6%9B%99.html">司空曙</a><span class="solo-vol"> · 卷二百九十三 · 三百首 第 42/321 首 · 生活、五言律诗、年老</span></div>
<div class="poem" id="p55"><div class="poem-body solo-body">
<div class="line">靜夜四無鄰，荒居舊業貧。</div>
<div class="line">雨中黃葉樹，燈下白頭人。</div>
<div class="line">以我獨沈久，愧君相見頻。</div>
<div class="line">平生自有分，況是蔡家親。</div>
</div></div></main>
