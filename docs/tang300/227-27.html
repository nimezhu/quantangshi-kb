<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（227-27）</a>奉濟驛重送嚴公四韻<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十七 · 三百首 第 45/321 首 · 送别、五言律诗、惜别</span></div>
<div class="poem" id="p27"><div class="poem-body solo-body">
<div class="line">遠送從此別，青山空複情。</div>
<div class="line">幾時杯重把，昨夜月同行。</div>
<div class="line">列郡謳歌惜，三朝出入榮。</div>
<div class="line">江村獨歸處，寂寞養殘生。</div>
</div></div></main>
