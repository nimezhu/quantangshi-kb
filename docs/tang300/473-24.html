<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（473-24）</a>訪羊尊師<span class="badge badge-form">五絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%AB%E9%9D%A9.html">孫革</a><span class="solo-vol"> · 卷四百七十三 · 三百首 第 282/327 首 · 五言绝句、写人、寻访</span></div>
<div class="poem" id="p24"><div class="poem-body solo-body">
<div class="line">松下問童子，言師采藥去。</div>
<div class="line">只在此山中，雲深不知處。</div>
</div></div></main>
