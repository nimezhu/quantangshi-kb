<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（117-02）</a>桃花溪<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E6%97%AD.html">張旭</a><span class="solo-vol"> · 卷一百一十七 · 三百首 第 173/330 首 · 描写水、写景、抒情</span></div>
<div class="poem" id="p02"><div class="poem-body solo-body">
<div class="line">隱隱飛橋隔野煙，石磯西畔問漁船。</div>
<div class="line">桃花盡日隨流水，洞在清溪何處邊。</div>
</div></div></main>
