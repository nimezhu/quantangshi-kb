<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（144-05）</a>宿王昌齡隱居<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%B8%B8%E5%BB%BA.html">常建</a><span class="solo-vol"> · 卷一百四十四 · 三百首 第 73/327 首 · 隐逸、五言古诗、山水</span></div>
<div class="poem" id="p05"><div class="poem-body solo-body">
<div class="line">清溪深不測，隱處唯孤雲。</div>
<div class="line">松際露微月，清光猶為君。</div>
<div class="line">茅亭宿花影，藥院滋苔紋。</div>
<div class="line">余亦謝時去，<span class="ent ent-place" data-note="西山鸾鹤群">西山</span>鸞鶴群。</div>
</div></div></main>
