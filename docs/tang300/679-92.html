<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（679-92）</a>巴山道中除夜書懷<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%B4%94%E5%A1%97.html">崔塗</a><span class="solo-vol"> · 卷六百七十九 · 三百首 第 83/327 首 · 羁旅、五言律诗、春节</span></div>
<div class="poem" id="p92"><div class="poem-body solo-body">
<div class="line">迢遞<span class="ent ent-place" data-note="巴蜀羁旅">三巴</span>路，羈危萬里身。</div>
<div class="line">亂山殘雪夜，孤燭異鄉春。</div>
<div class="line">漸與骨肉遠，轉於僮僕親。</div>
<div class="line">那堪正漂泊，明日歲華新。</div>
</div></div></main>
