<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（233-13）</a>野望<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百三十三 · 三百首 第 35/321 首 · 七言律诗、写景、抒情</span></div>
<div class="poem" id="p13"><div class="poem-body solo-body">
<div class="line">納納乾坤大，行行郡國遙。</div>
<div class="line">雲山兼五嶺，風壤帶<a class="ent ent-nation" href="../entities/nation_%E4%B8%89%E8%8B%97.html">三苗</a>。</div>
<div class="line">野樹侵江闊，春蒲長雪消。</div>
<div class="line">扁舟空老去，無補聖明朝。</div>
</div></div></main>
