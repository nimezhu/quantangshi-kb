<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（019-116）</a>相和歌辭：從軍行<span class="badge badge-form">七言古體</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E9%A0%8E.html">李頎</a><span class="solo-vol"> · 卷一十九 · 三百首 第 308/327 首 · 生活、冬天、乐府</span></div>
<div class="poem" id="p116"><div class="poem-body solo-body">
<div class="line">白日登山望烽火，昏黃飲馬傍<span class="ent ent-place" data-note="西域交河城">交河</span>。</div>
<div class="line">行人刁斗風砂暗，<span class="ent ent-person" data-note="乌孙公主琵琶幽怨">公主</span>琵琶幽怨多。</div>
<div class="line">野營萬里無城郭，雨雪紛紛連大漠。</div>
<div class="line"><span class="ent ent-nation" data-note="邦国族群 · 精标">胡</span>雁哀鳴夜夜飛，<span class="ent ent-nation" data-note="邦国族群 · 精标">胡</span>兒眼淚雙雙落。</div>
<div class="line">聞道<span class="ent ent-place" data-note="玉门被遮典">玉門</span>猶被遮，應將性命逐輕車。</div>
<div class="line">年年戰骨埋荒外，空見蒲萄入<span class="ent ent-nation" data-note="邦国族群 · 精标">漢家</span>。</div>
</div></div></main>
