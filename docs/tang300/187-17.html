<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（187-17）</a>初發揚子，寄元大校書<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E9%9F%8B%E6%87%89%E7%89%A9.html">韋應物</a><span class="solo-vol"> · 卷一百八十七 · 三百首 第 75/330 首 · 离别、五言古诗、依恋</span></div>
<div class="poem" id="p17"><div class="poem-body solo-body">
<div class="line">淒淒去親愛，泛泛入煙霧。</div>
<div class="line">歸棹<a class="ent ent-place" data-note="归棹洛阳人" href="../entities/place_%E6%B4%9B%E9%98%B3.html">洛陽</a>人，殘鐘<a class="ent ent-place" data-note="残钟广陵树" href="../entities/place_%E5%B9%BF%E9%99%B5.html">廣陵</a>樹。</div>
<div class="line">今朝此為別，何處還相遇。</div>
<div class="line">世事波上舟，沿洄安得住。</div>
</div></div></main>
