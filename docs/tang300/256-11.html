<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（256-11）</a>闕題<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8A%89%E6%98%9A%E8%99%9B.html">劉昚虛</a><span class="solo-vol"> · 卷二百五十六 · 三百首 第 21/330 首 · 春天、写景、五言律诗</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">道由白雲盡，春與青溪長。</div>
<div class="line">時有落花至，遠隨流水香。</div>
<div class="line">閑門向山路，深柳讀書堂。</div>
<div class="line">幽映每白日，清輝照衣裳。</div>
</div></div></main>
