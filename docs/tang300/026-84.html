<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（026-84）</a>雜曲歌辭：秋夜曲<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E6%B6%AF.html">王涯</a><span class="solo-vol"> · 卷二十六 · 三百首 第 209/327 首 · 思念、秋天、女子</span></div>
<div class="poem" id="p84"><div class="poem-body solo-body">
<div class="line">桂魄初生秋露微，輕羅已薄未更衣。</div>
<div class="line">銀箏夜久殷勤弄，心怯空房不忍歸。</div>
</div></div></main>
