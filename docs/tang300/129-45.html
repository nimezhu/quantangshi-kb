<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（129-45）</a>尋西山隱者不遇<span class="badge badge-form">雜言</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E4%B8%98%E7%82%BA.html">丘為</a><span class="solo-vol"> · 卷一百二十九 · 三百首 第 209/330 首 · 五言古诗、友情</span></div>
<div class="poem" id="p45"><div class="poem-body solo-body">
<div class="line">絕頂一茅茨，直[上]三十里。</div>
<div class="line">扣關無僮僕，窺室唯案几。</div>
<div class="line">若非巾柴車，應是釣秋水。</div>
<div class="line">差池不相見，黽勉空仰止。</div>
<div class="line">草色新雨中，松聲晚牕裏。</div>
<div class="line">及茲契幽絕，自足蕩心耳。</div>
<div class="line">雖無賓主意，頗得清淨理。</div>
<div class="line">興盡方下山，何必待之子。</div>
</div></div></main>
