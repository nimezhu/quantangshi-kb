<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（128-60）</a>雜詩三首<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十八 · 三百首 第 296/330 首 · 景中情、写景、思亲</span></div>
<div class="poem" id="p60"><div class="poem-body solo-body">
<div class="line">家住<span class="ent ent-place" data-note="黄河孟津渡">孟津</span>河，門對<span class="ent ent-place" data-note="地名 · 精标">孟津</span>口。</div>
<div class="line">常有<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E6%B1%9F%E5%8D%97.html">江南</a>船，寄書家中否。</div>
<div class="line">君自故鄉來，應知故鄉事。</div>
<div class="line">來日綺窗前，寒梅著花未。</div>
<div class="line">已見寒梅發，複聞啼鳥聲。</div>
<div class="line">心心視春草，畏向階前生。</div>
</div></div></main>
