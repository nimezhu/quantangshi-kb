<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（292-44）</a>雲陽館與韓紳宿別<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%8F%B8%E7%A9%BA%E6%9B%99.html">司空曙</a><span class="solo-vol"> · 卷二百九十二 · 三百首 第 67/327 首 · 友情、五言律诗、惜别</span></div>
<div class="poem" id="p44"><div class="poem-body solo-body">
<div class="line">故人江海別，幾度隔山川。</div>
<div class="line">乍見翻疑夢，相悲各問年。</div>
<div class="line">孤燈寒照雨，濕竹暗浮煙。</div>
<div class="line">更有明朝恨，離杯惜共傳。</div>
</div></div></main>
