<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-18）</a>宿桐廬江，寄廣陵舊游<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 72/321 首 · 描写水、五言律诗、怀人</span></div>
<div class="poem" id="p18"><div class="poem-body solo-body">
<div class="line">山暝聞猿愁，滄江急夜流。</div>
<div class="line">風鳴兩岸葉，月照一孤舟。</div>
<div class="line">建德非吾土，維揚憶舊遊。</div>
<div class="line">還將兩行淚，遙寄海西頭。</div>
</div></div></main>
