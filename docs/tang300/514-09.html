<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（514-09）</a>宮詞<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E6%9C%B1%E6%85%B6%E9%A4%98.html">朱慶餘</a><span class="solo-vol"> · 卷五百一十四 · 三百首 第 181/321 首 · 七言绝句、宫怨、写景</span></div>
<div class="poem" id="p09"><div class="poem-body solo-body">
<div class="line">寂寂花時閉院門，美人相並立瓊軒。</div>
<div class="line">含情欲說宮中事，鸚鵡前頭不敢言。</div>
</div></div></main>
