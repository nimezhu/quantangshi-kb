<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（224-63）</a>春望<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十四 · 三百首 第 4/330 首 · 战争、忧国忧民、爱国</span></div>
<div class="poem" id="p63"><div class="poem-body solo-body">
<div class="line">國破山河在，城春草木深。</div>
<div class="line">感時花濺淚，恨別鳥驚心。</div>
<div class="line">烽火連三月，家書抵萬金。</div>
<div class="line">白頭搔更短，渾欲不勝簪。</div>
</div></div></main>
