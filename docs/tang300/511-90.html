<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（511-90）</a>贈內人<span class="badge badge-form">七絕</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E7%A5%9C.html">張祜</a><span class="solo-vol"> · 卷五百一十一 · 三百首 第 212/327 首 · 七言绝句、宫怨、女子</span></div>
<div class="poem" id="p90"><div class="poem-body solo-body">
<div class="line">禁門宮樹月痕過，媚眼唯看宿燕窠。</div>
<div class="line">斜拔玉釵燈影畔，剔開紅焰救飛蛾。</div>
</div></div></main>
