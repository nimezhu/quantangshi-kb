<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（226-01）</a>蜀相<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十六 · 三百首 第 97/321 首 · 隋・唐・五代、七言律诗、忧国忧民</span></div>
<div class="poem" id="p01"><div class="poem-body solo-body">
<div class="line">丞相祠堂何處尋，<a class="ent ent-place" href="../entities/place_%E9%94%A6%E5%AE%98%E5%9F%8E.html">錦官城</a>外柏森森。</div>
<div class="line">映堦碧草自春色，隔葉黃鸝空好音。</div>
<div class="line">三顧頻煩天下計，兩朝開濟老臣心。</div>
<div class="line">出師未捷身先死，長使英雄淚滿襟。</div>
</div></div></main>
