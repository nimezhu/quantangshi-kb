<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（164-11）</a>玉階怨<span class="badge badge-form">五絕</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百六十四 · 三百首 第 202/321 首 · 孤独、宫怨、乐府</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">玉階生白露，夜久侵羅襪。</div>
<div class="line">卻下水晶簾，玲瓏望秋月。</div>
</div></div></main>
