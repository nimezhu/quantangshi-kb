<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（540-149）</a>賈生<span class="badge badge-form">七絕</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html">李商隱</a><span class="solo-vol"> · 卷五百四十 · 三百首 第 157/321 首 · 隋・唐・五代、托古讽今、七言绝句</span></div>
<div class="poem" id="p149"><div class="poem-body solo-body">
<div class="line">宣室求賢訪逐臣，<a class="ent ent-person" href="../entities/person_%E8%B4%BE%E7%94%9F.html">賈生</a>才調更無倫。</div>
<div class="line">可憐夜半虛前席，不問蒼生問鬼神。</div>
</div></div></main>
