<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（026-38）</a>雜曲歌辭：長幹曲四首<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%B4%94%E9%A1%A5.html">崔顥</a><span class="solo-vol"> · 卷二十六 · 三百首 第 298/330 首 · 乐府、女子、孤独</span></div>
<div class="poem" id="p38"><div class="poem-body solo-body">
<div class="line">君家定何處，妾住在<span class="ent ent-place" data-note="金陵堤塘">橫塘</span>。</div>
<div class="line">停舟暫借問，或恐是同鄉。</div>
<div class="line">家臨<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E4%B9%9D%E6%B1%9F.html">九江</a>水，去來<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E4%B9%9D%E6%B1%9F.html">九江</a>側。</div>
<div class="line">同是<span class="ent ent-place" data-note="金陵里巷">長幹</span>人，生小不相識。</div>
<div class="line">下渚多風浪，蓮舟漸覺稀。</div>
<div class="line">那能不相待，獨自逆潮歸。</div>
<div class="line"><span class="ent ent-place" data-note="地名 · 精标">三江</span>潮水急，<a class="ent ent-place" data-note="地名 · 精标" href="../entities/place_%E4%BA%94%E6%B9%96.html">五湖</a>風浪湧。</div>
<div class="line">由來花性輕，莫畏蓮舟重。</div>
</div></div></main>
