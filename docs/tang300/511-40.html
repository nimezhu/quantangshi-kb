<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（511-40）</a>宮詞二首<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E7%A5%9C.html">張祜</a><span class="solo-vol"> · 卷五百一十一 · 三百首 第 29/327 首 · 五言绝句、宫怨</span></div>
<div class="poem" id="p40"><div class="poem-body solo-body">
<div class="line">故國三千里，深宮二十年。</div>
<div class="line">一聲河滿子，雙淚落君前。</div>
<div class="line">自倚能歌日，先皇掌上憐。</div>
<div class="line">新聲何處唱，腸斷<span class="ent ent-person" data-note="汉武帝乐官，善新声">李延年</span>。</div>
</div></div></main>
