<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（228-55）</a>宿府<span class="badge badge-form">七律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%94%AB.html">杜甫</a><span class="solo-vol"> · 卷二百二十八 · 三百首 第 93/330 首 · 感时、孤独、七言律诗</span></div>
<div class="poem" id="p55"><div class="poem-body solo-body">
<div class="line">清秋幕府井梧寒，獨宿江城蠟炬殘。</div>
<div class="line">永夜角聲悲自語，中天月色好誰看。</div>
<div class="line">風塵荏苒音書絕，關塞蕭條行路難。</div>
<div class="line">已忍伶俜十年事，強移栖息一枝安。</div>
</div></div></main>
