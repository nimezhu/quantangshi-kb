<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-60）</a>終南別業<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 15/321 首 · 田园、抒情、五言律诗</span></div>
<div class="poem" id="p60"><div class="poem-body solo-body">
<div class="line">中歲頗好道，晚家<a class="ent ent-place" href="../entities/place_%E5%8D%97%E5%B1%B1.html">南山</a>陲。</div>
<div class="line">興來每獨往，勝事空自知。</div>
<div class="line">行到水窮處，坐看雲起時。</div>
<div class="line">偶然值林叟，談笑無還期。</div>
</div></div></main>
