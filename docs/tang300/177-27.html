<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（177-27）</a>宣州謝脁樓餞別校書叔雲<span class="badge badge-form">雜言</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百七十七 · 三百首 第 199/330 首 · 八年级下册(课外)、七言古诗、初中古诗</span></div>
<div class="poem" id="p27"><div class="poem-body solo-body">
<div class="line">棄我去者昨日之日不可留，亂我心者今日之日多煩憂。</div>
<div class="line">長風萬里送秋雁，對此可以酣高樓。</div>
<div class="line"><span class="ent ent-place" data-note="东观藏书处称蓬莱山，代指汉代文章">蓬萊</span>文章<span class="ent ent-time" data-note="建安风骨">建安</span>骨，中間<span class="ent ent-person" data-note="谢朓，清发之才">小謝</span>又清發。</div>
<div class="line">俱懷逸興壯思飛，欲上青天覽日月。</div>
<div class="line">抽刀斷水水更流，舉杯銷愁愁更愁。</div>
<div class="line">人生在世不稱意，明朝散髮弄扁舟。</div>
</div></div></main>
