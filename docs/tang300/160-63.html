<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（160-63）</a>清明日宴梅道士房<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百六十 · 三百首 第 44/327 首 · 五言律诗</span></div>
<div class="poem" id="p63"><div class="poem-body solo-body">
<div class="line">林臥愁春盡，開軒覽物華。</div>
<div class="line">忽逢<span class="ent ent-person" data-note="西王母信使，此指道士相邀">青鳥</span>使，邀入<span class="ent ent-person" data-note="赤松子，仙人">赤松</span>家。</div>
<div class="line">丹灶初開火，仙桃正落花。</div>
<div class="line">童顏若可駐，何惜醉流霞。</div>
</div></div></main>
