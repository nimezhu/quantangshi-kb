<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（638-36）</a>書邊事<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E5%BC%B5%E5%96%AC.html">張喬</a><span class="solo-vol"> · 卷六百三十八 · 三百首 第 2/321 首 · 生活、五言律诗、边塞</span></div>
<div class="poem" id="p36"><div class="poem-body solo-body">
<div class="line">調角斷清秋，征人倚戍樓。</div>
<div class="line">春風對青塚，白日落梁州。</div>
<div class="line">大漢無兵阻，窮邊有客遊。</div>
<div class="line">蕃情似此水，長願向南流。</div>
</div></div></main>
