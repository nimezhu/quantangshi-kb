<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-72）</a>漢江臨泛<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 70/321 首 · 山水、抒情、五言律诗</span></div>
<div class="poem" id="p72"><div class="poem-body solo-body">
<div class="line">楚塞三湘接，荊門九派通。</div>
<div class="line">江流天地外，山色有無中。</div>
<div class="line">郡邑浮前浦，波瀾動遠空。</div>
<div class="line">襄陽好風日，留醉與山翁。</div>
</div></div></main>
