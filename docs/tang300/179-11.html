<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（179-11）</a>下終南山過斛斯山人宿置酒<span class="badge badge-form">五言排律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%8E%E7%99%BD.html">李白</a><span class="solo-vol"> · 卷一百七十九 · 三百首 第 294/330 首 · 终南山、五言古诗、田园</span></div>
<div class="poem" id="p11"><div class="poem-body solo-body">
<div class="line">暮從碧山下，山月隨人歸。</div>
<div class="line">卻顧所來徑，蒼蒼橫翠微。</div>
<div class="line">相攜及田家，童稚開荊扉。</div>
<div class="line">綠竹入幽徑，青蘿拂行衣。</div>
<div class="line">歡言得所憩，美酒聊共揮。</div>
<div class="line">長歌吟松風，曲盡河星稀。</div>
<div class="line">我醉君複樂，陶然共忘機。</div>
</div></div></main>
