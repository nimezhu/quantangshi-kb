<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（078-36）</a>在獄詠蟬<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E9%A7%B1%E8%B3%93%E7%8E%8B.html">駱賓王</a><span class="solo-vol"> · 卷七十八 · 三百首 第 47/321 首 · 咏物、咏物诗、五言律诗</span></div>
<div class="poem" id="p36"><div class="poem-body solo-body">
<div class="line">西陸蟬聲唱，南冠客思侵。</div>
<div class="line">那堪玄鬢影，來對白頭吟。</div>
<div class="line">露重飛難進，風多響易沉。</div>
<div class="line">無人信高潔，誰為表予心。</div>
</div></div></main>
