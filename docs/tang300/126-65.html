<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（126-65）</a>終南山<span class="badge badge-form">五律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%B6%AD.html">王維</a><span class="solo-vol"> · 卷一百二十六 · 三百首 第 25/321 首 · 终南山、一年级下册、五言律诗</span></div>
<div class="poem" id="p65"><div class="poem-body solo-body">
<div class="line">太乙近天都，連山接海隅。</div>
<div class="line">白雲回望合，青靄入看無。</div>
<div class="line">分野中峰變，陰晴眾壑殊。</div>
<div class="line">欲投人處宿，隔水問樵夫。</div>
</div></div></main>
