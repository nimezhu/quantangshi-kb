<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（159-62）</a>夜歸鹿門山歌<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html">孟浩然</a><span class="solo-vol"> · 卷一百五十九 · 三百首 第 129/321 首 · 写景、归隐、七言古诗</span></div>
<div class="poem" id="p62"><div class="poem-body solo-body">
<div class="line">山寺鐘鳴晝已昏，漁梁渡頭爭渡喧。</div>
<div class="line">人隨沙路向江村，余亦乘舟歸鹿門。</div>
<div class="line">鹿門月照開煙樹，忽到龐公棲隱處。</div>
<div class="line">巖扉松徑長寂寥，惟有幽人夜來去。</div>
</div></div></main>
