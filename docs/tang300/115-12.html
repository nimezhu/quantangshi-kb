<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（115-12）</a>次北固山下<span class="badge badge-form">五律</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E7%81%A3.html">王灣</a><span class="solo-vol"> · 卷一百一十五 · 三百首 第 17/327 首 · 七年级上册(课内)、地点、五言律诗</span></div>
<div class="poem" id="p12"><div class="poem-body solo-body">
<div class="line">客路青山外，行舟綠水前。</div>
<div class="line">潮平兩岸闊，風正一帆懸。</div>
<div class="line">海日生殘夜，江春入舊年。</div>
<div class="line">鄉書何處達，歸雁<a class="ent ent-place" data-note="归雁传书之乡" href="../entities/place_%E6%B4%9B%E9%98%B3.html">洛陽</a>邊。</div>
</div></div></main>
