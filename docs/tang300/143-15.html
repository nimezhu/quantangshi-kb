<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（143-15）</a>出塞二首<span class="badge badge-form">七律</span></h1>
<div class="poem-author"><a href="../authors/%E7%8E%8B%E6%98%8C%E9%BD%A1.html">王昌齡</a><span class="solo-vol"> · 卷一百四十三 · 三百首 第 90/321 首 · 战争、写景、忧国忧民</span></div>
<div class="poem" id="p15"><div class="poem-body solo-body">
<div class="line">秦時明月漢時關，萬里長征人未還。</div>
<div class="line">但使龍城飛將在，不教胡馬度陰山。</div>
<div class="line">騮馬新跨白玉鞍，戰罷沙場月色寒。</div>
<div class="line">城頭鐵鼓聲猶振，匣裏金刀血未幹。</div>
</div></div></main>
