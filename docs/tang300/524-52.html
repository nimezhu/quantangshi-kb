<main id="content"><h1 class="poem-title solo-title"><a class="para-num" href="#">（524-52）</a>遣懷<span class="badge badge-form">雜言</span><span class="badge badge-pilot" title="实体经逐字精标（试点）">精標</span></h1>
<div class="poem-author"><a href="../authors/%E6%9D%9C%E7%89%A7.html">杜牧</a><span class="solo-vol"> · 卷五百二十四 · 三百首 第 165/327 首 · 七言绝句、抒怀</span></div>
<div class="poem" id="p52"><div class="poem-body solo-body">
<div class="line">道泰時還泰，時來命不來。</div>
<div class="line">何當離城市，高臥<span class="ent ent-place" data-note="齐地名山">博山</span>隈。</div>
<div class="line">落魄<a class="ent ent-place" data-note="落魄载酒行" href="../entities/place_%E6%B1%9F%E5%8D%97.html">江南</a>載酒行，<span class="ent ent-nation" data-note="楚灵王好细腰典">楚</span>腰腸斷掌中輕。</div>
<div class="line">十年一覺<a class="ent ent-place" data-note="十年一觉扬州梦" href="../entities/place_%E6%89%AC%E5%B7%9E.html">揚州</a>夢，贏得青樓薄倖名。</div>
</div></div></main>
