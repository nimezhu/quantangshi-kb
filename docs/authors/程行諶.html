<details class="biography"><summary>小传（全唐诗数据库）</summary><p>程行諶，與鄠縣尉裴子餘同舍。行諶以文法稱，而子餘以儒顯。長史陳崇業曰：“蘭菊異芬，無可廢者。”詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制送張說上集賢學士賜宴》">張說<small>×1</small></a></div>
