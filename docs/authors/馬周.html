<h1>馬周<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>馬周，字賓王，清河茌平人。孤貧好學，尤精詩傳。初入關，舍中郎將常何家。貞觀中，代爲草疏。何武人，上怪其能，對以臣家客馬周爲之，召見大悅，授監察御史，數言事，無不嘉納，累遷中書令。太宗嘗賜以飛白書曰：“鸞鳳凌雲，必資羽翼，股肱之寄，誠在忠良。”集十卷，今存詩一首。</p></details>
