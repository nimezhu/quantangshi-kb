<h1>席豫<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>席豫，字建侯，襄陽人。徙家河南，進士及第。開元中，累官考功外郎，典舉得士，三遷中書舍人。與韓休、許景先、徐安貞、孫逖相次掌制誥，皆有能名。天寶初，改尚書左丞，檢校禮部尚書。明皇登朝元閣賦詩，羣臣屬和，帝以豫詩最工。詔曰：“詩人之首出，作者之冠冕也。”詩五首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制答張說南出雀鼠谷》">張說<small>×2</small></a></div>
