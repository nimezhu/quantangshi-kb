<details class="biography"><summary>小传（全唐诗数据库）</summary><p>吳仁璧，字廷寶，吳人或云關右人。大順二年，登進士第。錢鏐據浙，累辟不就，鏐怒，沈之江。詩一卷，今存十一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%84%AD%E4%BB%81%E8%A1%A8.html" title="《讀度人經寄鄭仁表》">鄭仁表<small>×1</small></a></div>
