<h1>劉三複<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉三復，潤州句容人，以文章見知于李德裕。自浙西迄淮甸，常在賓幕，後遺詣闕求試，登第。會昌時，歷刑部侍郎、弘文館學士。集十三卷，今存詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E8%A8%B1%E6%B8%BE.html" title="《下第歸朱方寄劉三複》">許渾<small>×3</small></a><a class="chip" href="../authors/%E6%9D%9C%E7%89%A7.html" title="《送劉三複郎中赴闕》">杜牧<small>×1</small></a></div>
