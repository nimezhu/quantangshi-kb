<h1>張均<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張均，說長子。開元中，歷官大理卿，受祿山僞命爲中書令。肅宗立，免死，長流合浦。集二十卷，今存詩七首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%B0%B9%E6%87%8B.html" title="《和尹懋登南樓》">尹懋<small>×2</small></a><a class="chip" href="../authors/%E7%9B%A7%E8%B1%A1.html" title="《贈張均員外》">盧象<small>×1</small></a></div>
