<h1>馬懷素<span class="vol-count">12 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>馬懷素，字惟白，潤州丹徒人，擢進士第。長安中，爲監察御史，守正不阿。開元初，拜戶部侍郎，昭文館學士，卒，謚曰文。詩十二首。</p></details>
