<h1>裴耀卿<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>裴耀卿，字煥之，守真子。應童子舉，爲睿宗藩邸典籤。開元中，累官濟州刺史，再歷宣冀二州，入拜戶部侍郎。請廣漕運，以實關輔，沿河置倉納粟，又開山陸運以避三門之險。擢黃門侍郎，同平章事，充轉運使，遷侍中，終尚書左僕射。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E4%B9%9D%E9%BD%A1.html" title="《敬酬張九齡當塗界留贈之作》">張九齡<small>×2</small></a></div>
