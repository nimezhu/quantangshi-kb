<h1>劉洎<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉洎，字思道，荆州江陵人。初授都督府長史。貞觀中，拜給事中，轉治書侍御史。性疎峻，敢言，累官散騎常侍。太宗嘗宴羣臣，賜飛白字，或乘酒爭取於帝手，洎登御座，引手得之，帝笑曰：“昔聞婕妤辭輦，今見常侍登牀。”後遷侍中，被譖賜死。集十卷，今存詩一首。</p></details>
