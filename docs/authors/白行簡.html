<h1>白行簡<span class="vol-count">7 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>白行簡，字知退，白居易之弟。貞元末第進士，累官度支郎中，有兄風。嘗從居易謫所，天性友愛，當時無比。集二十卷，今存詩七首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html" title="《在巴南望郡南山呈樂天》">白居易<small>×1</small></a></div>
