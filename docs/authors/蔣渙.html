<h1>蔣渙<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蔣渙，冽之弟，擢進士。天寶末，爲給事中。永泰初，歷鴻臚卿，日本使嘗遺金帛，不受，惟取牋一番，爲書以貽其副。終禮部尚書。詩五首。</p></details>
