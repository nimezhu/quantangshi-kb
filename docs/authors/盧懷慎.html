<h1>盧懷慎<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧懷慎，滑州人，第進士。歷監察御史，遷右御史臺中丞，黃門侍郎。開元初，進同紫微黃門平章事，卒，諡文成。詩二首。</p></details>
