<h1>裴漼<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>裴漼，絳州聞喜人。應大禮舉，累官監察御史，三遷中書舍人。開元中，拜吏部侍郎，典選數年，多所甄拔，再轉黃門侍郎。漼早與張說善，說爲相，數薦之。漼長于敷奏，上亦自嘉重，由是擢爲吏部尚書，太子賓客。詩四首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制送張說上集賢學士賜宴》">張說<small>×1</small></a></div>
