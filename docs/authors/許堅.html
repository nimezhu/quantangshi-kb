<h1>許堅2<span class="vol-count">11 首 · 见于 2 卷</span></h1>
<div class="poem-author">又作：許堅1</div><details class="biography"><summary>小传（全唐诗数据库）</summary><p>許堅，有異術，嘗往來廬阜茅山間。李璟時，以異人召，不至，後不知所終。詩五首。 許堅，字介石，廬江人。 許堅，南唐李璟時人。補詩一首。</p></details>
