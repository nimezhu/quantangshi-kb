<h1>馮涓<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>馮涓，字信之，東陽人，或曰信都人。舉進士，登大中四年宏詞科，爲京兆府參軍，尋隱商山。昭宗起爲祠部郎中，擢眉州刺史。田陳拒命，不令之任，涓於成都墨池灌園自給。王建據蜀，以爲翰林學士，終御史大夫。集十三卷，今存詩二首。</p></details>
