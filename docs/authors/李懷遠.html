<h1>李懷遠<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李懷遠，邢州柏仁人。擢四科第，累除司禮少卿。則天時，爲鸞臺侍郎。神龍初，兵部尚書同中書門下三品。集八卷，今存詩一首。 李懷遠，邢州柏仁人。擢四科第，累除司禮少卿。則天時，爲鸞臺侍郎。神龍初，兵部尚書同中書門下三品。集八卷，今存詩一首。</p></details>
