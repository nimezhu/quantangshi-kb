<h1>岑羲<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>岑羲，字伯華，文本之孫，第進士。則天時，爲天官員外郎。中宗朝，同中書門下三品。景雲初，進侍中，封南陽郡公，坐豫太平公主謀，伏誅。詩六首。</p></details>
