<h1>王起<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王起，字舉之，揚州人，宰相播之弟。貞元十四年進士第，又登制策直言極諫科，累官尚書左僕射，終山南西道節度使。起書無不讀，一經目弗忘，三典貢舉，皆得人。集一百二十卷，今存詩六首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%9F%93%E7%BF%83.html" title="《訪王起居不遇留贈》">韓翃<small>×1</small></a><a class="chip" href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html" title="《禁中曉臥，因懷王起居》">白居易<small>×1</small></a><a class="chip" href="../authors/%E7%9B%A7%E8%82%87.html" title="《和主司王起》">盧肇<small>×1</small></a><a class="chip" href="../authors/%E4%B8%81%E6%A3%B1.html" title="《和主司王起》">丁棱<small>×1</small></a><a class="chip" href="../authors/%E9%AB%98%E9%80%80%E4%B9%8B.html" title="《和主司王起》">高退之<small>×1</small></a><a class="chip" href="../authors/%E5%AD%9F%E7%90%83.html" title="《和主司王起》">孟球<small>×1</small></a><a class="chip" href="../authors/%E5%8A%89%E8%80%95.html" title="《和主司王起》">劉耕<small>×1</small></a><a class="chip" href="../authors/%E8%A3%B4%E7%BF%BB.html" title="《和主司王起》">裴翻<small>×1</small></a><a class="chip" href="../authors/%E6%A8%8A%E9%A9%A4.html" title="《和主司王起》">樊驤<small>×1</small></a><a class="chip" href="../authors/%E5%B4%94%E8%BB%92.html" title="《和主司王起》">崔軒<small>×1</small></a></div>
