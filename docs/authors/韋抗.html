<h1>韋抗<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋抗，安石從父兄子。弱冠舉明經，累官吏部郎中，以清謹著稱，遷御史中丞。開元中，自左庶子出爲益州長史，入拜黃門侍郎，終刑部尚書。所薦梁昇卿、王倕、王燾皆爲顯人。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制送張說上集賢學士賜宴》">張說<small>×1</small></a></div>
