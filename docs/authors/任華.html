<h1>任華<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>任華，李、杜同時人。初爲桂州刺史參佐，嘗與賈京尹、杜中丞，嚴大夫牋多所致責。又《與庾中丞書》云：“華本野人，常思漁釣，尋當杖策，歸乎舊山，非有機心，致斯扣擊，其亦狂狷之流歟。”詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E7%99%BD.html" title="《寄李白》">李白<small>×1</small></a><a class="chip" href="../authors/%E6%9D%8E%E6%B4%9E.html" title="《和知己赴任華州》">李洞<small>×1</small></a></div>
