<h1>魏元忠<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>魏元忠，宋州人。初爲太學生，累舉不調。時有左史盩厔人江融撰九州設險圖，備載古今用兵成敗之事，元忠就傳其術。儀鳳中，上封事馭吐蕃，授祕書正字。則天時，以平徐敬業功擢司刑，後拜鳳閣侍郎，同平章事，獨不附二張。中宗朝，遷中書令，以預節愍太子誅武三思謀，貶渠州司馬。詩二首。</p></details>
