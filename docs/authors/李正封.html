<h1>李正封<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李正封，官監察御史。詩五首。  正封，字中護，隴西人。元和二年舉進士及第，同年賢良方正能直言極諫科及第。歷任監察御史、司勳員外郎、彰義軍判官、司勳郎中。（《全唐詩》卷三四七小傳過略，今據《郎官石柱題名考》卷七補傳）</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%AE%91%E6%BA%B6.html" title="《秋夜對月懷李正封》">鮑溶<small>×1</small></a></div>
