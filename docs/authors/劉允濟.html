<h1>劉允濟<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉允濟，《紀事》作元濟，字允濟，洛州鞏人。少與絳州王勃齊名，舉本州進士，累除著作佐郎。嘗采摭魯哀公以後至戰國爲《魯後春秋》，表上之，遷左史，兼直弘文館。垂拱中，獻《明堂賦》，拜著作郎，擢鳳閣舍人。中興初，坐二張昵狎貶官，後爲修文館學士卒。集十卷，今存詩四首。</p></details>
