<h1>林氏<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>林氏，濟南人，隰城丞薛元曖妻也。元曖早卒，林博涉五經，有母儀令德。訓其子彥輔、彥國、彥偉、彥雲及姪據、摠、播，並登進士第，衣冠榮之。詩一首。</p></details>
