<h1>李密<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李密，京兆長安人。隋末，以父寬蔭爲左親侍，宇文述勸令學，因謝病讀書。嘗乘一黃牛，被以蒲韀，挂漢書一帙於角上，一手捉靷，一手翻卷。越公楊素見而異之，語其子玄感，傾心結納。及玄感舉兵，迎密爲謀主，兵敗亡命，集衆據洛口，自號魏公，移檄州郡。後爲王世充所敗，歸唐，拜光祿卿，封邢國公。行至桃林，懼誅，將叛，史萬寶遣副將盛彥師追斬之。詩一首。</p></details>
