<h1>眉娘<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>眉娘，南海人，盧姓，生而眉長，稱眉娘。神針善繡，順宗召入宮中，號神姑。憲宗度爲女道士，稱逍遙大師。放歸，後數年尸解。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%8D%93%E8%8B%B1%E8%8B%B1.html" title="《和卓英英錦城春望》">卓英英<small>×2</small></a></div>
