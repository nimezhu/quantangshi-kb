<h1>義淨<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>義淨，字文明，范陽人，俗姓張氏。咸亨初，往西域，徧歷三十餘國，經二十五年，求得梵本四百部，歸譯之。詩六首。</p></details>
