<h1>義淨<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>義淨，字文明，范陽人，俗姓張氏。咸亨初，往西域，徧歷三十餘國，經二十五年，求得梵本四百部，歸譯之。詩六首。</p></details>
<h2 class="section-title">作品</h2>
<div class="poem-body">
<div class="line"><span class="vg-num">卷808</span><a href="../volumes/808.html#p21">在西國懷王舍城</a> <a href="../volumes/808.html#p22">與無行禪師同游鷲嶺瞻奉…雜言詩</a> <a href="../volumes/808.html#p23">玄逵律師言離廣府還望桂林去留愴然自述贈懷</a> <a href="../volumes/808.html#p24">餘以咸亨元年在西京尋聽于時與並部處一法師…聊題兩絕</a> <a href="../volumes/808.html#p25">西域寺</a> <a href="../volumes/808.html#p26">道希法師求法西域終於庵摩羅跋國後…聊題一絕</a></div>
