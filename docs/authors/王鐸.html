<h1>王鐸<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王鐸，字昭範，宰相播之從子。會昌初，擢進士第，咸通時拜相。黃巢之亂，命爲行營都統，封晉公。後落職，節度滄景，爲魏博節度樂從訓所害。詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E4%BA%8E%E8%88%88%E5%AE%97.html" title="《和于興宗登越王樓詩》">于興宗<small>×1</small></a></div>
