<h1>楊牢<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊牢，字松年，弘農人。父從田弘正，死於趙軍。牢走常山二千里，號伏叛壘，求屍歸葬，銜哀雨血，時稱孝童。年十八，登大中二年進士第，最有詩名。詩二首。</p></details>
