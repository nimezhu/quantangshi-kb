<h1>林傑<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>林傑，字智周，閩人。幼而秀異，六歲賦詩，援筆立成，唐扶見而賞之。又精琴棋草隸，舉神童，年十七卒。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%84%AD%E7%AB%8B%E4%B9%8B.html" title="《哭林傑》">鄭立之<small>×1</small></a></div>
