<h1>韋迢<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋迢，京兆人，爲都官郎。歷嶺南節度行軍司馬，卒贈同州刺史。與杜甫友善，其出牧韶州，甫有詩送之。存詩二首。</p></details>
