<h1>蔡允恭<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蔡允恭，荆州江陵人。有風采，善綴文。仕隋，歷著作佐郎，起居舍人，煬帝屬詞賦，多令諷誦之。入唐，爲文學館學士。貞觀初，除太子洗馬。集二十卷，今存詩一首。</p></details>
