<h1>許孟容<span class="vol-count">4 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>許孟容，京兆長安人，舉進士甲科。貞元初，爲張建封從事，四遷侍御史。德宗知其才，徴爲禮部員外郎，遷給事中，多所論奏。元和中，由太常卿爲尚書左丞，居官守正，善拔士，議論人物，有大臣風采。詩三首。</p></details>
