<h1>神迥<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>神迥，里籍不詳。幼出家，節高行峭。住越州大禹寺。寶應間慕稱心寺大義禪師，同習三觀於天台宗。辭筆弘贍，華藻紛紜，所撰《朗師真影讚》、《法華經文句序》冠絕于時。（詳附按）</p></details>
