<h1>羅紹威<span class="vol-count">4 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>羅紹威，字端己。魏州貴鄉人，弘信之子。唐末，官魏博節度使，封鄴王。入梁，累拜太師兼中書令。集五卷，今存詩二首。</p></details>
