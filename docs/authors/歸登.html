<h1>歸登<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>歸登，字沖之，吳縣人，崇敬之子。貞元初，策賢良，爲右拾遺，轉右補闕、起居舍人。順宗爲皇太子，登父子侍讀，及即位，以東宮恩，拜給事中，遷工部侍郎。復爲皇太子諸王侍讀，累進工部尚書。卒，諡曰憲。詩一首。</p></details>
