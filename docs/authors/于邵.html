<h1>于邵<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>于邵，字相門，京兆萬年人。天寶末，進士登科，書判超絕，授崇文館校書郎。歷比部郎中，出爲巴州刺史。時夷獠聚衆圍州，邵遣使諭降，儒服出城，羣盜羅拜解散。節度使李抱玉以聞，遷梓州。後爲禮部侍郎、史館修撰，當時大詔令皆出其手。貞元中重陽應制詩，居次等，今不傳，存樂章五首。</p></details>
