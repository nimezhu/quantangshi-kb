<h1>崔玄亮<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔玄亮，字晦叔，磁州人。貞元中，與元白同登第。憲宗時，爲監察御史，歷密、歙、湖三州刺史。太和中，由諫議大夫遷散騎常侍，終虢州刺史。有《三州倡和集》，今存詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html" title="《和白樂天》">白居易<small>×1</small></a><a class="chip" href="../authors/%E5%A7%9A%E5%90%88.html" title="《送崔玄亮赴果州冬夜宴韓卿宅》">姚合<small>×1</small></a></div>
