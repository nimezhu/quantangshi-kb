<h1>張抃<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張抃，滑人。與張巡固守睢陽，城陷，死難者三十六人，抃其一也。宋汪應辰作廟記云：“初顯於湖湘間，後及江右，至玉山，皆祀之。”碑載詩一首。</p></details>
