<h1>長孫無忌<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>長孫無忌，字機輔，河南洛陽人，文德皇后之兄。好學，有籌略，佐太宗定天下，以功第一，封齊國公，歷尚書僕射、司空，誡懼盈滿，固辭不許，復拜司徒。貞觀十七年，圖功臣二十四人於凌煙閣，無忌爲之冠。高宗即位，進冊太尉，知門下省。後爲許敬宗誣搆，貶死黔州。詩三首。</p></details>
