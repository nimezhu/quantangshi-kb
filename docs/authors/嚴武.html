<h1>嚴武<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>嚴武，字季鷹，華州人，工部侍郎挺之之子。以蔭調太原府參軍，累遷殿中侍御史。從明皇入蜀，擢諫議大夫。至德初，房琯以其名臣子，薦爲給事中。歷劒南節度使，入爲太子賓客兼御史大夫，改吏部侍郎，尋轉黃門侍郎，再爲成都尹。以破吐蕃功，進檢校吏部尚書，封鄭國公。最善杜甫，其復鎮劒南，甫往依之。詩六首。</p></details>
