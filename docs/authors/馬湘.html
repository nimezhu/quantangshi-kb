<h1>馬湘<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>馬湘，字自然，杭州鹽官人。貌醜，齇鼻、禿鬢、大口，飲酒石餘，醉臥即以拳入口，遊行處多題詩句。大中十年，歸鄉，忽死。明年，又於梓桐縣白日上昇。有司奏聞，勅浙西發塚視之，乃一竹杖而已。</p></details>
