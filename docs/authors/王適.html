<h1>王適<span class="vol-count">7 首 · 见于 3 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>閭丘均，益州成都人，以文章著稱。景龍中，爲安樂公主所薦，拜太常博士。主敗，坐貶循州司倉。集十卷，今存詩一首。</p></details>
