<h1>盛小叢<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盛小叢，越妓。李訥爲浙東廉使，夜登城樓，聞歌聲激切，召至，乃小叢也。時崔侍御元範[在]至府幕，赴闕，李餞之，命小叢歌餞，在座各賦詩贈之，小叢有詩一首。</p></details>
