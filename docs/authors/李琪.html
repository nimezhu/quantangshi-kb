<h1>李琪<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李琪，字台秀，燉煌人。昭宗時，舉進士，累官殿中侍御史。入梁，爲翰林學士。末帝時，拜門下平章事。唐明宗朝，位至太子少傅。集十卷，今存詩二首。</p></details>
