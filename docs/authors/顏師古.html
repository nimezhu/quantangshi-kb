<h1>顏師古<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>顏師古，字籀《舊唐書》云：“顏籀，字師古。”，雍州萬年人，齊黃門侍郎之推之孫。博覽羣書，尤精訓詁。隋末爲安養尉，高祖入關，謁見長春宮，授朝散大夫。累遷中書舍人，專掌機密。太宗初，擢中書侍郎，考定五經，多所釐正，頒其書令天下學習。所注班固《漢書》、《急就章》，大行於世。終祕書監、弘文館學士。集六十卷，今存詩一首。</p></details>
