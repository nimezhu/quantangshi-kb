<h1>韓滉<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韓滉，字太沖，少師休之子，以蔭補騎曹參軍。至德初，青齊節度鄧景山辟爲判官，授監察御史，累遷吏部員外郎。大曆中，改郎中，擢尚書左丞。德宗朝，爲江淮轉運使，加同平章事。工書，兼善丹青。詩二首。</p></details>
