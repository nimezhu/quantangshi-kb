<h1>鄧洵美<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鄧洵美，連州人，或曰郴郡人。晉天福中登第，後還鄉，上牋周行逢，署館驛巡官，已而行逢疑之，貶爲易俗場官，使盜殺之。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E6%98%89.html" title="《答同年李昉見贈次韻》">李昉<small>×1</small></a></div>
