<h1>馮宿<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>馮宿，字拱之，婺州人。貞元中，登進士第，張建封辟爲掌書記。長慶初，以刑部郎中知制誥。太和初，爲河南尹，歷工刑二部侍郎、東川節度使。集四十卷，今存詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html" title="《酬白樂天劉夢得》">白居易<small>×1</small></a><a class="chip" href="../authors/%E5%8A%89%E7%A6%B9%E9%8C%AB.html" title="《酬白樂天劉夢得》">劉禹錫<small>×1</small></a><a class="chip" href="../authors/%E6%9D%8E%E8%A7%80.html" title="《贈馮宿》">李觀<small>×1</small></a></div>
