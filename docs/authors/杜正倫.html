<h1>杜正倫<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>杜正倫，相州洹水人。隋世重舉秀才，天下不十人，而正倫與弟正玄、正藏俱擢第，一門三秀才，爲當時稱美。太宗召直秦府文學館。貞觀元年，以魏徵薦，擢兵部員外郎，累遷中書侍郎，兼太子左庶子，參典機密。顯慶中，拜中書令，貶橫州刺史。集十卷，今存詩二首。</p></details>
