<h1>鄭愚<span class="vol-count">4 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鄭愚，番禺人。咸通中，觀察桂管，入爲禮部侍郎。黃巢平後，出鎮南海，終尚書左僕射。詩二首。 鄭愚，番禺人，咸通中，觀察桂管，入爲禮部侍郎，黃巢平後，出鎮南海，終尚書左僕射。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html" title="《和鄭愚贈汝陽王孫家箏妓二十韻》">李商隱<small>×1</small></a><a class="chip" href="../authors/%E6%9D%8E%E4%BB%A4.html" title="《擬權龍褒體贈鄠縣李令及寄朝右》">李令<small>×1</small></a></div>
