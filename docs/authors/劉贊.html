<h1>劉贊<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉贊，唐末人。詩一首。按唐末劉贊有三：一魏州人，舉進士，爲羅紹威判官，仕唐明宗中書舍人；一桂陽人，宰相瞻之子，擢進士，仕梁，充崇政殿學士；一仕閩王曦，爲御史中丞。三人皆與羅隱同時，未知孰是。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%9B%A7%E7%B6%B8.html" title="《至德中贈內兄劉贊》">盧綸<small>×1</small></a><a class="chip" href="../authors/%E7%BE%85%E9%9A%B1.html" title="《贈羅隱》">羅隱<small>×1</small></a></div>
