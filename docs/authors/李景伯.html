<h1>李景伯<span class="vol-count">3 首 · 见于 3 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李景伯，懷遠子。景龍中，爲給事中，遷諫議大夫。中宗嘗宴侍臣及朝集使，酒酣，令各爲《回波辭》，衆皆爲諂佞，景伯獨不然。蕭至忠稱之曰：“此真諫官也。”終散騎常侍，詩一首。 李景伯，懷遠子，景龍中，爲給事中，遷諫議大夫，中宗嘗宴侍臣及朝集使，酒酣，令各爲回波辭，衆皆爲諂佞，景伯獨不然，蕭至忠稱之曰，此真諫官也。終散騎常侍，詩一首。</p></details>
