<h1>柳公綽<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>柳公綽，字寬，京兆華原人。舉賢良方正，直言極諫。武元衡節度劒南，與裴度俱爲判官，相引重，召爲吏部郎中。元和初，進太醫箴，遷御史中丞，歷六鎮。太和中，終兵部尚書。性耿介，有大臣節，爲文不尚浮靡，所取士如許康佐、鄭朗、盧簡辭、崔璵、夏侯孜、李拭、韋長，皆知名顯貴。詩三首。</p></details>
