<h1>段義宗<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography" open><summary>小传（御定全唐詩）</summary><p>外夷</p></details><details class="biography"><summary>小传（全唐诗数据库）</summary><p>段義宗，南方長和國布燮（官稱，相當於宰相）。前蜀乾德中入蜀使，因不欲朝拜，遂禿削爲僧。補詩三首。（按《全唐詩》佚句卷收段義宗佚句六句，不見全篇，注只云「外夷」人，其實皆吾中華當時所謂南土藩臣耳，亦兄弟民族也）（《全唐詩》卷七三二收布燮詩二首，布燮即指段義宗，見《鑑誡錄》卷中。）</p></details>
