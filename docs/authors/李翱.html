<h1>李翱<span class="vol-count">7 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李翱，字習之。中貞元進士第，調校書郎。元和初，爲國子監博士、史館修撰，遷考功員外郎。除朗、廬二州刺史，入爲諫議大夫，知制誥，改中書舍人，會昌中，終山南東道節度使。詩七首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%AD%9F%E9%83%8A.html" title="《汴州離亂後憶韓愈、李翱》">孟郊<small>×2</small></a><a class="chip" href="../authors/%E9%9F%93%E6%84%88.html" title="《送李翱》">韓愈<small>×1</small></a><span class="chip">惟儼<small>×1</small></span><a class="chip" href="../authors/%E5%8A%89%E8%A8%80%E5%8F%B2.html" title="《奉酬劉言史宴光風亭》">劉言史<small>×1</small></a><a class="chip" href="../authors/%E8%88%92%E5%85%83%E8%BC%BF.html" title="《贈李翱》">舒元輿<small>×1</small></a></div>
