<h1>劉昭禹<span class="vol-count">15 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉昭禹，字休明，桂陽人一云婺州人。在湖南，累爲縣令，後署天策府學士，終巖州刺史。集一卷，今存詩九首。 劉昭禹，字休明，桂陽人一云婺州人。在湖南，累爲縣令，後署天策府學士，終巖州刺史。集一卷，今存詩九首。</p></details>
