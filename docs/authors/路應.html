<h1>路應<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>路應，字從衆，京兆三原人。大曆間授溫州刺史，築堤橫陽樂成界中，二邑得上田，除水害。補詩一首。（《全唐詩》卷八八七收路應詩一首，無傳。）</p></details>
