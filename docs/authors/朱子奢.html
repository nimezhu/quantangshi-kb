<h1>朱子奢<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>朱子奢，蘇州人，善文辭，通春秋。貞觀時，累官諫議大夫、弘文館學士。爲人樂易，能劇談，以經義緣飾，每侍宴，帝令與羣臣論難，皆莫能及。詩一首。</p></details>
