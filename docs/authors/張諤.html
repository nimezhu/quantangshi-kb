<h1>張諤<span class="vol-count">12 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張諤，景龍中登進士第，仕爲陳王掾。岐王範雅好儒士，諤與閻朝隱、劉庭琦、鄭繇等皆從之遊，賦詩飲酒，後坐貶山茌丞。詩十二首。</p></details>
