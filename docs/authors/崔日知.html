<h1>崔日知<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔日知，字子駿，日用從父兄也，有吏幹。景雲中，爲洺州司馬。以討譙王重福功，累遷京兆尹。爲御史李如璧所劾，左遷歙縣丞，後爲太常卿。自以歷任年久，每朝士參集，常與尚書同列，時人號爲尚書裏行。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制賜崔日知往潞州應制》">張說<small>×1</small></a></div>
