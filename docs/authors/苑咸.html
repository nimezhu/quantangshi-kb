<h1>苑咸<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<div class="poem-author">又作：苑鹹</div><details class="biography"><summary>小传（全唐诗数据库）</summary><p>苑咸，成都人，舉進士登第。爲李林甫書記，開元末上書，拜司經校書、中書舍人。嘗爲孫逖草除庶子詔，議者以爲知言。王維嘗謂舍人能書梵字，兼達梵音，曲盡其妙。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%8E%8B%E7%B6%AD.html" title="《酬王維》">王維<small>×1</small></a></div>
