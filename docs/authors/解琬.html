<h1>解琬<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>解琬，魏州元城人。中幽素科，調新政尉，除監察御史，習邊事。景龍中，遷御史大夫，兼朔方行軍大總管，守邊積二十年。開元中，終同州刺史。詩二首。</p></details>
