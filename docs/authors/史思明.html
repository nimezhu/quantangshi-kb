<h1>史思明<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>思明，本名窣干，寧夷州突厥雜種胡人。天寶初，以軍功至將軍知平盧軍事，遷北平太守。十一載，除平盧兵馬使。安祿山反，代賈循爲范陽留後。乾元二年，殺安慶緒，僭稱大聖燕王。上元二年，爲子朝義縊殺。詩二首。（《全唐詩》卷八六九收思明詩一首，缺傳，今據《舊唐書》卷二○○本傳補傳。）</p></details>
