<h1>李旦<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>帝諱旦，高宗第八子，中宗母弟，封相王。景龍四年，即皇帝位。帝謙恭孝友，好學，工草隸，尤愛文字訓詁之書。在位三年，諡曰大聖貞皇帝。詩一首。</p></details>
