<h1>太原妓<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>歐陽詹遊太原，悅一妓，約至都相迎。別後，妓思之，疾甚，乃刃髻作詩寄詹，絕筆而逝。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%AD%90%E9%99%BD%E8%A9%B9.html" title="《寄歐陽詹》">歐陽詹<small>×1</small></a></div>
