<h1>盧鴻一<span class="vol-count">10 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧鴻一，字浩然，范陽人，徙家洛陽。少有學業，頗善籀篆楷隸，隱於嵩山。開元中，以諫議大夫召，鴻一固辭，乃聽還山。詩十首，編爲一卷。</p></details>
