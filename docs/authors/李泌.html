<h1>李泌<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李泌，字長源，京兆人。七歲知爲文，明皇召令供奉東宮。肅宗即位，參預軍國大議，拜銀青光祿大夫，仍請還山。代宗朝，召爲翰林學士，尋爲杭州刺史。德宗幸奉天，徵授散騎常侍。貞元中，拜中書侍郎平章事，封鄴縣侯。集二十卷，今存詩四首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%A1%A7%E6%B3%81.html" title="《送李泌》">顧況<small>×1</small></a></div>
