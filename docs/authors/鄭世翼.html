<h1>鄭世翼<span class="vol-count">6 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鄭世翼，滎陽人，弱冠有盛名。武德中，歷萬年丞、揚州錄事參軍，數以言辭忤物。貞觀中，坐怨謗，流巂州卒。集多遺失，今存詩五首。</p></details>
