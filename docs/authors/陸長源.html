<h1>陸長源<span class="vol-count">5 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陸長源，字泳之，海之孫也，歷汝州刺史。貞元中，爲宣武節度司馬，總留後事，軍亂，遇害。詩三首。</p></details>
