<h1>王紹宗<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王紹宗，字承烈，揚州江都人。嗜學，尤工草隸，家貧，常傭力寫佛經以自給。徐敬業逼之，不起。則天時，拜太子文學，累轉祕書少監。詩一首。</p></details>
