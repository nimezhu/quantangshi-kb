<h1>李行言<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李行言，隴西人，兼文學幹事。中宗時，爲給事中，能唱《步虛歌》。七月七日兩儀殿會宴，帝命爲之，行言於御前長跪，作《三洞道士音詞》，歌數曲，時論鄙之。詩一首。</p></details>
