<h1>李峴<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李峴，信安郡王禕之第三子。樂善下士，以門蔭入仕，歷京兆府尹。天寶中，楊國忠惡其不附己，出爲長沙太守。時京兆雨災，米麥踊貴，百姓謠曰：“欲得米粟賤，無過追李峴。”其爲政得人心如此。乾元二年，拜中書侍郎同平章事。坐言事切直，謫蜀州刺史。代宗召爲禮部尚書，尋復知政事。初收東京，按治逆黨，多所全活，終衢州刺史。集一卷，今存詩一首。</p></details>
