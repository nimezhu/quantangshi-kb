<h1>沈千運<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>沈千運，吳興人，家於汝北。爲詩力矯時習，一出雅正。王季友、于逖、孟雲卿、張彪、趙徵明、元季川，皆其同調也。乾元中，季川兄結嘗編七人詩爲《篋中集》，千運爲之冠。詩五首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%8E%8B%E5%AD%A3%E5%8F%8B.html" title="《代賀若令譽贈沈千運》">王季友<small>×1</small></a></div>
