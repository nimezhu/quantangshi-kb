<h1>于志寧<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>于志寧，字仲謐，高陵人。隋末有名，高祖入關，禮遇之，爲太宗天策府從事中郎，侍從征伐，兼文學館學士。太宗宴貴臣內殿，志寧以非三品，不至，上怪之，特令預宴，即加散騎常侍，爲太子詹事，數有規諫。高宗朝，拜尚書左僕射，兼太子少師。集四十卷，今存詩一首。</p></details>
