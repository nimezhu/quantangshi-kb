<h1>蘇晉<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蘇晉，數歲能屬文，作《八卦論》。吏部侍郎房穎叔、祕書少監王紹，見而歎曰：“後來之王粲也。”應進士，又舉大禮科，皆上第。先天中，累遷中書舍人，崇文館學士。明皇監國，每有制命，皆晉及賈曾稿定。數進讜言，以父珦年老，乞解職歸侍。開元十四年，爲吏部侍郎，知選事。多賞拔，終太子左庶子。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制送張說巡邊》">張說<small>×1</small></a></div>
