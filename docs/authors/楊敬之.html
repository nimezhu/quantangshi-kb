<h1>楊敬之<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊敬之，字茂孝。元和初，登進士第，擢累屯田、戶部二郎中。坐李宗閔黨，貶連州刺史。文宗向儒術，以敬之爲國子祭酒。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E8%B3%80.html" title="《出城寄權璩、楊敬之》">李賀<small>×1</small></a><a class="chip" href="../authors/%E6%9D%8E%E6%B6%89.html" title="《送楊敬之倅湖南》">李涉<small>×1</small></a><a class="chip" href="../authors/%E9%A0%85%E6%96%AF.html" title="《贈項斯》">項斯<small>×1</small></a></div>
