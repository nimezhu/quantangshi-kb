<h1>李嶷<span class="vol-count">5 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李嶷，開元十五年進士第，官左武衞錄事。殷璠稱其詩“鮮潔有規矩，其《少年行》三首，詞雖不多，翩翩然俠氣在目。”今存詩六首。</p></details>
