<h1>陸敬<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陸敬，仕竇建德爲祭酒。秦王軍武牢，敬說建德自太行上黨進，乘唐之虛以取山北，建德不從，以及於敗，後歸唐。集十四卷，今存詩四首。</p></details>
