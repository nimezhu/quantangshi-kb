<h1>王播<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王播，字明敭，其先太原人。父恕，爲揚州倉曹參軍，遂家焉。播與弟炎、起皆有文名，並擢進士。長慶初，拜相，太和初，復專政。卒，贈太尉。詩三首。</p></details>
