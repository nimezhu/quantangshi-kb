<h1>馬逢<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>逢，扶風人。貞元五年進士，二十年任盩厔尉。元和二年自咸陽尉試大理評事充京兆觀察支度使，後任殿中侍御史、監察御史。（《全唐詩》卷七七二收馬逢詩五首，事跡無考，今據《元和姓纂四校記》卷七擬傳）</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%8A%89%E7%A6%B9%E9%8C%AB.html" title="《重送鴻舉師赴江陵謁馬逢侍禦》">劉禹錫<small>×1</small></a><a class="chip" href="../authors/%E5%85%83%E7%A8%B9.html" title="《送東川馬逢侍禦使回十韻》">元稹<small>×1</small></a></div>
