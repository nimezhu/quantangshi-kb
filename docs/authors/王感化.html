<h1>王感化<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王感化，建州人，後入金陵教坊。少聰敏，未嘗執卷，而多識。善爲詞，滑稽無窮。元宗嗣位，宴樂擊鞠不輟，嘗乘醉命感化奏水調詞，感化唯歌“南朝天子愛風流”一句，如是者數四。元宗悟，覆杯歎曰：“使孫陳二主得此一句，不當有銜璧之辱也。”由是有寵。詩二首。</p></details>
