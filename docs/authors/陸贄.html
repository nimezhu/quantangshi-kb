<h1>陸贄<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陸贄，字敬輿，嘉興人。登進士第，中博學宏詞，調鄭尉，罷歸。復以書判拔萃補渭南尉。德宗立，由監察御史召爲翰林學士。貞元八年，拜中書侍郎同平章事。裴延齡搆之，貶忠州別駕。順宗立，召還，詔未至卒。贈兵部尚書，諡曰宣。集二十七卷，今存三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%8C%A2%E8%B5%B7.html" title="《送陸贄擢第還蘇州》">錢起<small>×1</small></a><a class="chip" href="../authors/%E7%9B%A7%E7%B6%B8.html" title="《驛中望山戲贈渭南陸贄主簿》">盧綸<small>×1</small></a></div>
