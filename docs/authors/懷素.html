<h1>懷素<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>懷素，京兆人，姓范一作錢，從玄奘法師出家。上元三年，詔住西太原寺，尋歸西京，以草書名。詩二首。 懷素，俗姓錢，字藏真，長沙人。嗜酒，善草書，與張旭齊名。晚年居室曰綠天庵。貞元十五年書《千字文》，時年六十三。存世法帖甚衆。（傳據陸羽《釋懷素傳》、《宣和書譜》卷十九、《釋氏疑年錄》卷四。另詳附按）</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%8C%A2%E8%B5%B7.html" title="《送外甥懷素上人歸鄉侍奉》">錢起<small>×1</small></a></div>
