<h1>李程<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李程，字表臣，隴西人。貞元十二年，登進士第。累辟使府，爲監察御史，充翰林學士。元和中，知制誥，拜禮部侍郎。敬宗即位，以吏部侍郎同平章事，後罷爲河東節度使。程在翰苑，日過八塼乃至，時號八塼學士。詩五首。</p></details>
