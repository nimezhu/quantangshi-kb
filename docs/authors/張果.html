<h1>張果<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張果，兩當人，先隱中條山，後於鸑鷟山登真洞往來。天后召之，不起，明皇以禮致之，肩輿入宮，擢銀青光祿大夫，賜號通玄先生。未幾，還山。</p></details>
