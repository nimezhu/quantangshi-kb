<h1>陸海<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陸海，餘慶之孫，有才思。與陳子昂、盧藏用爲方外十友。工於五言，爲賀知章所賞。性嚴峻，不附權要，自省郎出牧潮州。存詩二首。</p></details>
