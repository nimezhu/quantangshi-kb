<h1>宗楚客<span class="vol-count">7 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>宗楚客，字子敖，蒲州河東人，則天從父姊之子也。累遷夏官侍郎，同鳳閣鸞臺平章事。神龍中，武三思引爲兵部尚書，同知政事，拜中書令，與侍中紀處訥共爲朋黨，後伏誅。詩六首。</p></details>
