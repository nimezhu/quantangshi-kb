<h1>江為<span class="vol-count">9 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>江爲，宋州人。避亂家建陽，遊廬山，師陳貺爲詩。集一卷，今存詩八首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%AD%9F%E8%B2%AB.html" title="《送江為歸嶺南》">孟貫<small>×1</small></a></div>
