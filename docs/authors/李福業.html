<h1>李福業<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李福業，調露二年進士，登第後爲侍御史。五王誅二張，亦與謀，及敗，放於番禺，匿志州參軍敬元禮家，吏獲之，就刑。詩一首。</p></details>
