<h1>令狐峘<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>令狐峘，德棻五世孫，登進士第。祿山之亂，隱居南山豹林谷。司徒楊綰未仕時，亦避地谷中，嘗止峘舍，賞其博學，及綰爲禮部侍郎，引入史館。建中初，爲禮部侍郎，典貢舉，執政楊炎有所請託，峘得其私書奏之。德宗惡其訐，貶衡州別駕。詩二首。</p></details>
