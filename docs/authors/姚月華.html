<h1>姚月華<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>姚月華，嘗夢月墜妝臺，覺而大悟，聰慧過人。少失母，隨父寓揚子江，見鄰舟書生楊達詩，命侍兒乞其稿，達立綴豔詩致情。自後屢相酬和，會其父有江右之行，蹤跡遂絕。詩六首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%A5%8A%E9%81%94.html" title="《制履贈楊達》">楊達<small>×2</small></a></div>
