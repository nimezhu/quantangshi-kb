<h1>柳氏<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>柳氏，李生姬也。天寶中，韓翃館於李，柳曰：“韓夫子豈長貧賤者。”李即以贈翃，翃爲淄青侯希逸所辟。柳留都下，遭亂，寄決靈寺爲尼。爲番將沙吒利所劫，虞候許俊以計取之，復歸於翃。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%9F%93%E7%BF%83.html" title="《答韓翃》">韓翃<small>×1</small></a></div>
