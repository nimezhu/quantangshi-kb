<h1>朱子真<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>朱子真，明皇時人，居南山下，別墅甚盛。出遊，嘗以繡衣女子數人自隨。長安少年趙潁造之求飲，令侍女及木鳳歌舞侑酒，子真自歌，仍取一丸丹賜潁。鑾輿幸蜀，忽失子真家，潁服丹，得二百餘歲。</p></details>
