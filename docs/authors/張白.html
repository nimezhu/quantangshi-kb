<h1>張白<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張白，衡州人。少應舉不第，入道，常挑一鐵葫蘆，得錢便飲酒，自稱白雲子。忽一日死，葬武陵城西。經半載，有鼎州官揚州勾當公事，遇於酒肆，同酌數日。衆聞之，開驗其棺，一空，有《武陵春色》詩三百首，今存其一。</p></details>
