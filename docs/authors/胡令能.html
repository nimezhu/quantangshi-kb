<h1>胡令能<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>胡令能，莆田隱者。少爲負局鎪釘之業，夢人剖其腹，以一卷書內之，遂能吟詠，遠近號爲胡釘鉸。詩四首。</p></details>
