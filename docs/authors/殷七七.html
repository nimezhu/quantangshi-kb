<h1>殷七七<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>殷七七，名天祥，又名道筌，嘗自稱七七，不知何所人。遊行天下，不測其年壽，面光白，若四十許人，每日醉歌道上。周寶鎮浙西，師敬之，嘗試其術，於九月令開鶴林寺杜鵑花，有驗。</p></details>
