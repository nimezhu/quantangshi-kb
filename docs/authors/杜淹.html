<h1>杜淹<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>杜淹，字執禮，隋時隱太山。文帝惡之，謫戍江表，秦王引爲天策府曹參軍，文學館學士，侍宴，賦詩尤工，賜金鍾，坐事流嶲州。太宗召拜御史大夫，檢校吏部尚書，參預朝政。詩三首。</p></details>
