<h1>鮑家四弦<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>四弦，鮑生妾也。鮑多蓄聲伎，外弟韋生，好乘駿馬，遇於歷陽。鮑置酒，酒酣，密遣四弦歌以送酒，韋牽紫叱撥酬之。詩二首。</p></details>
