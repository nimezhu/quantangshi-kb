<h1>賈曾<span class="vol-count">6 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>賈曾，河南洛陽人，以孝聞。景雲中吏部員外郎，明皇在東宮，盛擇宮僚，以曾爲太子舍人，直言啓諫，特授中書舍人。以父名忠，固辭，拜諫議大夫。開元中，復拜中書，議者以爲曹司嫌名，乃就職。與蘇晉同掌制誥，時號蘇賈。詩五首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%AE%8B%E4%B9%8B%E5%95%8F.html" title="《和宋之問下山歌》">宋之問<small>×1</small></a></div>
