<h1>苗晉卿<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>苗晉卿，字元輔，潞州壺關人。擢進士第，累遷吏部郎中，知選事，久之，進侍郎。天寶二載，較書判，以御史中丞張倚之子奭爲第一，議者不平。帝御花萼樓覆實，奭持紙終日，筆不下，人謂之曳白。坐貶安康太守，俄充河北採訪使。肅宗召赴行在，拜左相。廣德中，以太保致仕。永泰初卒，諡懿獻。詩一首。</p></details>
