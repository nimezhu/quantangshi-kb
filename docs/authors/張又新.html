<h1>張又新<span class="vol-count">17 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張又新，字孔昭，工部侍郎薦之子。元和中擢第，歷左右補闕，坐李逢吉黨，貶江州刺史，後附李訓，遷刑部郎中。訓死，復貶申州刺史。詩十七首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E8%B3%80.html" title="《出城別張又新酬李漢》">李賀<small>×1</small></a><a class="chip" href="../authors/%E8%B6%99%E5%98%8F.html" title="《送張又新除溫州》">趙嘏<small>×1</small></a></div>
