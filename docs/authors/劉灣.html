<h1>劉灣<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉灣，字靈源，西蜀人，天寶進士。祿山之亂，以侍御史居衡陽，與元結相友善。詩六首。</p></details>
