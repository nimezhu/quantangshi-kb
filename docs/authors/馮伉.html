<h1>馮伉<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>馮伉，魏州元城人。大曆初，舉五經，又舉宏詞，三遷膳部員外郎。使澤潞，不受幣，德宗以其清可用，授醴泉令，爲著諭蒙書以勸俗。韋渠牟薦爲給事中，再領國子祭酒。卒，贈禮部尚書。詩三首。</p></details>
