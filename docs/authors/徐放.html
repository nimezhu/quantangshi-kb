<h1>徐放<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>徐放，字達夫，武元衡西川從事。元和九年，爲衢州刺史，見韓愈徐偃王廟碑。詩一首。</p></details>
