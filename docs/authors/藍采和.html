<h1>藍采和<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>藍采和，不知何時人。常衣破藍衫，六銙黑木腰帶，一脚著鞾，一脚跣行。夏則衫內加絮，冬則臥於雪中，氣出如蒸。每行歌城市乞索，持大拍板踏歌，似狂非狂，歌詞極多，率皆仙意。以錢與之，或散失，亦不顧，見貧人，即與之。及與酒家，後踏歌於濠梁間酒樓，乘醉輕舉，雲中擲鞾衫腰帶拍板，冉冉而去。</p></details>
