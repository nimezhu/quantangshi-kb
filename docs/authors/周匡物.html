<h1>周匡物<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>周匡物，字幾本，漳州人。元和十一年進士及第，仕至高州刺史。詩五首。 周匡物字幾本，龍溪人。元和十一年進士及第，御試《學殖賦》、《鶯出谷詩》，爲世傳誦。讀書天城山，敕改其山爲名第山，因號各部委已經先生。仕至高州刺史。補詩一首。</p></details>
