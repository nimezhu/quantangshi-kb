<h1>王之渙<span class="vol-count">688–742 · 6 首 · 见于 2 卷 · 三百首入选 3</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王之渙，幷州人，兄之咸、之賁皆有文名。天寶間，與王昌齡、崔國輔、鄭昈聯唱迭和，名動一時。詩六首。</p></details>
