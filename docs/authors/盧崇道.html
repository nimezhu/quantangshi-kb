<h1>盧崇道<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧崇道，睿宗朝爲太常卿，坐壻崔湜，流嶺南。後私還都下，事敗，敕杖至殞。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《新都南亭送郭元振盧崇道》">張說<small>×1</small></a></div>
