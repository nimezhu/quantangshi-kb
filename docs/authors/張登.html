<h1>張登<span class="vol-count">8 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張登，南陽人。江南士[掾]椽滿歲，計相表爲殿中侍御史，董賦江南，俄拜漳州刺史。集六卷，今存詩七首。</p></details>
