<h1>李渤<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李渤，字濬之，洛陽人。少隱嵩山，元和中，徵爲著作郎。敬宗時，由考功郎中拜給事中，伉直敢言，出爲桂管觀察使。詩五首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E7%B1%8D.html" title="《寄李渤》">張籍<small>×1</small></a></div>
