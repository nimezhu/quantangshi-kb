<h1>李康成<span class="vol-count">6 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李康成，天寶中，與李、杜同時。其赴使江東，劉長卿有詩送之。嘗撰《玉臺後集》，自陳後主、隋煬帝、江總、庾信、沈、宋、王、楊、盧、駱而下二百九人，詩六百七十首，彙爲十卷，自載其詩八篇，今存四首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%8A%89%E9%95%B7%E5%8D%BF.html" title="《嚴陵釣台，送李康成赴江東使》">劉長卿<small>×1</small></a></div>
