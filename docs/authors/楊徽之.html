<h1>楊徽之<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊徽之，楚馬殷時人。詩一首。 楊徽之字仲猷，浦城人。南唐時間道至汴中，周顯德二年進士。入宋，除著作佐郎，知全州。太平興國初，轉庫部員外郎、判南曹。卒真宗提。補詩一首幷句。</p></details>
