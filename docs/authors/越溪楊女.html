<h1>越溪楊女<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊女，越溪人，爲詩不過兩句。有謝生求婚，其父出女句，令續之。女覽而歎曰：“天生吾夫也。”後七年，忽題二句示謝，謝訝其不祥，女曰：“君且續之。”謝應聲就，女即以首枕其膝而逝。</p></details>
