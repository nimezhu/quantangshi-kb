<h1>竇威<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>竇威，字文蔚，扶風平陵人，太穆皇后從父兄也。初爲高祖丞相府司錄參軍，博物多識，朝章國典，皆其所定，終內史令。集十卷，今存詩一首。</p></details>
