<h1>崔安潛<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔安潛，字進之，齊州人。大中三年進士登第，咸通中，累擢忠武節度使，拒王仙芝有功，代高駢鎮西川，終太子太傅，謚貞孝。詩一首。</p></details>
