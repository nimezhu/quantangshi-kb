<h1>於頔<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>于頔，字允元，河南人。以蔭補千牛，擢累駕部郎中、湖、蘇二州刺史，襄州節度觀察使。元和初，拜司空，尋貶恩王傅，終太子賓客。詩二首。</p></details>
