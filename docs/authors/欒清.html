<h1>欒清<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>欒清，字渾之。貞元時，與徐戡俱好道術。遊江南，舟遇二客，問其姓名，客笑持二蓮葉遺之。上各有詩，一葉題曰攄浩然，一葉題曰汎虛舟。有頃，遺渾之酒一巵，甚馨香，飲訖別去，失所在。渾之大醉，吐出數斗物，戡視之，皆五臟，爛黑在地。渾之歡然起，撫掌而歌，遂仙去，戡亦不知所之。</p></details>
