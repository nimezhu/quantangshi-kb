<h1>姜皎<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>姜皎，晞從兄弟。長安中，爲尚衣奉御，明皇以藩邸有舊，拜殿中監，封楚國公，恩寵莫比，遷太常卿，後坐貶死。詩一首。</p></details>
