<h1>封敖<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>封敖，字碩夫，蓚人。元和中登第，會昌初，以左司員外郎召爲翰林學士、知制誥，遷御史中丞。大中中，歷平盧、興元節度使，終尚書右僕射。翰藁八卷，今存詩二首。</p></details>
