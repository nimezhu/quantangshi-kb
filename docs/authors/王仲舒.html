<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王仲舒，字弘中，幷州祁人。少客江南，與梁肅、楊憑游，並有文名。元和初，爲職方郎中、知制誥。穆宗初，爲中書舍人，終江南西道觀察使。詩一首。</p></details>
