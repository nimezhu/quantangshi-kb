<h1>李節度姬<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李節度有寵姬，元夕，以紅綃帕裹詩擲於路，約得之者，來年此夕會於相藍後門。宦子張生得之，如期而往，姬與生偕逃於吳。詩三首。</p></details>
