<h1>豐幹<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>豐干禪師，居天台山國清寺，晝則舂米供僧，夜則扃房吟詠。一日騎虎松徑來，入國清寺巡廊唱道，衆皆驚怖。嘗於京輦爲閭丘太守救疾，閭丘之任台州，便至國清問豐干禪院所在。云在經藏後，無人住得，每有一虎，時來此吼。閭丘至師院，開房惟見虎迹。今存房中壁上詩二首。</p></details>
