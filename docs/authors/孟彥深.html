<h1>孟彥深<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>孟彥深，字士源，登天寶二年進士第，爲武昌令。元結居樊上，[嘗]常作《退谷銘》曰：“干進之客，不得遊之。”又作《杯湖銘》曰：“爲人厭者，勿汎杯湖。”孟士源嘗黜官，無情干進。在武昌，不爲人厭，可遊退谷，可汎杯湖矣。詩一首。</p></details>
