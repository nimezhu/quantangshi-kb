<h1>陶峴<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陶峴，潛之裔孫。開元中，家於崑山，與孟彥深、孟雲卿、焦遂遊。嘗製三舟，一舟自載，一舟供賓客，一舟置飲饌。有女樂一部，奏清商之曲，逢山泉則窮其景物。吳越之士，謂之水仙。詩一首。</p></details>
