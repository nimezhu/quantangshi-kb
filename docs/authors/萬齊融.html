<h1>萬齊融<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>萬齊融，越州人，官崑山令。詩四首。按《舊唐書·文苑傳》云：“神龍中，賀知章與賀朝萬、齊融、張若虛、邢巨、包融，俱以吳越之士，文辭俊秀，名揚於上京，人間往往傳其文。朝萬止山陰尉，齊融崑山令，蓋以萬字屬上文，作賀朝萬。及考唐人所選《國秀》、《搜玉》二集，俱作萬齊融、賀朝，今仍之。”</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E9%A0%8E.html" title="《寄萬齊融》">李頎<small>×1</small></a></div>
