<h1>張志和<span class="vol-count">7 首 · 见于 3 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張志和，字子同，婺州金華人。年十六，舉明經。肅宗時待詔翰林，後不復仕進，居江湖，自稱煙波釣叟。詩九首。 張志和，字子同，婺州金華人，年十六，舉明經，肅宗時待詔翰林，後不復仕進，居江湖，自稱煙波釣叟。詩九首。</p></details>
