<h1>祝欽明<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>祝欽明，字文思，京兆始平人，舉明經。長安元年，累遷太子率更令，兼崇文館學士。中宗在春宮，欽明充侍讀。及即位，擢拜國子祭酒，同中書門下三品，歷刑部、禮部二尚書。嘗與羣臣侍宴，欽明自言能八風舞，據地搖頭，睆目顧盼。吏部侍郎盧藏用歎曰：“祝公是舉，五經掃地矣。”景雲初，爲侍御史倪若水所劾，貶饒州刺史。詩一首。</p></details>
