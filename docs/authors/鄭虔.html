<h1>鄭虔<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鄭虔，滎陽人。天寶初，爲協律郎，坐事謫官。明皇愛其才，特置廣文館，授爲博士，遷著作郎。以陷安祿山，貶台州司戶參軍。最善杜甫，又與祕書監鄭審篇翰齊價。虔工畫山水，好書，常苦無紙，乃於慈恩寺貯柿葉數屋，日往取葉肄書，歲久殆盡。嘗自寫其詩幷畫以獻，帝親署其尾曰鄭虔三絕。今存詩一首。</p></details>
