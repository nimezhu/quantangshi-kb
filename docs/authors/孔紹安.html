<h1>孔紹安<span class="vol-count">7 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>孔紹安，越州山陰人。陳尚書奐之子。少誦古文集數十萬言，外兄虞世南歎異之，與詞人孫萬壽篤忘年好，時人稱爲孫孔。隋末，爲監察御史。歸唐，拜內史舍人，恩禮甚厚。嘗詔撰《梁史》，未成而卒。有文集五十卷，今存詩七首。</p></details>
