<h1>陳元光<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陳元光，字廷炬，光州人。高宗朝，以左郎將戍閩，進嶺南行軍總管，奏開漳州爲郡，世守刺史。詩三首。 陳元光字廷炬，光州人。補詩二首幷句。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E8%A8%B1%E5%A4%A9%E6%AD%A3.html" title="《和陳元光平潮寇詩》">許天正<small>×1</small></a></div>
