<h1>慧淨<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>慧淨，俗姓房氏，真定人。開皇大業中，即擅道譽。貞觀初，主紀國寺，房玄齡結爲法友，高宗在東宮，復請爲普光寺主。詩四首。</p></details>
