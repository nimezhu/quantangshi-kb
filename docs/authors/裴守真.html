<h1>裴守真<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>裴守真，絳州人。高宗時，爲太常博士。天授中，官司憲府丞令，推究詔獄，多平恕。不稱旨，出刺成州，徙寧州卒。詩三首。</p></details>
