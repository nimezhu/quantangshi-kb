<h1>元載<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>元載，字公輔，岐山人。嗜學好屬文，以明莊、老、文、列四子之學，策入高科。初授新平尉，歷度支郎中。肅宗嘉其奏對，委以國計，充使江淮，都嶺漕輓。俄遷戶部侍郎度支使，幷諸道轉運使。以附李輔國，遷中書侍郎同平章事。排去忠良，引用貪猥。大曆中，以賄敗，伏誅。集十卷，今存詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%A5%8A%E7%82%8E.html" title="《贈元載歌妓》">楊炎<small>×1</small></a><a class="chip" href="../authors/%E7%8E%8B%E9%9F%9E%E7%A7%80.html" title="《別妻王韞秀》">王韞秀<small>×1</small></a></div>
