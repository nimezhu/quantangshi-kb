<h1>趙光逢<span class="vol-count">4 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>趙光逢，京兆奉天人。乾符五年，登進士第，釋褐鳳翔推官，入爲監察御史。乾寧三年，從駕幸華州，拜御史中丞，改禮部侍郎。後仕梁，至宰輔，封齊國公。詩八首。</p></details>
