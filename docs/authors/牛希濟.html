<h1>牛希濟<span class="vol-count">6 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>牛希濟，隴西人，仕蜀，爲起居郎，累官翰林學士、御史中丞。後入唐，爲雍州節度副使。詩一首。 牛希濟，隴西人，仕蜀，爲起居郎，累官翰林學士、御史中丞。後入唐，爲雍州節度副使。詩一首。</p></details>
