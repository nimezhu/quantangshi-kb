<h1>孫氏<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>孫氏，樂昌一作安人，進士孟昌期妻也，善詩，每代夫作。一日忽曰：“才思非婦人事。”遂焚其事。詩三首。</p></details>
