<h1>韋夏卿<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋夏卿，字雲客，京兆萬年人。大曆中，與弟正卿同舉賢良方正高等，授高陵主簿，累遷刑部員外郎，擢給事中，出爲常、蘇二州刺史。徐州節度使張建封辟爲徐泗行軍司馬，俄召爲吏部侍郎，進檢校工部尚書、東都留守，改太子少保。詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%B3%88.html" title="《別張賈》">張賈<small>×1</small></a><a class="chip" href="../authors/%E9%A1%A7%E6%B3%81.html" title="《送顧況歸茅山》">顧況<small>×1</small></a></div>
