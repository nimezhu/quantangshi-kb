<h1>趙氏2<span class="vol-count">6 首 · 见于 2 卷</span></h1>
<div class="poem-author">又作：趙氏1、趙氏3</div><details class="biography"><summary>小传（全唐诗数据库）</summary><p>趙氏，寇坦母也。詩三首。 趙氏，洹水人，杜羔妻也。詩四首。 趙氏，南海人。房千里初第，遊嶺徼。舉子韋滂自南海攜趙來，擬爲房妾，房倦於遊，未得遽與趙偕。及後遣人訪之，趙已從韋矣。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%9C%E7%BE%94.html" title="《雜言寄杜羔》">杜羔<small>×1</small></a></div>
