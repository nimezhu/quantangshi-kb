<h1>褚遂良<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>褚遂良，字登善，亮之子。博涉文史，尤工隸書。貞觀中起居郎，召令侍書，遷諫議大夫。累官黃門侍郎，參綜朝政，諫奏多所採納，晉中書令。永徽初，出爲同州刺史，徵拜吏部尚書，進尚書右僕射，以諫立武昭儀貶，卒。集二十卷，今存詩一首。 褚遂良字登善，亮之子。以諫立武昭儀而貶，顯廣四年卒，年六十三。補詩四首。</p></details>
