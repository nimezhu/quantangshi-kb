<h1>蔡京<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蔡京，初爲僧。令狐楚鎮滑臺，勸之學，後以進士舉上第，官御史，謫澧州刺史，遷撫州。詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%8A%89%E5%BE%97%E4%BB%81.html" title="《送蔡京東歸迎侍》">劉得仁<small>×2</small></a><a class="chip" href="../authors/%E5%8A%89%E7%A6%B9%E9%8C%AB.html" title="《送前進士蔡京赴學究科》">劉禹錫<small>×1</small></a><a class="chip" href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html" title="《天平公座中呈令狐令公時蔡京在坐京曾為僧徒故有第五句》">李商隱<small>×1</small></a><a class="chip" href="../authors/%E8%B3%88%E5%B3%B6.html" title="《送蔡京》">賈島<small>×1</small></a></div>
