<h1>裴休<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>裴休，字公美，濟源人。登進士第，舉賢良方正異等，擢累監察御史、兵部侍郎。大中中，拜同中書門下平章事。詩二首。 裴休字公美，濟源執行。補詩一首。  清教，咸通以前僧人。詩二句。（《全唐詩》無清教詩）</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><span class="chip">希運<small>×1</small></span></div>
