<h1>許宣平<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>許宣平，新安歙人。景雲中，隱城陽山南塢，結庵以居，時或負薪賣，擔挂一花瓠及曲竹杖，每醉，拄之以歸。嘗於同華間題詩傳舍，李白東遊，覽之，曰：“此仙詩也。”及新安，累訪之不得。後咸通七年，郡人許明奴家有嫗入山採樵，見一人坐石上，食桃甚大，自稱明奴之祖，即宣平也。與一桃食嫗，嫗後却食輕健，入山不歸。</p></details>
