<h1>吳士矩<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>士矩，字方之，濮陽鄄城人。溆子。文學早就，喜與豪英遊。歷任京兆司錄、主客員外郎、郎中。大和七年爲江西觀察使，開成元年入朝爲秘書監，次年因贓貶蔡州別駕，改流端州。（《全唐詩》卷八八七收士矩詩一首，無傳，今據《元和姓纂》卷三、《新唐書》卷一五九、《郎官石柱題名考》卷二五、卷二六、《〈白氏長慶集〉人名箋證擬傳》）</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%85%83%E7%A8%B9.html" title="《寄吳士矩端公五十韻》">元稹<small>×2</small></a></div>
