<h1>伊用昌<span class="vol-count">8 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>伊用昌，不知何許人。與其妻乞食，多在江右廬陵、宜春諸郡。出語輕忽，常爲人毆擊，呼之爲伊風子。愛作望《江南詞》，與妻唱和，詞皆有旨。妻有殊色，豪富子弟以言笑戲調，不可犯。夫妻至南城縣，丐死牛肉食之死，後人有見之者，夫妻皆躡虛而行，發視所埋處，惟有爛牛肉，無別物。</p></details>
