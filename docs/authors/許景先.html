<h1>許景先<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>許景先，義興人。舉進士，授夏陽尉。神龍初，拜左拾遺，擢中書舍人。與齊澣、王丘、韓休、張九齡更知制誥，俱以文翰見稱。開元中，帝自擇刺史，景先首中其選。自吏部侍郎出爲虢州刺史，卒侍中。詩五首。</p></details>
