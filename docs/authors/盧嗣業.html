<h1>盧嗣業<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧嗣業，范陽人，綸之孫也。乾符五年，登進士第。廣明初，以長安尉直昭文館，累遷右補闕，後辟都統判官，檢校禮部郎中。詩一首。</p></details>
