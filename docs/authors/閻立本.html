<h1>閻立本<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>閻立本，雍州萬年人。太宗時爲主爵郎。顯慶中，累官將作大匠，代兄立德爲工部尚書。總章初，遷右相，後改中書令，立本有應務才，尤善圖畫，工於寫真。秦府十八學士圖及貞觀中凌煙閣功臣圖，並其跡也。詩一首。</p></details>
