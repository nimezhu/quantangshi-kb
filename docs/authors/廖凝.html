<h1>廖凝<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>廖凝，字熙績，圖之弟。初歸湖南，隱衡岳，後與馬希[萼]咢同遷金陵，授水部員外郎，出爲建昌令，終江州團練副使。善吟諷，與李建勳爲詩友，相善。江左學詩者，多造其門。集七卷，今存詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%9F%8B%E9%BC%8E.html" title="《贈廖凝》">韋鼎<small>×1</small></a></div>
