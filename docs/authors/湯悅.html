<h1>湯悅<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>湯悅，陳州西華人，本姓殷，文圭之子。仕南唐，官學士，歷樞密使、右僕射。元宗時，淮上用兵，書檄教誥皆出其手。詩五首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E5%BB%BA%E5%8B%B3.html" title="《答湯悅》">李建勳<small>×1</small></a></div>
