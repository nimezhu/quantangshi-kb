<h1>陳希烈<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陳希烈，宋州人，長於名理。開元中，於禁中講老、易，累遷至祕書少監，代張九齡專判集賢院事，明皇凡有撰述，必經其手。李林甫知上睠待，乃引爲宰相，寵遇侔於林甫。後爲楊國忠所嫉，罷知政事。祿山之亂，受僞命爲中書令。論陷賊罪當死，肅宗以舊恩特原之，長流合浦郡。詩三首。</p></details>
