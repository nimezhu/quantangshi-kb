<h1>杜元穎<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>杜元穎，杜陵人，如晦五世孫。貞元十六年登第，又擢宏詞，累官司勳員外。穆宗時，拜中書舍人，不閱歲，至宰相。再朞，出爲劒南西川節度使。太和中，貶循州司馬。有五題詩一卷，今存一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%85%83%E7%A8%B9.html" title="《送杜元穎》">元稹<small>×1</small></a></div>
