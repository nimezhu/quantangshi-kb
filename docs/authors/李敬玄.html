<h1>李敬玄<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李敬玄，亳州譙人，博覽羣書，特善五禮。貞觀末，高宗在東宮，以馬周薦，召入崇賢館侍讀。歷西臺侍郎，檢校司列常伯，典銓有序，選者歲萬餘人，每於街衢見之，無不知其姓名，時人服其强記。儀鳳中，爲中書令，劉仁軌奏鎮河西，敬玄自知非邊將才，上强遣之，敗於湟州，坐貶。集三十卷，今存詩二首。</p></details>
