<h1>張建封<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張建封，字本立，南陽人。少喜文章，尚氣節，歷官御史大夫、徐泗濠節度使。有詩文二百三十篇，今存詩二首。 張建封字本立，鄧州南陽人。少任俠，喜文章。貞元四年拜御史大夫、徐泗濠節度使，十六年病卒，年六十六。補句二。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E9%81%A9.html" title="《送徐州張建封還鎮》">李適<small>×1</small></a><a class="chip" href="../authors/%E7%A7%A6%E7%B3%BB.html" title="《山中書懷寄張建封大夫》">秦系<small>×1</small></a></div>
