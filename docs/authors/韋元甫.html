<h1>韋元甫<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋元甫，初任白馬尉，採訪使韋陟深器之，奏充支使，累遷蘇州刺史、浙江西道團練觀度等使。大曆初，徵拜尚書右丞，出爲淮南節度使。詩一首。</p></details>
