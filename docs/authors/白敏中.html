<h1>白敏中<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>白敏中，字用晦，長慶中第進士，擢累侍御史、左司員外郎。武宗召入翰林，爲學士。宣宗立，以兵部侍郎同中書門下平章事。尋出爲邠寧節度使，懿宗復召拜司徒、門下侍郎、還平章事。咸通二年，出爲鳳翔節度使，以太傅致仕。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%A6%AC%E6%A4%8D.html" title="《奉和白敏中聖道和平致茲休運歲終功就合詠盛明呈上》">馬植<small>×1</small></a><a class="chip" href="../authors/%E9%AD%8F%E6%89%B6.html" title="《和白敏中聖德和平致茲休運歲終功就合詠盛明呈上》">魏扶<small>×1</small></a></div>
