<h1>鄭餘慶<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鄭餘慶，字居業。大曆中舉進士第，初爲嚴震山南從事。貞元初，歷庫部郎中，爲翰林學士，以工部侍郎知吏部選，後拜中書侍郎同平章事。憲宗時，爲尚書左僕射，詳定典制，引韓愈、李程爲副，崔郾、陳珮、楊嗣復、庾敬休爲判官，損益儀規，號爲詳衷。終太子太師、檢校司徒。集五十卷，今存詩二首。</p></details>
