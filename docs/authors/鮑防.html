<h1>鮑防<span class="vol-count">8 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鮑防，字子慎，襄陽人。天寶末進士第，歷福建江西觀察使。貞元中，累禮部侍郎，遷工部尚書致仕。防善屬文，尤工詩，與中書舍人謝良弼友善，時號鮑謝。詩八首。</p></details>
