<h1>袁恕己<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>袁恕己，滄州東光人。長安中，歷司刑少卿，預誅二張。又從相王統南衙兵，備非常，以功爲中書侍郎，進中書令，封南陽郡王。後貶死環州。詩一首。</p></details>
