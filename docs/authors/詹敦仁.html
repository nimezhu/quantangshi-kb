<h1>詹敦仁<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>詹敦仁，字君澤，固始人。初隱仙遊，後爲清溪令。詩六首。 詹敦仁字君澤，固始人。補詩四首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%8A%89%E4%B9%99.html" title="《遣子訪劉乙》">劉乙<small>×1</small></a></div>
