<h1>金地藏<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>金地藏，新羅國王子。至德初，航海居九華山。詩一首。 金地藏，新羅國僧。至德間渡海，居青陽九華山。嘗以巖間白土雜飯食之，人以爲異。年九十九，忽召徒衆告別，但聞山鳴石隕，俄頃趺坐於函中。洎三稔，開將入塔，顏貌如生，舁之而動，骨節若撼金鎖焉。（《全唐詩》八○八作新羅國王子）</p></details>
