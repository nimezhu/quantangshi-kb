<h1>李義府<span class="vol-count">9 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李義府，瀛州饒陽人。對策擢第，補門下省典儀，尋除監察御史、太子舍人，與司議郎來濟俱以文翰見知，時稱“來李”。嘗獻《承華箴》，預撰《晉書》。高宗嗣位，遷中書舍人，以贊立武昭儀，擢中書侍郎，晉中書令，怙寵稔惡，長流巂州。存詩八首。</p></details>
