<h1>李治<span class="vol-count">628–683 · 8 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>帝諱治，文皇第九子，始封晉王。貞觀十七年，立爲皇太子。在位三十四年，諡曰天皇大帝。集八十六卷，今失傳。存詩八首。</p></details>
