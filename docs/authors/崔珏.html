<h1>崔玨<span class="vol-count">11 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔珏，字夢之，嘗寄家荆州。登大中進士第，由幕府拜祕書郎，爲淇縣令，有惠政，官至侍御。詩一卷。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html" title="《哭李商隱》">李商隱<small>×2</small></a></div>
