<h1>張道古<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張道古，一名睍，字子美，臨淄人。景福中，擢進士第，官右拾遺，以直諫謫施州司戶。後入蜀，王建召爲武司郎中，尋復貶死。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%84%AD%E9%81%A8.html" title="《哭張道古》">鄭遨<small>×1</small></a></div>
