<h1>關盼盼<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>關盼盼，徐州妓也。張建封納之，張歿，獨居彭城故燕子樓，歷十餘年。白居易贈詩諷其死，盼盼得詩，泣曰：“妾非不能死，恐我公有從死之妾，玷清範耳。”乃和白詩，旬日不食而卒。詩四首。</p></details>
