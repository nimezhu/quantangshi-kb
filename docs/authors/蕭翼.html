<h1>蕭翼<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蕭翼，本名世翼。太宗時，命爲監察御史，充使取羲之《蘭亭序》真蹟於越僧辨才。翼初作北人南遊，一見欵密留宿，設酒酣樂，探韻賦詩，既而以術取其書以歸。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E8%BE%A8%E6%89%8D.html" title="《答辨才探得招字》">辨才<small>×1</small></a></div>
