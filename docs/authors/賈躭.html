<h1>賈躭<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>賈躭，字敦詩，滄州南皮人。天寶中，舉明經，授臨清縣尉。上疏論時政，改正平尉，從事河東檢校膳部員外郎。歷邠州刺史，政績茂異，入爲鴻臚卿。自大曆至貞元，三爲節鎮，徴拜右僕射，同中書門下平章事。在相位十三年，世稱其淳德。躭好地理學，外國使至，必訊其山川土俗，因譔《海內華夷圖》及《古今郡國縣道四夷述》四十卷，表獻之。詩一首。</p></details>
