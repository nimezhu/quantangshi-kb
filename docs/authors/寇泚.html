<details class="biography"><summary>小传（全唐诗数据库）</summary><p>寇泚，中宗朝爲長安尉，張仁愿在朔方，奏用分判軍事。開元十三年，帝自擇刺史，泚由兵部侍郎出守宋州，賦詩祖餞。詩一首。</p></details>
