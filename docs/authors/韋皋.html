<h1>韋皋<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋臯，字城武一作武臣，京兆人。始仕爲建陵挽郎，張鎰節度鳳翔，署營田判官。德宗狩奉天，授隴州刺史，置奉義軍，拜節度使。帝自梁洋還，召爲左金吾衛將軍，遷大將軍。貞元元年，出爲劒南西川節度使，在蜀二十餘年，封南康郡王。詩三首。</p></details>
