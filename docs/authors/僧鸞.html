<h1>僧鸞<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>僧鸞，少有逸才，不事拘檢，謁薛能尚書，以其顛率，令之出家。後入京，爲文章供奉，賜紫。或云：即鮮于鳳。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E5%96%AC.html" title="《送僧鸞歸蜀甯親》">張喬<small>×1</small></a></div>
