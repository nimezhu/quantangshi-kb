<h1>盧鈞<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧鈞，字子和，舉進士中第，嘗爲李絳、裴度幕僚，歷嶺南、山南、昭義、宣武節度。大中時，召爲左僕射，後以太保致仕，卒年八十七。詩一首。</p></details>
