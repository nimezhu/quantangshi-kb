<h1>令狐德棻<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>令狐德棻，宜州華原人。博涉文史，早知名。高祖入關，引直記室，轉起居舍人，遷祕書丞，與侍中陳叔達等奉詔撰《藝文類聚》。奏請修歷代史書，德棻修《周史》，仍總知類會梁、陳、齊、隋諸史。貞觀中，累官禮部侍郎國子祭酒，兼崇賢館學士，國家凡有修撰，無不參預。集三十卷，今存詩一首。</p></details>
