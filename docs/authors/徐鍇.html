<h1>徐鍇<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>徐鍇，字楚金，廣陵人，鉉之弟。南唐時，爲屯田郎中、知制誥、集賢殿學士。集十五卷，今存詩五首。</p></details>
