<h1>陳京<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陳京，字慶復，陳宣都王叔明五世孫。擢進士第，累遷太常博士，擢右補闕。與趙需、張薦共劾盧杞，終秘書少監。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%AD%A6%E5%85%83%E8%A1%A1.html" title="《長安秋夜懷陳京昆季》">武元衡<small>×1</small></a></div>
