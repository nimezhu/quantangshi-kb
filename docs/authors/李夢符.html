<h1>李夢符<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李夢符，開平初人。在洪州日，與布衣飲酒狂吟。嘗以釣竿懸一魚，向市肆唱《漁父引》，賣其詞。好事者爭買之，得錢便入酒家，或抱冰入水，及出，身上氣如蒸，後不知所在一云：夢符遊南昌時，鍾傳據其地。有桂州刺史李瓊，遣人謂傳曰：“夢符吾弟，請遣歸。”鍾令求於市邸，人曰：“夜來不歸，不知所之。”。</p></details>
