<h1>韓思複<span class="vol-count">2 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韓思復，字紹出，京兆長安人。舉秀才高第，調梁府倉曹參軍，累遷中書舍人。開元初，擢諫議大夫，出爲德州刺史，拜黃門侍郎，遷御史大夫，復出刺襄州，還拜太子賓客，卒諡文。明皇親題其碑曰：“有唐忠孝韓長山之墓。”詩一首。</p></details>
