<h1>杜之松<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>杜之松，博陵曲阿人，隋起居舍人。貞觀中，爲河中刺史，嘗荅王績書云：“康成道重，不許太守稱官；老萊家居，羞與諸侯爲伍。僕豈不能正平公之坐，敬養亥唐，屈文侯之膝，恭師子夏，其雅尚可知矣。”詩一首。</p></details>
