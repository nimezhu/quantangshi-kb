<h1>范氏子<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography" open><summary>小传（御定全唐詩）</summary><p>《紀事》云，吳人攄子，七歲能詩。方干，見其《贈隠者》句，曰：「此子他日必成名。」又吟《夏日》句，干云：「必不享壽！」。果十歲卒。攄，即撰《雲溪友議》者</p></details>
