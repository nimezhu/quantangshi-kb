<h1>吳少微<span class="vol-count">8 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>吳少微，新安人，舉進士，累至晉陽尉，與富嘉謨同官。中興初，以韋嗣立薦，拜右臺御史，嘗爲幷州長史張仁亶撰進九鼎銘表。集十卷，今存詩六首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%AF%8C%E5%98%89%E8%AC%A8.html" title="《哭富嘉謨》">富嘉謨<small>×1</small></a></div>
