<h1>張旭<span class="vol-count">6 首 · 见于 1 卷 · 三百首入选 1</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張旭，蘇州吳人。嗜酒，善草書。每醉後號呼狂走，乃下筆，或以頭濡墨而書，既醒，自視以爲神，世呼爲張顛。初仕爲常熟尉，自言始見公主擔夫爭道，又聞鼓吹而得筆法意，觀公孫大娘舞劒器，乃盡其神。時以李白歌詩，旭草書，及裴旻劒舞爲三絕。詩六首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E9%A0%8E.html" title="《贈張旭》">李頎<small>×1</small></a><a class="chip" href="../authors/%E6%9D%9C%E7%94%AB.html" title="《殿中楊監見示張旭草書圖》">杜甫<small>×1</small></a></div>
