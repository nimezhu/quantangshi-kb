<h1>魏萬<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>魏萬，嘗居王屋山，後名顥，上元初登第。初遇李白於廣陵，白曰：“爾後必著大名於天下。”因盡出其文，命集之。其還王屋山也，白爲之序，稱其愛文好古。今存詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E9%A0%8E.html" title="《送魏萬之京》">李頎<small>×1</small></a><a class="chip" href="../authors/%E6%9D%8E%E7%99%BD.html" title="《送王屋山人魏萬還王屋》">李白<small>×1</small></a></div>
