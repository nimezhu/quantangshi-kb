<h1>庾抱<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>庾抱，潤州江寧人，有學術，隋元德太子學士。高祖初起，隱太子引爲隴西公府記室，文檄皆出其手，轉太子舍人。集十卷，今存詩五首。</p></details>
