<h1>費冠卿<span class="vol-count">10 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>費冠卿，字子軍，池州人，元和登第。母卒，歎曰：“干祿養親，得祿而親喪，何以祿爲？”遂隱池州九華山。長慶中，殿院李行修舉其孝節，召拜右拾遺，不赴。集一卷，今存詩十一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%86%8A%E5%AD%BA%E7%99%BB.html" title="《戲贈費冠卿》">熊孺登<small>×1</small></a><a class="chip" href="../authors/%E9%99%B8%E6%9A%A2.html" title="《成都送別費冠卿》">陸暢<small>×1</small></a><a class="chip" href="../authors/%E8%95%AD%E5%BB%BA.html" title="《答蕭建》">蕭建<small>×1</small></a><a class="chip" href="../authors/%E5%A7%9A%E5%90%88.html" title="《寄九華費冠卿》">姚合<small>×1</small></a></div>
