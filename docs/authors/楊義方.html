<h1>楊義方<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography" open><summary>小传（御定全唐詩）</summary><p>眉山人，王建時舉進士</p></details><details class="biography"><summary>小传（全唐诗数据库）</summary><p>義方，眉山人。王建時舉進士，爲秘書。執性強良，所爲狂簡。曾以筆硯見用於宋樞密光嗣。因題九頭鳥，宋疑楊見詠，遂奏譴沈黎。至咸康元年，後主失位，宋亦遭誅，乃九頭鳥之應也。《十國春秋》云：義方長于吟咏，自謂才過羅隱。</p></details>
