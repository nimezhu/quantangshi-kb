<h1>韋蟾<span class="vol-count">10 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋蟾，字隱珪，下杜人。大中登進士第，初爲徐商掌書記。咸通末，終尚書左丞。詩十首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E5%95%86%E9%9A%B1.html" title="《和孫朴韋蟾孔雀詠》">李商隱<small>×1</small></a></div>
