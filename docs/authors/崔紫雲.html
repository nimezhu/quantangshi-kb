<h1>崔紫雲<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔紫雲，尚書李愿妓也。愿在東都，時會朝士，杜牧以御史分司，輕騎徑往。引滿三爵，問曰：“聞有紫雲者孰是？愿指示之。”牧曰：“名不虛傳，宜以見惠。”復引滿高吟，旁若無人。愿遂以贈，紫雲臨行，獻詩而別。詩一首。</p></details>
