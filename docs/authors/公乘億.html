<h1>公乘億<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>公乘億，字壽仙，魏人。咸通末，登進士第，爲魏博節度使樂彥禎從事，加授侍郎。詩一卷，今存四首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%BE%85%E9%9A%B1.html" title="《寄易定公乘億侍郎》">羅隱<small>×1</small></a></div>
