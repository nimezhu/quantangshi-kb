<h1>宋齊丘<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>宋齊丘，字子嵩。世爲廬陵人，父誠，爲洪州副使，遂家焉。吳時，累官右僕射、平章事。李昪代吳，以齊丘爲丞相、同平章事，尋出爲鎮南軍節度。李璟嗣位，召爲中書令，顯德末，放歸，縊死。集六卷，今存詩三首。</p></details>
