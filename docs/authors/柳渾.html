<h1>柳渾<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>柳渾，字夷曠，一字惟深，本名載，襄州人。天寶初，擢進士第。大曆中，累官至尚書右丞。貞元三年，以兵部侍郎同中書門下平章事。集十卷，今存詩一首。</p></details>
