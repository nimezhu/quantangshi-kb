<h1>張鴻<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鴻，連州桂陽人。天祐二年進士。時唐祚式微，鴻知勢不可爲，遂隱居不仕。詩清純，著述甚富，有集十二卷，今不存。（《全唐詩》卷七七四收鴻詩一首，列爲世次爵里俱無考作者。今據《粤詩蒐逸》卷一引《連州志》本傳補其事跡）</p></details>
