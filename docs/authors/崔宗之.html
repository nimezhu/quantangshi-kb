<h1>崔宗之<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔宗之，名成輔，以字行，日用之子，襲封齊國公。歷左司郎中、侍御史。謫官金陵，與李白詩酒唱和。常月夜乘舟，自采石達金陵。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%AD%9F%E6%B5%A9%E7%84%B6.html" title="《峴山餞房管、崔宗之》">孟浩然<small>×1</small></a></div>
