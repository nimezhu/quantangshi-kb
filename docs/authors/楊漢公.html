<h1>楊漢公<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊漢公，字用乂，虞卿之弟。太和八年擢進士第，累官司封郎中，坐虞卿，出刺舒州，徙湖、亳、蘇三州，終桂林觀察使。詩二首。</p></details>
