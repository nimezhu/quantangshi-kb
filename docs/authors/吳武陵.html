<h1>吳武陵<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>吳武陵，信州人。元和初，擢進士第，竇易直判度支，表武陵主鹽北邊，入爲太學博士。太和中，出刺韶州，尋貶潘州司戶參軍。詩一卷，今存二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9F%B3%E5%AE%97%E5%85%83.html" title="《初秋夜坐贈吳武陵》">柳宗元<small>×2</small></a></div>
