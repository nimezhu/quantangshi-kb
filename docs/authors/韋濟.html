<h1>韋濟<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋濟，思謙之孫，嗣立之子，早以辭翰聞。開元初，調補鄄城令，對詔第一，擢醴泉令。爲政簡易，三遷庫部員外郎，歷戶部侍郎。天寶七載，再爲河南尹，遷尚書左丞。三代皆省轄，衣冠榮之。詩一首。</p></details>
