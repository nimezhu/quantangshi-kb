<h1>元寂<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>元寂，俗姓高，居昇元寺。保大中，授左街僧錄，內供奉，賜紫。坐飲酒狂歌落職，後醉死于石子岡。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%8E%8B%E5%8B%83.html" title="《九日懷封元寂》">王勃<small>×1</small></a></div>
