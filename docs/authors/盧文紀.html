<h1>盧文紀<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧文紀，字子持，舉進士，事梁爲集賢殿學士。唐明宗時，爲御史中丞，遷工部尚書，貶石州司馬。久之，爲太常卿。奉使於蜀，過鳳翔，廢帝時爲節度使，見文紀奇之。後入立，拜爲中書侍郎同中書門下平章事。周時，進司空。詩一首。</p></details>
