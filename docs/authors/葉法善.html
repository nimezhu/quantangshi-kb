<h1>葉法善<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>葉法善，字道元，一字太素。家於松陽，遍歷名山，得道術。高宗徵之，駐景龍觀。明皇朝，試法多靈驗。開元八年，年一百七歲，化去，留三詩於座側。</p></details>
