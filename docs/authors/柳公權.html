<h1>柳公權<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>柳公權，字誠懸，公綽之弟，精於書學。元和初，擢進士第。穆宗時，拜右拾遺、侍書學士，改弘文館學士。文宗復召侍書，尋以諫議爲學士、知制誥，轉工部侍郎。咸通初，改太子少師。詩五首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%99%BD%E5%B1%85%E6%98%93.html" title="《和柳公權登齊雲樓》">白居易<small>×1</small></a></div>
