<h1>陳複休<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>陳復休，號七子。貞元中，來舉褒城，多變化之術。嘗狂醉市中，褒帥怒而繫於獄，不食而死，尋即臭爛，而復見於家。中和間，大駕還京，復休亦至闕下。田晉公問京國幾年安寧，曰二十，果自問後二十日，再幸陳倉。後寄詩晉公，未詳其意，及駕至梁洋，邠帥朱玫立襄王監國，寒梅兩枝驗矣。</p></details>
