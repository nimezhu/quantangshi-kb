<h1>任希古<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>任希古，字敬臣，棣州人。五歲喪母，刻志從學。年十六，刺史崔樞欲舉秀才，自以學未廣，遯去。後舉孝廉，虞世南器之。永徽初，與郭正一、崔融等同爲薛元超所薦，終太子舍人。詩六首。</p></details>
