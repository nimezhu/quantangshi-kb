<h1>張柬之<span class="vol-count">6 首 · 见于 3 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張柬之，字孟將，襄陽人。涉獵經史，尤好三禮。舉進士，賢良對策第一，授監察御史。聖曆中，爲鳳閣舍人，弘文館學士。長安中，令舉宰相材，以姚崇薦，遷鳳閣侍郎，知政事。及誅二張兄弟，柬之首謀也。中宗即位，以功擢天官尚書，封漢陽王，遷中書令，爲武三思所搆，貶死。集十卷，今存詩五首。</p></details>
