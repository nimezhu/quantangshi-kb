<h1>馮道<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>馮道，字可道，景城人。初爲劉守光參軍，後歷唐、晉、漢、周，事四姓十君，並在政府，自號長樂老，卒謚文懿，追封瀛王。詩集十卷，今存五首。</p></details>
