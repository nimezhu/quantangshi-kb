<h1>袁朗<span class="vol-count">5 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>袁朗，雍州長安人，勤學，好屬文，在陳釋褐祕書郎，甚爲江總所重。嘗製千字詩，當時以爲盛作。後主召入禁中，使爲《月賦》，染翰立成，遷太子洗馬。仕隋，爲儀曹郎。入唐，授齊王文學，轉給事中。貞觀初卒，太宗稱其謹厚，悼惜之。集十四卷，今存詩四首。</p></details>
