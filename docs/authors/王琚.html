<h1>王琚<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王琚，懷州河內人。神龍初，爲駙馬王同皎所器，預謀刺武三思。後太平公主謀逆，琚勸明皇先事誅之，薦張說、劉幽求、郭元振等與決議。事平，進戶部尚書，眷委特異，參豫大政，時號內宰相。後以讒見疏，歷典外郡。卒爲李林甫所搆，貶死。詩四首。</p></details>
