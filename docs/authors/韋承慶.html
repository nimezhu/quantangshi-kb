<h1>韋承慶<span class="vol-count">8 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋承慶，字延休，鄭州陽武人，事繼母以孝聞。舉進士，官太子司議，屢有諫納。長壽中，累遷鳳閣侍郎，三掌天官選事，銓授平允，尋知政事。神龍初，坐附張易之，流嶺表，起爲秘書少監，授黃門侍郎，未拜卒。集六十卷，今存詩七首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%9C%E5%AF%A9%E8%A8%80.html" title="《和韋承慶過義陽公主山池五首》">杜審言<small>×1</small></a></div>
