<h1>蕭德言<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蕭德言，字文行，雍州長安人。貞觀中著作郎，兼弘文館學士，博涉經史，晚尤篤志於學，自晝達夜，略無休倦。每開五經，必束帶盥濯，危坐對之，爲春宮侍讀，拜祕書少監。高宗以師傅恩，加銀青光祿大夫。集三十卷，今存詩一首。</p></details>
