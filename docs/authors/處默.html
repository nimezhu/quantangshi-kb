<h1>處默<span class="vol-count">9 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>處默，初與貫休同薙染，後入廬山，與修睦、棲隱游。詩一卷，今存八首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%BE%85%E9%9A%B1.html" title="《寄處默師》">羅隱<small>×1</small></a><a class="chip" href="../authors/%E8%A3%B4%E8%AA%AA.html" title="《哭處默上人》">裴說<small>×1</small></a></div>
