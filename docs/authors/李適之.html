<h1>李適之<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李適之，一名昌，恆山王承乾之孫。開元中，累官通州刺史，擢秦州都督，轉陝州刺史，入爲河南尹，拜御史大夫，歷刑部尚書。天寶元年，代牛仙客爲左相，李林甫搆之，罷知政事，守太子少保，尋貶宜春太守。詩二首。</p></details>
