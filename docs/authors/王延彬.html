<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王延彬，閩王審知弟審邽之子，官節度使。時中原人士楊承休、鄭璘、韓偓、歸傳懿、楊贊圖、鄭戩等皆避亂入閩，依審邽，審邽振賦以財，遣延彬作招賢館禮焉。詩二首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BE%90%E5%A4%A4.html" title="《哭徐夤》">徐夤<small>×1</small></a></div>
