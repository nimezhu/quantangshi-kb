<h1>楊凝式<span class="vol-count">5 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊凝式，字景度，宰相涉之子。昭宗朝，登進士第，歷事唐、晉、漢、周，官至太子太保。詩三首。 楊凝式，字景度，宰相涉之子。昭宗朝，登進士第，歷事唐、晉、漢、周，官至太子太保。詩三首。</p></details>
