<h1>左偃<span class="vol-count">11 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>左偃，南唐人，不仕，居金陵。能詩，有《鍾山集》一卷，今存詩十首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E4%B8%AD.html" title="《寒江暮泊寄左偃》">李中<small>×6</small></a><a class="chip" href="../authors/%E6%9D%8E%E7%A7%98.html" title="《郊原晚望懷李秘書》">李秘<small>×1</small></a></div>
