<h1>韋表微<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋表微，字子明，擢進士第。數辟諸使府，入授監察御史裏行，俄爲翰林學士、知制誥。久之，遷中書舍人。文宗立，進戶部侍郎，卒，贈禮部尚書。詩一首。</p></details>
