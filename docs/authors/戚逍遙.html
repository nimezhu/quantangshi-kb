<h1>戚逍遙<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>戚逍遙，冀州南宮人。幼好道，父以女誡授逍遙，逍遙曰：“此常人之事耳。”遂取老子仙經誦之。年二十餘，適同邑蒯潯，不爲塵俗事，惟獨居一室，絕食靜想，作歌云云，人悉以爲妖。一夜，聞室內有人語聲。又三日，忽聞屋裂聲如雷，仰視天半，逍遙與仙衆俱在雲中，歷歷聞分別語，觀望無不驚歎。</p></details>
