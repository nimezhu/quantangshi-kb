<h1>令狐綯<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>令狐綯，字子直，楚之子。舉進士，擢累左補闕、右司郎中，出爲湖州刺史。大中初，召爲考功郎中、知制誥，入翰林爲學士，進中書舍人，再遷兵部侍郎，俄拜同中書門下平章事。懿宗嗣位，出爲河中節度使，徙宣武、淮南。僖宗時，終鳳翔節度使，封趙國公。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E8%B3%88%E5%B3%B6.html" title="《送令狐綯相公》">賈島<small>×3</small></a></div>
