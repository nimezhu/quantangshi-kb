<h1>紅綃妓<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>紅綃，大曆中勳臣家妓也。勳臣疾，崔生往省，勳臣令妓送出院，妓指鏡隱語。家奴磨勒曰：“此可致也。”夜負生，逾重垣入其院，見妓獨坐吟詩，遂負生與妓俱出，守禦無有覺者。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><span class="chip">崔生<small>×1</small></span></div>
