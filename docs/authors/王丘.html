<h1>王丘<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王丘，字仲山，相州安陽人。舉制科中第，自偃師主簿擢監察御史。開元初，遷紫微舍人，吏部侍郎，其獎用如孫逖、張晉明、王冷然，皆一時茂秀。蕭[嵩]暠引與當國，丘固辭，盛推韓休。休秉政，薦爲御史大夫，終禮部尚書。詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制答張說扈從南出鼠雀穀之作》">張說<small>×1</small></a></div>
