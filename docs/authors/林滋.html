<h1>林滋<span class="vol-count">6 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>林滋，字後象，閩人。會昌三年進士第，與同年詹雄、鄭諴齊名，時稱雄詩、諴文、滋賦爲閩中三絕。官終金部郎中。詩六首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%8E%8B%E8%B5%B7.html" title="《和主司王起》">王起<small>×1</small></a></div>
