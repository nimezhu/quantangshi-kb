<h1>富嘉謨<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>富嘉謨，雍州武功人，舉進士。長安中，累官晉陽尉，預修《三教珠英》。中興初，歷左臺御史，與吳少微友善，屬詞並以經典爲本，文體一變，號爲富吳體。張說稱其文如孤峰絕岸，壁立萬仞，濃雲鬱興，震雷俱發，誠可畏也。若施於廊廟，則駭矣。集十卷，今存詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%90%B3%E5%B0%91%E5%BE%AE.html" title="《哭富嘉謨》">吳少微<small>×1</small></a></div>
