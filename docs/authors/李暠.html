<h1>李暠<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李暠，清河王孝節孫。開元初汝州刺史，入爲太常少卿，三遷黃門侍郎，兼太原尹，仍充諸軍節度使，俄拜工部尚書，東都留守。持節使吐蕃，既還，金城公主請定漢蕃界，樹碑赤嶺，以奉使稱職，轉兵部尚書，終太子少傅。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制送張說上集賢學士賜宴》">張說<small>×1</small></a></div>
