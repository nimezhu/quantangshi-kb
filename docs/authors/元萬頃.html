<h1>元萬頃<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>元萬頃，洛陽人。後魏景穆皇帝之裔，起家通事舍人。乾封中，從英國公李勣征高麗，令作檄文，萬頃譏其不知守鴨綠之險，莫離支報曰：“謹聞命矣。”遂移兵守鴨綠，兵不得入，坐流嶺外，遇赦還，爲北門學士。則天時，遷鳳閣侍郎，坐與徐敬業兄弟友善，貶死。詩四首。</p></details>
