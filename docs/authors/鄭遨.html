<h1>鄭遨<span class="vol-count">15 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>鄭遨，字雲叟，滑州白馬人。昭宗時，舉進士，不第，入少室山爲道士。徙居華陰，種田自給，與道士李道殷、羅隱之友善，世目爲三高士。唐明宗以左拾遺，晉高祖以諫議大夫召，皆不起，賜號逍遙先生，天福中卒。詩十七首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E9%81%93%E5%8F%A4.html" title="《哭張道古》">張道古<small>×1</small></a></div>
