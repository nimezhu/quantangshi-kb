<h1>袁高<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>袁高，字公頤，恕己之孫，擢進士第。建中中，拜京畿觀察使，坐累，貶韶州刺史，復拜給事中。憲宗時，特贈禮部尚書。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E7%A7%A6%E7%B3%BB.html" title="《會稽山居寄薛播侍郎袁高給事高參舍人》">秦系<small>×1</small></a><a class="chip" href="../authors/%E7%9A%8E%E7%84%B6.html" title="《奉送袁高使君詔征赴行在，效曹劉體》">皎然<small>×1</small></a></div>
