<h1>許圉師<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>許圉師，安陸人。有器幹，博涉藝文，舉進士。顯慶中，累遷黃門侍郎，同中書門下三品，四遷爲左相，坐事，貶刺史。吏有犯贓，圉師賜清白詩以激之，遂改節爲廉士，其寬厚如此。詩一首。</p></details>
