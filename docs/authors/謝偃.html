<h1>謝偃<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>謝偃，衛縣人，本姓直勒氏，仕隋爲散從正員外。貞觀初，應詔對策及第，賀幸東都，詔求直諫，偃極言得失，太宗稱美，引爲弘文館直學士。爲《塵》、《影》二賦甚工，嘗奉詔撰《述聖賦》，又獻《惟皇誡德賦》以申諷。時李百藥工五言詩，偃善作賦，時人稱爲李詩、謝賦。出爲湘潭令。集十卷，今存詩四首。</p></details>
