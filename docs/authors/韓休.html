<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韓休，京兆長安人。舉賢良，累官禮部侍郎。開元二十一年，拜黃門侍郎，與蕭嵩同秉政。休敷陳治道，多鯁直，帝重之。終太子少師，諡文忠。詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%BC%B5%E8%AA%AA.html" title="《奉和聖制送張說巡邊》">張說<small>×1</small></a></div>
