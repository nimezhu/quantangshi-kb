<h1>步非煙<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>步非煙，河南功曹武公業妾也。鄰生趙象以詩誘之，非煙荅以詩。象因踰垣相從，事露，笞死。詩四首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><span class="chip">趙象<small>×2</small></span></div>
