<h1>郭正一<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>郭正一，定州彭城人。貞觀中，舉進士，累轉中書舍人，弘文館學士。永隆二年，遷祕書少監，檢校中書侍郎，與魏玄同、郭待舉並同中書門下平章事，宰相以平章事爲名，自正一等始也。則天時，出爲晉州刺史，後爲酷吏所陷，竄死嶺南。詩一首。</p></details>
