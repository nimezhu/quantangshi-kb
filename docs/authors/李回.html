<h1>李回<span class="vol-count">4 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李回，字昭度，本名躔。擢長慶進士，辟揚州掌書記，遷監察御史。會昌中，以刑部侍郎兼御史中丞，俄進中書侍郎同中書門下平章事，出爲劒南西川節度，以與李德裕善，貶撫州長史。詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E9%A0%8E.html" title="《雙筍歌送李回兼呈劉四》">李頎<small>×2</small></a></div>
