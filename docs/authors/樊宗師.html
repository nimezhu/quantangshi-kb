<h1>樊宗師<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>樊宗師，字紹述，河中人，始爲國子主簿。元和中，擢軍謀宏遠科，授著作佐郎，歷金部郎中、綿、絳二州刺史，進諫儀大夫，未拜，卒。詩七百六十九篇，今存一首。</p></details>
