<h1>劉鄴<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉鄴，字漢藩，三復之子。咸通中，從藩幕召入內庭，特賜及第，歷相位。僖宗朝，再遷尚書左僕射，死黃巢之難。《甘棠集》三卷，今存詩二首。</p></details>
