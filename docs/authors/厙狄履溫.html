<h1>厙狄履溫<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>厙狄履溫，官尚書員外郎，兼充節度判官。開元九年宇文融括田時，奏置勸農判官，以履溫等二十九人並攝御史，分行天下。詩一首。</p></details>
