<h1>劉迥<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>劉迥，字陽卿，知幾子，以剛直稱。大曆初吉州刺史，終諫議大夫、給事中。集五卷，今存詩四首。</p></details>
