<h1>趙宗儒<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>趙宗儒，字秉文，鄧州穰人。舉進士，初授弘文館校書郎，拜左拾遺，充翰林學士，與父曄秘書少監同日竝命，當時榮之。貞元十二年，以給事中同中書門下平章事。罷相，爲右庶子。端居守道，勤奉朝請，遷吏部侍郎，改尚書。前後三鎮方任，八領選部，歷憲、穆、敬、文四朝，以司空致仕。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%A7%9A%E7%B3%BB.html" title="《送陸渾主簿趙宗儒之任》">姚系<small>×1</small></a><a class="chip" href="../authors/%E4%B8%8D%E8%A9%B3.html" title="《清僧示趙宗儒》">不詳<small>×1</small></a></div>
