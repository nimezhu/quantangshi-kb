<h1>張垍<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>張垍，說次子。尚寧親公主，拜駙馬都尉。許於禁中置內宅，侍爲文章，坐事，出爲盧溪司馬，入爲太常卿。祿山亂，受僞相命，死賊中。詩一首。</p></details>
