<h1>王珪<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王珪，字叔玠，太原祁人。初爲太子舍人，太宗知其才，召拜諫議大夫。推誠納忠，多所獻替，遷黃門侍郎，進侍中，與房玄齡、李靖、溫彥博、戴胄、魏徵同知國政。嘗於上前品藻諸子，多所遜謝，至激濁揚清，嫉惡好善，自謂於數子有一日之長，帝深然之，時人亦服其確論。卒，贈吏部尚書。詩二首。</p></details>
