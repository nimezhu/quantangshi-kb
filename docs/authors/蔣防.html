<h1>蔣防<span class="vol-count">12 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蔣防，義興人，官右拾遺。元和中，李紳薦爲司封郎中、知制誥，進翰林學士。李逢吉逐紳，因出防爲汀州刺史。集一卷，今存詩十二首。</p></details>
