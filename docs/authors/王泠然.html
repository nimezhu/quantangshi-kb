<h1>王泠然<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王泠然，開元五年登第。王丘典吏部選時，嘗被獎拔，官校書郎。急於仕進，有《上張說書》，稱：“公之用人，蓋已多矣；僕之思用，其來久矣。僕雖不佞，亦相公一株桃李也。”詩四首。</p></details>
