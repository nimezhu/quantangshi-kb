<h1>裴次元<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>裴次元，貞元中第進士。元和中，爲福州刺史、河南尹，終江西觀察使。詩三首。</p></details>
