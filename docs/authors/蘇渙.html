<h1>蘇渙<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蘇渙，嘗訪杜甫於江浦，甫請誦新作，有詩美之。渙善放白弩，巴中號爲弩跖。後變節從學，鄉賦擢第。累遷至侍御史，佐湖南崔中丞瓘幕府。崔遇害，遂踰嶺，扇動哥舒晃跋扈交廣，伏誅。詩四首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%9C%E7%94%AB.html" title="《暮秋枉裴道州手劄，率爾遣興，寄近呈蘇渙侍禦》">杜甫<small>×1</small></a></div>
