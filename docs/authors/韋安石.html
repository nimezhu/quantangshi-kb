<h1>韋安石<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋安石，京兆萬年人，舉明經。久視中，以鸞臺侍郎同鳳閣鸞臺平章事，數折辱二張、三思。復相中宗，不附太平公主。睿宗時，爲姜皎所搆，貶卒。詩三首。</p></details>
