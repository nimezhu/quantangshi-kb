<h1>許碏<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>許碏，高陽人。累舉不第，學道於王屋，周遊名山洞府，到處於石崖峭壁人不及處題云：許碏自峨嵋山尋偃月子到此。筆蹤神異，竟莫詳偃月子也。遊廬江，醉吟一詩，人皆笑爲風狂，後插花作舞，上酒樓醉歌，昇仙去。</p></details>
