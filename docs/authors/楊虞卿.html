<h1>楊虞卿<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊虞卿，字師臯，弘農人。元和五年擢進士第，爲校書郎，擢監察御史。牛僧孺、李宗閔輔政，引爲弘文館學士、給事中，號爲黨魁，歷工部侍郎、京兆尹。貶虔州司戶卒。詩一首。</p></details>
