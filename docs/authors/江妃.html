<h1>江妃<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>妃名采蘋，莆田人。開元初，高力士選歸，侍明皇，大見寵幸。善屬文，自比謝女。所居悉植梅花，帝因其所好，戲名梅妃。有詩一篇。</p></details>
