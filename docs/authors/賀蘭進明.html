<h1>賀蘭進明<span class="vol-count">3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>賀蘭進明，開元十六年進士。祿山亂，以御史大夫爲節度使，守臨淮。張巡被圍睢陽，遣南霽雲乞師。進明嫉巡聲威，不應，巡遂陷沒。肅宗時，爲北海太守，詣行在。上以爲南海太守，攝御史大夫，嶺南節度使，後貶秦州司馬。詩七首。</p></details>
