<h1>董思恭<span class="vol-count">19 首 · 见于 3 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>董思恭，蘇州吳人，高宗時官中書舍人。初爲右史，後知考功舉，坐事流嶺表。所著篇詠，爲時所重。今存詩十九首。</p></details>
