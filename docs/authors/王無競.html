<h1>王無競<span class="vol-count">7 首 · 见于 3 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>王無競，字仲烈，東萊人。氣豪縱，舉下筆成章科。初授縣尉，累遷殿中御史，預修《三教珠英》。神龍初，出爲蘇州司馬，後坐交張易之等再貶嶺南。詩五首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E5%AE%8B%E4%B9%8B%E5%95%8F.html" title="《和宋之問下山歌》">宋之問<small>×1</small></a></div>
