<h1>長孫氏<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>太宗后，長孫氏，河南洛陽人。隋左驍衛將軍晟之女。武德九年，立爲皇后。喜圖傳，視古今善惡以自鑒。矜尚禮法，常采古婦人事，作《女則》一篇，今存詩一首。</p></details>
