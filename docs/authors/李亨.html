<h1>李亨<span class="vol-count">711–762 · 3 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>帝諱亨，明皇第三子，初名嗣昇，封陝王。開元十五年，更名浚，徙封忠王。二十三年，又更名璵。明年，立爲皇太子。二十八年，又更名紹。天寶三載，乃更名亨。明皇幸蜀，即位於靈武。聰明彊記，屬詞典麗。在位七年，諡曰宣。詩四首。</p></details>
