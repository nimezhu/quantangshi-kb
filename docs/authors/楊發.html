<h1>楊發<span class="vol-count">13 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>楊發，字至之，馮翊人。以父遺直客蘇州，因家焉。登太和四年進士第，歷太常少卿，出爲蘇州刺史，即其鄉里也。後爲嶺南節度使，以嚴爲治，軍亂，貶婺州刺史。詩十三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E8%A8%B1%E6%B8%BE.html" title="《送楊發東歸》">許渾<small>×1</small></a></div>
