<h1>韋渠牟<span class="vol-count">4 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>韋渠牟，京兆萬年人。少慧悟，涉覽經史。初爲道士，後爲僧。韓滉表試校書郎，德宗誕日，召之，同佛老師講論大義，愛其辨博，因奏七十詣詩。旬日，再轉右補闕、內供奉，遷諫議大夫。數召對奏事，終大常卿。詩集十卷，今存二十一首。</p></details>
