<h1>郭密之<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>郭密之，天寶中諸暨縣令。建義津橋，築放生湖，溉田二千餘頃，民便之。補詩一首。（《兩浙金石志》及《青田縣志》載郭密之詩二首，其一爲《使永嘉經謝公石門山作》，《全唐詩》卷八八七《補遺》六亦收之，無小傳，與兩書文字多出入，特以校稿附於後。其二爲《永嘉懷古》則《全唐詩》所未收。）</p></details>
