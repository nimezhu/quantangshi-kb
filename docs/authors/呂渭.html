<h1>呂渭<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>呂渭，字君載，河中人。第進士，爲浙西支使，後貶歙州司馬。貞元中，累遷禮部侍郎，出爲潭州刺史。詩五首。</p></details>
