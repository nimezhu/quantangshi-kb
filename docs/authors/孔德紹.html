<h1>孔德紹<span class="vol-count">12 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>孔德紹，會稽人，有清才，事竇建德。初爲景城丞，後爲內史侍郎，典書檄。建德敗，太宗誅之。詩十二首。</p></details>
