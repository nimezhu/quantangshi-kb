<h1>盧士衡<span class="vol-count">9 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧士衡，後唐天成二年進士。集一卷，今存詩七首。 盧士衡，全國唐天成二年進士，集一卷，今存詩七首。 盧士衡，後唐天成二年進士。補詩一首。</p></details>
