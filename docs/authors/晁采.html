<h1>晁采<span class="vol-count">5 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>晁采，小字試鶯，大曆時人，少與鄰生文茂約爲伉儷。及長，茂時寄詩通情，采以蓮子達意，墜一於盆，踰旬，開花並蒂。茂以報采，乘間歡合。母得其情，歎曰：“才子佳人，自應有此。”遂以采歸茂。詩二十二首。</p></details>
