<h1>李宗閔<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李宗閔，字損之，擢進士，補洛陽尉。累官駕部郎中、知制誥。穆宗即位，拜中書舍人。寶曆初，進兵部侍郎。太和中，同中書門下平章事，遷中書侍郎，出爲山南西道節度使，尋復秉政，後貶死。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%9F%93%E6%84%88.html" title="《南山有高樹行贈李宗閔》">韓愈<small>×1</small></a></div>
