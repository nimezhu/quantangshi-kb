<h1>徐賢妃<span class="vol-count">6 首 · 见于 2 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>妃名惠，湖州長城人，生五月能言，四歲通論語詩，八歲自曉屬文。辭致贍蔚，又無淹思，太宗召爲才人，再遷充容。常上疏論時政，帝善其言，優賜之。永徽元年，贈賢妃。詩五首。</p></details>
