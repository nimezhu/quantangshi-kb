<h1>羅讓<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>羅讓，字景宣，迥之子。少以文學知名，舉進士、宏辭、賢良方正，皆高第。歷尚書郎，散騎常侍，終江西觀察使。集三十卷，今存詩二首。</p></details>
