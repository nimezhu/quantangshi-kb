<h1>李迥秀<span class="vol-count">4 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>李迥秀，字茂之，涇陽人。初爲相州參軍，後累官鳳閣舍人。長安中，同平章事。中宗朝，終兵部尚書，卒，贈侍中。詩四首。</p></details>
