<h1>崔素娥<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔素娥，韋洵美妾。鄴都羅紹威辟洵美爲從事，素娥隨行。紹威聞其姝麗，逼獻之，素娥爲詩以別。其夜，洵美獨宿長吁，有同行者，問知其事，歘然而去。至三更，以皮囊貯素娥至，洵美遂挾以他遁。詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><span class="chip">韋洵美<small>×1</small></span></div>
