<h1>皇甫湜<span class="vol-count">3 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>皇甫湜，字持正，新安人。元和中擢進士第，爲陸渾尉，仕至工部郎中。裴度辟爲判官。集三卷，今存詩三首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%9F%93%E6%84%88.html" title="《陸渾山火和皇甫湜用其韻》">韓愈<small>×2</small></a><a class="chip" href="../authors/%E6%9D%8E%E8%B3%80.html" title="《仁和裏雜敘皇甫湜》">李賀<small>×2</small></a><a class="chip" href="../authors/%E9%A6%AC%E7%95%B0.html" title="《送皇甫湜赴舉》">馬異<small>×1</small></a></div>
