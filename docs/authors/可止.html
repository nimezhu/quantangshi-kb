<h1>可止<span class="vol-count">860–934 · 10 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>可止，姓馬氏，范陽房山人，長近體律詩。乾寧中，賜紫。後唐明宗令住持洛京長壽寺，署號文智大師。有《三山集》，今存詩九首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E8%B3%88%E5%B3%B6.html" title="《哭賈島》">賈島<small>×1</small></a></div>
