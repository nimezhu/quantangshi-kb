<h1>蓮花妓<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>蓮花妓，豫章人也。陳陶隱南昌西山，鎮帥嚴宇嘗遣之侍陶，陶不顧，因求去，獻詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E9%99%B3%E9%99%B6.html" title="《答蓮花妓》">陳陶<small>×1</small></a></div>
