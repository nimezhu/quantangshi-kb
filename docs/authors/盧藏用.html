<h1>盧藏用<span class="vol-count">8 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>盧藏用，字子潛，幽州范陽人。舉進士，不調，隱居終南。長安中，召授左拾遺。中宗朝，歷中書舍人，黃門侍郎，修文館學士，以附太平公主，流驩州。詩八首。</p></details>
