<h1>崔元略<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>崔元略，博州人。第進士，更辟諸府，累遷殿中侍御史，進中丞，改京兆少尹，歷散騎常侍，出爲黔南觀察使。敬宗初，拜戶部侍郎。太和三年，以戶部尚書判度支，留守東都。改義成節度使，卒，贈左僕射。詩一首。</p></details>
