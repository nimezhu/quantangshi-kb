<h1>來濟<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>來濟，江都人，隋大將軍護[兒]之子也。宇文化及之難，護[兒]闔門遇害。濟流離艱險，篤志好學，舉進士。貞觀中，初置太子司議郎，妙選人望，遂以濟爲之，遷中書舍人，與令狐德棻等同撰《晉書》。永徽中，拜中書令，出爲庭州刺史。與突厥戰，陣沒。集三十卷，今存詩一首。</p></details><h2 class="section-title">交游（据诗题）</h2><div class="poet-chips"><a class="chip" href="../authors/%E6%9D%8E%E4%B8%96%E6%B0%91.html" title="《餞中書侍郎來濟》">李世民<small>×1</small></a><a class="chip" href="../authors/%E8%A8%B1%E6%95%AC%E5%AE%97.html" title="《奉和聖制送來濟應制》">許敬宗<small>×1</small></a><a class="chip" href="../authors/%E5%AE%8B%E4%B9%8B%E5%95%8F.html" title="《餞中書侍郎來濟》">宋之問<small>×1</small></a></div>
