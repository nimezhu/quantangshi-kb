<h1>薛業<span class="vol-count">2 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>薛業，天寶間處士。西遊廬山，趙補闕驊、王侍御定、張評事有略，各以文爲贈，獨孤及嘗稱其敦於詩。困於學，敏於行，口弗言祿，祿亦不及。識其真者，以爲永歎。詩二首。</p></details>
