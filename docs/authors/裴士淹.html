<details class="biography"><summary>小传（全唐诗数据库）</summary><p>裴士淹，開元末，嘗爲郎官。詩一首 裴士淹，開元間嘗爲司封員外郎，轉司勳郎中（據《郎祁石拄題名》）。補詩一首。</p></details>
