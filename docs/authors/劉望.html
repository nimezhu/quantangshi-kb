<h1>劉望<span class="vol-count">1 首 · 见于 1 卷</span></h1>
<details class="biography"><summary>小传（全唐诗数据库）</summary><p>望，袁州萬載人。唐末進士及第，與鍾傳同時。補詩一首。（《全唐詩》卷七七五收劉望詩一首，列爲世次爵里俱無考作者。今據徐松《登科記考》卷二七引《永樂大典》引《宜春志》及下補詩敘其事跡。鍾傳卒於天祐三年。）</p></details>
